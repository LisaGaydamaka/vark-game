name: Validate Phase 3.5 tangent-only moving mantle correction
on:
  push:
    branches: [test]
    paths: [.github/workflows/validate_phase_3_5_mantle_attachment_v7.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with: {ref: test, fetch-depth: 0}
      - name: Reuse proven angled regression patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/validate_phase_3_5_mantle_attachment_v5.yml').read_text()
          marker='      - name: Apply angled production-contact regression\n'
          start=s.index(marker)
          end=s.index('      - uses: chickensoft-games/setup-godot@v2\n', start)
          block=s[start:end]
          py_start=block.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          py_end=block.rindex('\n          PY')
          exec(textwrap.dedent(block[py_start:py_end]), {})
          PY
      - uses: chickensoft-games/setup-godot@v2
        with: {version: 4.7.2, use-dotnet: false, include-templates: false}
      - run: godot --headless --path . --import
      - name: Confirm proven regression is red
        shell: bash
        run: |
          set -euo pipefail
          set +e
          godot --headless --path . --script res://tests/props/run_prop_tests.gd 2>&1 | tee /tmp/pre.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'FAIL: Moving-prop mantle keeps the player attachment-relative during lateral crate translation' /tmp/pre.log
      - name: Apply tangent-only source motion inheritance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('player/traversal/player_mantle.gd'); t=p.read_text()
          def r(a,b):
              global t
              if t.count(a)!=1: raise SystemExit(f'mantle match count {t.count(a)}')
              t=t.replace(a,b,1)
          r('func _refresh_active_attachment_route() -> bool:\n','func _refresh_active_attachment_route(player: CharacterBody3D) -> bool:\n')
          r('\tvar current_transform: Transform3D = source.attachment_collider_transform\n\tif current_transform.is_equal_approx(previous_transform):\n\t\treturn true\n\n\tvar previous_inverse: Transform3D = previous_transform.affine_inverse()\n',
            '\tvar current_transform: Transform3D = source.attachment_collider_transform\n'
            '\tif current_transform.is_equal_approx(previous_transform):\n\t\treturn true\n\n'
            '\t# Lift and forward phases already chase their refreshed route axes. The\n'
            '\t# unrepresented source motion is along the ledge tangent, so inherit only\n'
            '\t# that component before refreshing geometry. This keeps an angled moving\n'
            '\t# prop under the player without double-applying forward/lift translation.\n'
            '\tvar source_motion: Vector3 = current_transform.origin - previous_transform.origin\n'
            '\tvar tangent_axis: Vector3 = active_candidate.traversal_axis.normalized()\n'
            '\tvar tangent_motion: Vector3 = tangent_axis * source_motion.dot(tangent_axis)\n'
            '\tif tangent_motion.length_squared() > MOTION_EPSILON_SQUARED:\n'
            '\t\tvar tangent_collision: KinematicCollision3D = player.move_and_collide(\n'
            '\t\t\ttangent_motion, false, PROBE_SAFE_MARGIN, false, PROBE_MAX_COLLISIONS\n'
            '\t\t)\n'
            '\t\tif tangent_collision != null:\n'
            '\t\t\tvar tangent_travel: Vector3 = tangent_collision.get_travel()\n'
            '\t\t\tif tangent_travel.distance_to(tangent_motion) > get_route_progress_tolerance():\n'
            '\t\t\t\treturn false\n\n'
            '\tvar previous_inverse: Transform3D = previous_transform.affine_inverse()\n')
          r('\tif not _refresh_active_attachment_route():\n','\tif not _refresh_active_attachment_route(player):\n')
          p.write_text(t)
          PY
      - name: Verify focused Props
        run: godot --headless --path . --script res://tests/props/run_prop_tests.gd
      - name: Verify focused Movement
        run: godot --headless --path . --script res://tests/movement/run_movement_tests.gd
      - name: Verify authoritative full barrier
        run: godot --headless --path . --script res://tests/run_all_tests.gd
