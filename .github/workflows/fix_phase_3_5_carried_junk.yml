          \t\tif prop.call("get_semantic_phase") == target_phase:
          \t\t\treturn
          \t\tawait tree.physics_frame
          \t\tawait tree.process_frame


          func _settle_physics(tree: SceneTree, frame_count: int = 1) -> void:
          \tfor _frame_index: int in frame_count:
          \t\tawait tree.physics_frame
          \t\tawait tree.process_frame


          func _max_impact_strength(events: Array[Dictionary], start_index: int) -> float:
          \tvar result: float = 0.0
          \tfor index: int in range(start_index, events.size()):
          \t\tvar payload: Dictionary = events[index].get("payload", {})
          \t\tif payload.get("kind", &"") == OrdinaryProp.IMPACT_SOUND_KIND:
          \t\t\tresult = maxf(result, float(payload.get("strength", 0.0)))
          \treturn result


          func _contains_live_object(value: Variant) -> bool:
          \tif value is Object:
          \t\treturn true
          \tif value is Array:
          \t\tfor child: Variant in value:
          \t\t\tif _contains_live_object(child):
          \t\t\t\treturn true
          \tif value is Dictionary:
          \t\tfor key: Variant in value.keys():
          \t\t\tif _contains_live_object(key) or _contains_live_object(value[key]):
          \t\t\t\treturn true
          \treturn false


          func _obj_faces_point_outward(path: String) -> bool:
          \tvar source: String = FileAccess.get_file_as_string(path)
          \tvar vertices: Array[Vector3] = []
          \tvar faces: Array[PackedInt32Array] = []
          \tfor raw_line: String in source.split("\\n"):
          \t\tvar line: String = raw_line.strip_edges()
          \t\tif line.begins_with("v "):
          \t\t\tvar p: PackedStringArray = line.split(" ", false)
          \t\t\tvertices.append(Vector3(float(p[1]), float(p[2]), float(p[3])))
          \t\telif line.begins_with("f "):
          \t\t\tvar parts: PackedStringArray = line.split(" ", false)
          \t\t\tvar face := PackedInt32Array()
          \t\t\tfor i: int in range(1, parts.size()):
          \t\t\t\tface.append(int(parts[i].split("/")[0]) - 1)
          \t\t\tfaces.append(face)
          \tif vertices.is_empty() or faces.is_empty():
          \t\treturn false
          \tvar center := Vector3.ZERO
          \tfor vertex: Vector3 in vertices:
          \t\tcenter += vertex
          \tcenter /= float(vertices.size())
          \tfor face: PackedInt32Array in faces:
          \t\tif face.size() < 3:
          \t\t\treturn false
          \t\tvar a: Vector3 = vertices[face[0]]
          \t\tvar b: Vector3 = vertices[face[1]]
          \t\tvar c: Vector3 = vertices[face[2]]
          \t\tvar normal: Vector3 = (b - a).cross(c - a).normalized()
          \t\tvar face_center := Vector3.ZERO
          \t\tfor index: int in face:
          \t\t\tface_center += vertices[index]
          \t\tface_center /= float(face.size())
          \t\tif normal.dot(face_center - center) <= 0.0:
          \t\t\treturn false
          \treturn true


