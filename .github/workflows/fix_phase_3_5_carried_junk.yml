name: Fix Phase 3.5 carried Junk

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  fix-phase-3-5-carried-junk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Apply carried Junk implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          write('application/application_input_boundary.gd', '''class_name ApplicationInputBoundary
          extends Node


          signal application_input_received(event: InputEvent)


          var current_player: Node = null
          var gameplay_enabled: bool = false
          var look_enabled: bool = false

          var _last_sampled_physics_frame: int = -1
          var _last_locomotion_command: PlayerCommand = PlayerCommand.new()
          var _jump_blocked_until_release: bool = false
          var _crouch_blocked_until_release: bool = false
          var _interact_blocked_until_release: bool = false
          var _release_prop_blocked_until_release: bool = false
          var _last_interaction_sampled_physics_frame: int = -1
          var _last_interaction_pressed: bool = false
          var _last_prop_release_sampled_physics_frame: int = -1
          var _last_prop_release_pressed: bool = false


          func bind_player(player: Node) -> void:
          \tif current_player == player:
          \t\treturn

          \tif current_player != null and is_instance_valid(current_player):
          \t\tcurrent_player.call("set_interaction_input_enabled", false)
          \t\tcurrent_player.call("bind_gameplay_input_boundary", null)

          \tcurrent_player = player
          \t_last_sampled_physics_frame = -1
          \t_last_locomotion_command = PlayerCommand.new()
          \t_last_interaction_sampled_physics_frame = -1
          \t_last_interaction_pressed = false
          \t_last_prop_release_sampled_physics_frame = -1
          \t_last_prop_release_pressed = false

          \tif current_player != null:
          \t\tcurrent_player.call("bind_gameplay_input_boundary", self)
          \t\tcurrent_player.call("set_interaction_input_enabled", gameplay_enabled)
          \t\tif look_enabled:
          \t\t\tcurrent_player.call("capture_look_mouse")


          func set_gameplay_enabled(enabled: bool) -> void:
          \tif gameplay_enabled == enabled:
          \t\treturn

          \tgameplay_enabled = enabled
          \t_last_sampled_physics_frame = -1
          \t_last_locomotion_command = PlayerCommand.new()
          \t_last_interaction_sampled_physics_frame = -1
          \t_last_interaction_pressed = false
          \t_last_prop_release_sampled_physics_frame = -1
          \t_last_prop_release_pressed = false
          \tif current_player != null and is_instance_valid(current_player):
          \t\tcurrent_player.call("set_interaction_input_enabled", enabled)

          \tif enabled:
          \t\t_jump_blocked_until_release = Input.is_action_pressed("jump") or Input.is_action_just_pressed("jump")
          \t\t_crouch_blocked_until_release = Input.is_action_pressed("crouch") or Input.is_action_just_pressed("crouch")
          \t\t_interact_blocked_until_release = Input.is_action_pressed("interact") or Input.is_action_just_pressed("interact")
          \t\t_release_prop_blocked_until_release = Input.is_action_pressed("release_prop") or Input.is_action_just_pressed("release_prop")
          \t\treturn

          \t_jump_blocked_until_release = Input.is_action_pressed("jump")
          \t_crouch_blocked_until_release = Input.is_action_pressed("crouch")
          \t_interact_blocked_until_release = Input.is_action_pressed("interact")
          \t_release_prop_blocked_until_release = Input.is_action_pressed("release_prop")
          \tif current_player != null and is_instance_valid(current_player):
          \t\tcurrent_player.call("cancel_gameplay_input_gestures")


          func set_look_enabled(enabled: bool) -> void:
          \tif look_enabled == enabled:
          \t\treturn
          \tlook_enabled = enabled
          \tif enabled:
          \t\tif current_player != null and is_instance_valid(current_player):
          \t\t\tcurrent_player.call("capture_look_mouse")
          \t\treturn
          \tInput.mouse_mode = Input.MOUSE_MODE_VISIBLE


          func sample_locomotion_command() -> PlayerCommand:
          \tvar physics_frame: int = Engine.get_physics_frames()
          \tif physics_frame == _last_sampled_physics_frame:
          \t\treturn _last_locomotion_command
          \t_last_sampled_physics_frame = physics_frame
          \tvar command := PlayerCommand.new()
          \tif not gameplay_enabled:
          \t\t_last_locomotion_command = command
          \t\treturn _last_locomotion_command
          \tcommand.movement_vector = Input.get_vector("move_left", "move_right", "move_forward", "move_backward")
          \tcommand.sprint_held = Input.is_action_pressed("sprint")
          \tvar jump_held: bool = Input.is_action_pressed("jump")
          \tif _jump_blocked_until_release:
          \t\tif not jump_held:
          \t\t\t_jump_blocked_until_release = false
          \telse:
          \t\tcommand.jump_pressed = Input.is_action_just_pressed("jump")
          \t\tcommand.jump_held = jump_held
          \tvar crouch_held: bool = Input.is_action_pressed("crouch")
          \tif _crouch_blocked_until_release:
          \t\tif not crouch_held:
          \t\t\t_crouch_blocked_until_release = false
          \telse:
          \t\tcommand.crouch_pressed = Input.is_action_just_pressed("crouch")
          \t_last_locomotion_command = command
          \treturn _last_locomotion_command


          func sample_interaction_pressed() -> bool:
          \tvar physics_frame: int = Engine.get_physics_frames()
          \tif physics_frame == _last_interaction_sampled_physics_frame:
          \t\treturn _last_interaction_pressed
          \t_last_interaction_sampled_physics_frame = physics_frame
          \t_last_interaction_pressed = false
          \tif not gameplay_enabled:
          \t\treturn false
          \tvar held: bool = Input.is_action_pressed("interact")
          \tif _interact_blocked_until_release:
          \t\tif not held:
          \t\t\t_interact_blocked_until_release = false
          \t\treturn false
          \t_last_interaction_pressed = Input.is_action_just_pressed("interact")
          \treturn _last_interaction_pressed


          func sample_prop_release_pressed() -> bool:
          \tvar physics_frame: int = Engine.get_physics_frames()
          \tif physics_frame == _last_prop_release_sampled_physics_frame:
          \t\treturn _last_prop_release_pressed
          \t_last_prop_release_sampled_physics_frame = physics_frame
          \t_last_prop_release_pressed = false
          \tif not gameplay_enabled:
          \t\treturn false
          \tvar held: bool = Input.is_action_pressed("release_prop")
          \tif _release_prop_blocked_until_release:
          \t\tif not held:
          \t\t\t_release_prop_blocked_until_release = false
          \t\treturn false
          \t_last_prop_release_pressed = Input.is_action_just_pressed("release_prop")
          \treturn _last_prop_release_pressed


          func route_input_event(event: InputEvent) -> void:
          \tapplication_input_received.emit(event)
          \tif event is InputEventKey and event.pressed and event.keycode == KEY_ESCAPE:
          \t\tInput.mouse_mode = Input.MOUSE_MODE_VISIBLE
          \t\treturn
          \tif not look_enabled:
          \t\treturn
          \tif current_player == null or not is_instance_valid(current_player):
          \t\treturn
          \tcurrent_player.call("handle_look_input", event)


          func get_current_view_pose() -> Dictionary:
          \tif current_player == null or not is_instance_valid(current_player):
          \t\treturn {}
          \tvar pose: Dictionary = current_player.call("get_input_view_pose")
          \treturn pose.duplicate(true)


          func _unhandled_input(event: InputEvent) -> void:
          \troute_input_event(event)
          '''.replace('          ', ''))

          write('player/interaction/player_prop_carry.gd', '''class_name PlayerPropCarry
          extends RefCounted


          var player: CharacterBody3D
          var camera: Camera3D
          var held_prop: Node = null
          var hud_container: Control
          var hud_mesh: MeshInstance3D
          var hud_material: StandardMaterial3D

          var release_distance: float = 1.15
          var release_clearance: float = 0.34
          var release_speed: float = 0.55


          func _init(
          \towner: CharacterBody3D,
          \tview_camera: Camera3D,
          \tcarried_hud_container: Control,
          \tcarried_hud_mesh: MeshInstance3D,
          \tcarried_hud_material: StandardMaterial3D
          ) -> void:
          \tplayer = owner
          \tcamera = view_camera
          \thud_container = carried_hud_container
          \thud_mesh = carried_hud_mesh
          \thud_material = carried_hud_material
          \t_refresh_hud(null)


          func has_held_prop() -> bool:
          \treturn held_prop != null and is_instance_valid(held_prop)


          func get_held_prop() -> Node:
          \treturn held_prop if has_held_prop() else null


          func try_pick_up(prop: Node) -> bool:
          \tif has_held_prop() or prop == null or not (prop is Node3D):
          \t\treturn false
          \tif not prop.has_method("begin_carried_junk") or not prop.has_method("release_from_carry"):
          \t\treturn false
          \tif not bool(prop.call("begin_carried_junk", player)):
          \t\treturn false
          \theld_prop = prop
          \t_refresh_hud(prop)
          \treturn true


          func adopt_restored_held_prop(prop: Node) -> bool:
          \tif has_held_prop() or prop == null or not (prop is Node3D):
          \t\treturn false
          \tif not prop.has_method("get_semantic_phase") or prop.call("get_semantic_phase") != &"carried_junk":
          \t\treturn false
          \theld_prop = prop
          \t_refresh_hud(prop)
          \treturn true


          func release_held_gently() -> bool:
          \tif not has_held_prop():
          \t\treturn false
          \tvar forward: Vector3 = -camera.global_transform.basis.z.normalized()
          \tvar initial_velocity: Vector3 = forward * release_speed + player.velocity * 0.15
          \treturn _release(&"released", initial_velocity)


          func throw_held() -> bool:
          \tif not has_held_prop():
          \t\treturn false
          \tvar speed: float = maxf(float(held_prop.get("throw_speed")), 0.0)
          \tvar forward: Vector3 = -camera.global_transform.basis.z.normalized()
          \tvar initial_velocity: Vector3 = forward * speed + player.velocity
          \treturn _release(&"thrown", initial_velocity)


          func clear_reference() -> void:
          \theld_prop = null
          \t_refresh_hud(null)


          func _release(motion_kind: StringName, initial_velocity: Vector3) -> bool:
          \tvar prop: Node = held_prop
          \tvar released: bool = bool(prop.call(
          \t\t"release_from_carry",
          \t\tmotion_kind,
          \t\t_compute_release_transform(),
          \t\tinitial_velocity
          \t))
          \tif released:
          \t\theld_prop = null
          \t\t_refresh_hud(null)
          \treturn released


          func _compute_release_transform() -> Transform3D:
          \tvar view_basis: Basis = camera.global_transform.basis.orthonormalized()
          \tvar forward: Vector3 = -view_basis.z.normalized()
          \tvar origin: Vector3 = camera.global_position
          \tvar desired: Vector3 = origin + forward * release_distance
          \tvar query := PhysicsRayQueryParameters3D.create(origin, desired)
          \tquery.exclude = [player.get_rid()]
          \tquery.collision_mask = 0xFFFFFFFF
          \tquery.collide_with_areas = false
          \tquery.collide_with_bodies = true
          \tvar hit: Dictionary = camera.get_world_3d().direct_space_state.intersect_ray(query)
          \tif not hit.is_empty():
          \t\tdesired = hit.get("position", desired) - forward * release_clearance
          \tvar release_basis: Basis = (
          \t\tview_basis * Basis(Vector3.BACK, PI * 0.5)
          \t).orthonormalized()
          \treturn Transform3D(release_basis, desired)


          func _refresh_hud(prop: Node) -> void:
          \tif hud_container == null or hud_mesh == null:
          \t\treturn
          \tvar active: bool = prop != null and is_instance_valid(prop)
          \thud_container.visible = active
          \tif not active:
          \t\thud_mesh.mesh = null
          \t\treturn
          \tif prop.has_method("get_visual_model"):
          \t\thud_mesh.mesh = prop.call("get_visual_model") as Mesh
          \tif hud_material != null:
          \t\thud_material.albedo_color = prop.get("base_color") as Color
          '''.replace('          ', ''))

          write('gameplay/props/ordinary_prop.gd', '''class_name VarkOrdinaryProp
          extends CharacterBody3D


          const PHASE_SETTLED: StringName = &"settled"
          const PHASE_CARRIED_JUNK: StringName = &"carried_junk"
          const PHASE_MOVING: StringName = &"moving"
          const PHASE_SETTLING: StringName = &"settling"

          const MOTION_NONE: StringName = &"none"
          const MOTION_RELEASED: StringName = &"released"
          const MOTION_THROWN: StringName = &"thrown"
          const MOTION_UNSUPPORTED: StringName = &"unsupported"

          const IMPACT_SOUND_KIND: StringName = &"prop.impact"


          @export var prop_id: StringName = &"prop"
          @export var visual_model: Mesh
          @export var base_color: Color = Color(0.42, 0.27, 0.12, 1.0)
          @export var gravity: float = 16.0
          @export var terminal_fall_speed: float = 18.0
          @export var throw_speed: float = 6.0
          @export var impact_sound_strength: float = 0.55
          @export var gentle_release_sound_scale: float = 0.35
          @export var support_probe_distance: float = 0.14
          @export var support_probe_inset: float = 1.0
          @export var minimum_support_normal_y: float = 0.55

          @onready var prop_mesh: MeshInstance3D = $PropMesh
          @onready var prop_collision: CollisionShape3D = $CollisionShape3D

          var _phase: StringName = PHASE_SETTLED
          var _motion_kind: StringName = MOTION_NONE
          var _highlighted: bool = false
          var _material: StandardMaterial3D = null
          var _world_session: Node = null
          var _holder: Node = null
          var _settling_frames_remaining: int = 0
          var _unsupported_frames: int = 0
          var _ordinary_collision_layer: int = 1
          var _ordinary_collision_mask: int = 1
          var _canonical_basis: Basis = Basis.IDENTITY


          func _ready() -> void:
          \tadd_to_group(&"vark_interactable")
          \t_ordinary_collision_layer = collision_layer
          \t_ordinary_collision_mask = collision_mask
          \t_canonical_basis = global_transform.basis.orthonormalized()
          \t_world_session = _find_world_session()
          \t_material = StandardMaterial3D.new()
          \t_material.cull_mode = BaseMaterial3D.CULL_BACK
          \tprop_mesh.material_override = _material
          \tif not set_visual_model(visual_model):
          \t\tpush_error("VarkOrdinaryProp requires a configured visual_model Mesh.")
          \t_refresh_visual()


          func _physics_process(delta: float) -> void:
          \tmatch _phase:
          \t\tPHASE_SETTLED:
          \t\t\tvelocity = Vector3.ZERO
          \t\t\tif _has_support():
          \t\t\t\t_unsupported_frames = 0
          \t\t\telse:
          \t\t\t\t_unsupported_frames += 1
          \t\t\t\tif _unsupported_frames >= 2:
          \t\t\t\t\t_begin_motion(MOTION_UNSUPPORTED, Vector3.ZERO)
          \t\tPHASE_CARRIED_JUNK:
          \t\t\tvelocity = Vector3.ZERO
          \t\t\t_unsupported_frames = 0
          \t\tPHASE_MOVING:
          \t\t\t_unsupported_frames = 0
          \t\t\t_advance_motion(delta)
          \t\tPHASE_SETTLING:
          \t\t\tvelocity = Vector3.ZERO
          \t\t\t_unsupported_frames = 0
          \t\t\t_settling_frames_remaining -= 1
          \t\t\tif _settling_frames_remaining <= 0:
          \t\t\t\t_phase = PHASE_SETTLED
          \t\t\t\t_motion_kind = MOTION_NONE
          \t\t\t\tglobal_transform = Transform3D(_canonical_basis, global_position)


          func can_interact(interactor: Node) -> bool:
          \treturn _phase != PHASE_CARRIED_JUNK and interactor != null and interactor.has_method("try_carry_prop")


          func interact(interactor: Node) -> void:
          \tif can_interact(interactor):
          \t\tinteractor.call("try_carry_prop", self)


          func set_interaction_highlighted(highlighted: bool) -> void:
          \t_highlighted = highlighted
          \t_refresh_visual()


          func is_interaction_highlighted() -> bool:
          \treturn _highlighted


          func set_visual_model(model: Mesh) -> bool:
          \tif model == null:
          \t\treturn false
          \tvisual_model = model
          \tif prop_mesh != null:
          \t\tprop_mesh.mesh = model
          \treturn true


          func get_visual_model() -> Mesh:
          \treturn visual_model


          func get_semantic_phase() -> StringName:
          \treturn _phase


          func get_motion_kind() -> StringName:
          \treturn _motion_kind


          func is_supported() -> bool:
          \tif _phase == PHASE_CARRIED_JUNK:
          \t\treturn false
          \treturn _has_support()


          func is_world_presentation_enabled() -> bool:
          \treturn prop_mesh != null and prop_mesh.visible and collision_layer != 0 and collision_mask != 0


          func begin_carried_junk(holder: Node) -> bool:
          \tif holder == null or _phase == PHASE_CARRIED_JUNK:
          \t\treturn false
          \t_holder = holder
          \t_phase = PHASE_CARRIED_JUNK
          \t_motion_kind = MOTION_NONE
          \t_settling_frames_remaining = 0
          \t_unsupported_frames = 0
          \tvelocity = Vector3.ZERO
          \tset_interaction_highlighted(false)
          \t_set_world_presentation_enabled(false)
          \treturn true


          func release_from_carry(
          \tmotion_kind: StringName,
          \trelease_transform: Transform3D,
          \tinitial_velocity: Vector3
          ) -> bool:
          \tif _phase != PHASE_CARRIED_JUNK:
          \t\treturn false
          \tif motion_kind != MOTION_RELEASED and motion_kind != MOTION_THROWN:
          \t\treturn false
          \tif not _is_finite_transform(release_transform) or not _is_finite_vector(initial_velocity):
          \t\treturn false
          \t_holder = null
          \tglobal_transform = release_transform
          \t_set_world_presentation_enabled(true)
          \t_begin_motion(motion_kind, initial_velocity)
          \treturn true


          func capture_semantic_state() -> Dictionary:
          \treturn {
          \t\t"phase": _phase,
          \t\t"motion_kind": _motion_kind,
          \t\t"transform": global_transform,
          \t\t"linear_velocity": velocity,
          \t}


          func apply_semantic_state(snapshot: Dictionary) -> bool:
          \tif snapshot.size() != 4:
          \t\treturn false
          \tif not snapshot.has("phase") or not snapshot.has("motion_kind") or not snapshot.has("transform") or not snapshot.has("linear_velocity"):
          \t\treturn false
          \tif typeof(snapshot["phase"]) != TYPE_STRING_NAME or typeof(snapshot["motion_kind"]) != TYPE_STRING_NAME:
          \t\treturn false
          \tif typeof(snapshot["transform"]) != TYPE_TRANSFORM3D or typeof(snapshot["linear_velocity"]) != TYPE_VECTOR3:
          \t\treturn false
          \tvar phase: StringName = snapshot["phase"]
          \tvar motion_kind: StringName = snapshot["motion_kind"]
          \tvar restored_transform: Transform3D = snapshot["transform"]
          \tvar restored_velocity: Vector3 = snapshot["linear_velocity"]
          \tif not _is_valid_phase(phase) or not _is_valid_motion_kind(motion_kind):
          \t\treturn false
          \tif not _is_finite_transform(restored_transform) or not _is_finite_vector(restored_velocity):
          \t\treturn false
          \tif (phase == PHASE_SETTLED or phase == PHASE_CARRIED_JUNK) and (motion_kind != MOTION_NONE or not restored_velocity.is_zero_approx()):
          \t\treturn false
          \tif (phase == PHASE_MOVING or phase == PHASE_SETTLING) and motion_kind == MOTION_NONE:
          \t\treturn false
          \tif phase == PHASE_SETTLING and not restored_velocity.is_zero_approx():
          \t\treturn false
          \t_phase = phase
          \t_motion_kind = motion_kind
          \tglobal_transform = restored_transform
          \tvelocity = restored_velocity
          \t_holder = null
          \t_settling_frames_remaining = 1 if phase == PHASE_SETTLING else 0
          \t_unsupported_frames = 0
          \t_set_world_presentation_enabled(phase != PHASE_CARRIED_JUNK)
          \tset_interaction_highlighted(false)
          \treturn true


          func reconcile_after_restore(holder: Node = null) -> bool:
          \tif _phase == PHASE_CARRIED_JUNK:
          \t\tif holder == null or not holder.has_method("reconcile_carried_junk_prop"):
          \t\t\treturn false
          \t\treturn bool(holder.call("reconcile_carried_junk_prop", self))
          \t_holder = null
          \t_set_world_presentation_enabled(true)
          \treturn true


          func _begin_motion(motion_kind: StringName, initial_velocity: Vector3) -> void:
          \t_phase = PHASE_MOVING
          \t_motion_kind = motion_kind
          \t_settling_frames_remaining = 0
          \t_unsupported_frames = 0
          \tvelocity = initial_velocity


          func _advance_motion(delta: float) -> void:
          \tvar fall_limit: float = maxf(terminal_fall_speed, 0.1)
          \tvelocity.y = maxf(velocity.y - maxf(gravity, 0.0) * delta, -fall_limit)
          \tvar collision: KinematicCollision3D = move_and_collide(velocity * delta)
          \tif collision != null:
          \t\t_queue_impact_sound()
          \t\tvar normal: Vector3 = collision.get_normal()
          \t\tif normal.y >= minimum_support_normal_y:
          \t\t\t_enter_settling()
          \t\t\treturn
          \t\tvelocity = velocity.slide(normal)
          \t\tvelocity.x *= 0.35
          \t\tvelocity.z *= 0.35


          func _enter_settling() -> void:
          \t_phase = PHASE_SETTLING
          \t_settling_frames_remaining = 1
          \t_unsupported_frames = 0
          \tvelocity = Vector3.ZERO


          func _has_support() -> bool:
          \tif prop_collision == null or prop_collision.shape == null or not is_inside_tree():
          \t\treturn false
          \tvar box: BoxShape3D = prop_collision.shape as BoxShape3D
          \tif box == null:
          \t\treturn false
          \tvar half: Vector3 = box.size * 0.5
          \tvar inset: float = clampf(support_probe_inset, 0.0, 1.0)
          \tvar x: float = half.x * inset
          \tvar z: float = half.z * inset
          \tvar local_points: Array[Vector3] = [
          \t\tVector3(0.0, -half.y, 0.0),
          \t\tVector3(-x, -half.y, -z), Vector3(x, -half.y, -z),
          \t\tVector3(-x, -half.y, z), Vector3(x, -half.y, z),
          \t\tVector3(-x, -half.y, 0.0), Vector3(x, -half.y, 0.0),
          \t\tVector3(0.0, -half.y, -z), Vector3(0.0, -half.y, z),
          \t]
          \tfor local_point: Vector3 in local_points:
          \t\tvar bottom: Vector3 = global_transform * local_point
          \t\tvar origin: Vector3 = bottom + Vector3.UP * 0.04
          \t\tvar query := PhysicsRayQueryParameters3D.create(origin, bottom + Vector3.DOWN * maxf(support_probe_distance, 0.05))
          \t\tquery.exclude = [get_rid()]
          \t\tquery.collision_mask = _ordinary_collision_mask
          \t\tquery.collide_with_areas = false
          \t\tquery.collide_with_bodies = true
          \t\tvar hit: Dictionary = get_world_3d().direct_space_state.intersect_ray(query)
          \t\tif not hit.is_empty():
          \t\t\tvar normal: Vector3 = hit.get("normal", Vector3.UP)
