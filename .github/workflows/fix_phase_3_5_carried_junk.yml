      - name: Remove helper and verify bounded diff
        shell: bash
        run: |
          rm .github/workflows/fix_phase_3_5_carried_junk.yml
          git diff --check
          test "$(git status --short | sed 's/^...//' | sort)" = "$(printf '%s\n' \
            .github/workflows/fix_phase_3_5_carried_junk.yml \
            application/application_input_boundary.gd \
            assets/models/props/ordinary_crate.obj \
            assets/models/props/ordinary_crate_tall.obj \
            docs/DEVELOPMENT_PLAN.md \
            docs/TESTING.md \
            gameplay/props/ordinary_prop.gd \
            player/interaction/player_prop_carry.gd \
            player/player.gd \
            project.godot \
            scenes/PropLab.tscn \
            tests/props/prop_regressions.gd | sort)"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run authoritative regression barrier
        run: godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Commit corrected Phase 3.5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            application/application_input_boundary.gd \
            assets/models/props/ordinary_crate.obj \
            assets/models/props/ordinary_crate_tall.obj \
            docs/DEVELOPMENT_PLAN.md \
            docs/TESTING.md \
            gameplay/props/ordinary_prop.gd \
            player/interaction/player_prop_carry.gd \
            player/player.gd \
            project.godot \
            scenes/PropLab.tscn \
            tests/props/prop_regressions.gd \
            .github/workflows/fix_phase_3_5_carried_junk.yml
          git diff --cached --check
          git commit -m "Implement Phase 3.5 carried Junk behavior"
          git push origin HEAD:test
