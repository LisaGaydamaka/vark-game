name: Fix Phase 3.5 props

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  fix-phase-3-5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Apply Phase 3.5 correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # The existing interaction edge is the complete prop control grammar:
          # F picks up when empty-handed and F throws while carrying.
          path = "application/application_input_boundary.gd"
          text = read(path)
          text = replace_once(text, "var _prop_throw_blocked_until_release: bool = false\n", "", "boundary throw blocker")
          text = replace_once(text, "var _last_prop_throw_sampled_physics_frame: int = -1\nvar _last_prop_throw_pressed: bool = false\n", "", "boundary throw sample vars")
          reset = "\t_last_prop_throw_sampled_physics_frame = -1\n\t_last_prop_throw_pressed = false\n"
          if text.count(reset) != 2:
              raise SystemExit(f"boundary throw resets: expected 2 matches, found {text.count(reset)}")
          text = text.replace(reset, "")
          enabled_block = """\t\t_prop_throw_blocked_until_release = (\n\t\t\tInput.is_action_pressed(\"throw_prop\")\n\t\t\tor Input.is_action_just_pressed(\"throw_prop\")\n\t\t)\n"""
          text = replace_once(text, enabled_block, "", "boundary enabled throw block")
          text = replace_once(text, "\t_prop_throw_blocked_until_release = Input.is_action_pressed(\"throw_prop\")\n", "", "boundary disabled throw block")
          text, count = re.subn(
              r"\n\nfunc sample_prop_throw_pressed\(\) -> bool:\n.*?\n\nfunc route_input_event",
              "\n\nfunc route_input_event",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("boundary sample_prop_throw_pressed block did not match once")
          write(path, text)

          path = "player/player.gd"
          text = read(path)
          old = """\tvar interact_pressed: bool = false\n\tvar throw_prop_pressed: bool = false\n\tif gameplay_input_boundary != null and is_instance_valid(gameplay_input_boundary):\n\t\tinteract_pressed = bool(gameplay_input_boundary.call(\"sample_interaction_pressed\"))\n\t\tthrow_prop_pressed = bool(\n\t\t\tgameplay_input_boundary.call(\"sample_prop_throw_pressed\")\n\t\t)\n\telse:\n\t\tinteract_pressed = Input.is_action_just_pressed(\"interact\")\n\t\tthrow_prop_pressed = Input.is_action_just_pressed(\"throw_prop\")\n"""
          new = """\tvar interact_pressed: bool = false\n\tif gameplay_input_boundary != null and is_instance_valid(gameplay_input_boundary):\n\t\tinteract_pressed = bool(gameplay_input_boundary.call(\"sample_interaction_pressed\"))\n\telse:\n\t\tinteract_pressed = Input.is_action_just_pressed(\"interact\")\n"""
          text = replace_once(text, old, new, "player interaction sampling")
          old = """\tif prop_carry != null and prop_carry.has_held_prop():\n\t\tprop_carry.update_held_pose()\n\t\tif throw_prop_pressed:\n\t\t\tprop_carry.throw_held()\n\t\t\t_refresh_world_interaction_availability()\n\t\telif interact_pressed:\n\t\t\tprop_carry.drop_held()\n\t\t\t_refresh_world_interaction_availability()\n\t\tif player_interaction != null:\n\t\t\t# A release input belongs to carry ownership; it must not immediately\n\t\t\t# re-trigger the world object that was just released.\n\t\t\tplayer_interaction.update(false)\n"""
          new = """\tif prop_carry != null and prop_carry.has_held_prop():\n\t\tprop_carry.update_held_pose()\n\t\tif interact_pressed:\n\t\t\tprop_carry.throw_held()\n\t\t\t_refresh_world_interaction_availability()\n\t\tif player_interaction != null:\n\t\t\t# The F edge belongs to carry ownership while a prop is held; it must\n\t\t\t# not immediately re-trigger the world object that was just thrown.\n\t\t\tplayer_interaction.update(false)\n"""
          text = replace_once(text, old, new, "player held action")
          write(path, text)

          path = "project.godot"
          text = read(path)
          throw_action = """throw_prop={\n\"deadzone\": 0.2,\n\"events\": [Object(InputEventKey,\"resource_local_to_scene\":false,\"resource_name\":\"\",\"device\":-1,\"window_id\":0,\"alt_pressed\":false,\"shift_pressed\":false,\"ctrl_pressed\":false,\"meta_pressed\":false,\"pressed\":false,\"keycode\":0,\"physical_keycode\":71,\"key_label\":0,\"unicode\":103,\"location\":0,\"echo\":false,\"script\":null)\n]\n}\n"""
          text = replace_once(text, throw_action, "", "project throw_prop action")
          write(path, text)

          # Stabilize the stylized support state. Contact/support establishes a
          # settling state; one transient query miss may not bounce it back into
          # motion. Settled objects require two consecutive unsupported frames
          # before falling, which still reacts promptly to removed supports.
          path = "gameplay/props/ordinary_prop.gd"
          text = read(path)
          text = replace_once(
              text,
              "var _settling_frames_remaining: int = 0\nvar _ordinary_collision_layer: int = 1\n",
              "var _settling_frames_remaining: int = 0\nvar _unsupported_frames: int = 0\nvar _ordinary_collision_layer: int = 1\n",
              "prop unsupported counter",
          )
          old = """\tmatch _phase:\n\t\tPHASE_SETTLED:\n\t\t\tvelocity = Vector3.ZERO\n\t\t\tif not _has_support():\n\t\t\t\t_begin_motion(MOTION_UNSUPPORTED, Vector3.ZERO)\n\t\tPHASE_HELD:\n\t\t\tvelocity = Vector3.ZERO\n\t\tPHASE_MOVING:\n\t\t\t_advance_motion(delta)\n\t\tPHASE_SETTLING:\n\t\t\tvelocity = Vector3.ZERO\n\t\t\tif not _has_support():\n\t\t\t\t_begin_motion(MOTION_UNSUPPORTED, Vector3.ZERO)\n\t\t\t\treturn\n\t\t\t_settling_frames_remaining -= 1\n\t\t\tif _settling_frames_remaining <= 0:\n\t\t\t\t_phase = PHASE_SETTLED\n\t\t\t\t_motion_kind = MOTION_NONE\n"""
          new = """\tmatch _phase:\n\t\tPHASE_SETTLED:\n\t\t\tvelocity = Vector3.ZERO\n\t\t\tif _has_support():\n\t\t\t\t_unsupported_frames = 0\n\t\t\telse:\n\t\t\t\t_unsupported_frames += 1\n\t\t\t\tif _unsupported_frames >= 2:\n\t\t\t\t\t_begin_motion(MOTION_UNSUPPORTED, Vector3.ZERO)\n\t\tPHASE_HELD:\n\t\t\tvelocity = Vector3.ZERO\n\t\t\t_unsupported_frames = 0\n\t\tPHASE_MOVING:\n\t\t\t_unsupported_frames = 0\n\t\t\t_advance_motion(delta)\n\t\tPHASE_SETTLING:\n\t\t\tvelocity = Vector3.ZERO\n\t\t\t_unsupported_frames = 0\n\t\t\t_settling_frames_remaining -= 1\n\t\t\tif _settling_frames_remaining <= 0:\n\t\t\t\t_phase = PHASE_SETTLED\n\t\t\t\t_motion_kind = MOTION_NONE\n"""
          text = replace_once(text, old, new, "prop physics state machine")
          text = replace_once(text, "\t_settling_frames_remaining = 0\n\tvelocity = Vector3.ZERO\n\tset_interaction_highlighted(false)\n", "\t_settling_frames_remaining = 0\n\t_unsupported_frames = 0\n\tvelocity = Vector3.ZERO\n\tset_interaction_highlighted(false)\n", "prop begin held reset")
          text = replace_once(text, "\t_settling_frames_remaining = 1 if phase == PHASE_SETTLING else 0\n\t_set_collision_enabled(phase != PHASE_HELD)\n", "\t_settling_frames_remaining = 1 if phase == PHASE_SETTLING else 0\n\t_unsupported_frames = 0\n\t_set_collision_enabled(phase != PHASE_HELD)\n", "prop apply reset")
          text = replace_once(text, "\t_settling_frames_remaining = 0\n\tvelocity = initial_velocity\n", "\t_settling_frames_remaining = 0\n\t_unsupported_frames = 0\n\tvelocity = initial_velocity\n", "prop motion reset")
          text = replace_once(text, "\t_settling_frames_remaining = 1\n\tvelocity = Vector3.ZERO\n", "\t_settling_frames_remaining = 1\n\t_unsupported_frames = 0\n\tvelocity = Vector3.ZERO\n", "prop settling reset")
          write(path, text)

          path = "tests/props/prop_regressions.gd"
          text = read(path)
          old = """\tvar throw_events: Array[InputEvent] = InputMap.action_get_events(\"throw_prop\")\n\tvar has_g_binding: bool = false\n\tfor event: InputEvent in throw_events:\n\t\tif event is InputEventKey and (event as InputEventKey).physical_keycode == KEY_G:\n\t\t\thas_g_binding = true\n\tassert_true.call(\n\t\tInputMap.has_action(\"throw_prop\") and has_g_binding,\n\t\t\"Phase 3.5 exposes G as the dedicated held-prop throw gameplay action\"\n\t)\n"""
          new = """\tassert_true.call(\n\t\tnot InputMap.has_action(\"throw_prop\"),\n\t\t\"Phase 3.5 uses F for pickup and held-prop throw with no separate throw action\"\n\t)\n"""
          text = replace_once(text, old, new, "prop test G binding")

          old = """\tInput.action_press(\"interact\")\n\tawait _settle_physics(tree)\n\tInput.action_release(\"interact\")\n\tawait _settle_physics(tree, 2)\n\tvar dropped_state: Dictionary = pickup_prop.call(\"capture_semantic_state\")\n\tvar dropped_interaction_state: Dictionary = player.call(\"get_interaction_semantic_state\")\n\tassert_true.call(\n\t\tdropped_state.get(\"phase\", &\"\") == OrdinaryProp.PHASE_MOVING\n\t\tand dropped_state.get(\"motion_kind\", &\"\") == OrdinaryProp.MOTION_DROPPED\n\t\tand not bool(player.call(\"is_carrying_prop\"))\n\t\tand bool(dropped_interaction_state.get(\"available\", false)),\n\t\t\"F while carrying is owned by carry/drop and restores ordinary world interaction without re-picking\"\n\t)\n"""
          new = """\tvar carry_component: RefCounted = player.get(\"prop_carry\") as RefCounted\n\tassert_true.call(\n\t\tcarry_component != null and bool(carry_component.call(\"drop_held\")),\n\t\t\"The ordinary prop retains an explicit dropped semantic path without assigning it a separate player key\"\n\t)\n\tplayer.call(\"set_world_interaction_available\", true)\n\tawait _settle_physics(tree, 2)\n\tvar dropped_state: Dictionary = pickup_prop.call(\"capture_semantic_state\")\n\tvar dropped_interaction_state: Dictionary = player.call(\"get_interaction_semantic_state\")\n\tassert_true.call(\n\t\tdropped_state.get(\"phase\", &\"\") == OrdinaryProp.PHASE_MOVING\n\t\tand dropped_state.get(\"motion_kind\", &\"\") == OrdinaryProp.MOTION_DROPPED\n\t\tand not bool(player.call(\"is_carrying_prop\"))\n\t\tand bool(dropped_interaction_state.get(\"available\", false)),\n\t\t\"Dropped semantic state restores ordinary world interaction and proceeds through explicit motion\"\n\t)\n"""
          text = replace_once(text, old, new, "prop test dropped semantic path")

          old = """\tInput.action_press(\"interact\")\n\tawait _settle_physics(tree)\n\tInput.action_release(\"interact\")\n\tawait _settle_until_phase(\n\t\ttree,\n\t\tpickup_prop,\n\t\tOrdinaryProp.PHASE_SETTLED,\n\t\t90\n\t)\n\n\tassert_true.call(\n\t\tbool(player.call(\"try_carry_prop\", pickup_prop)),\n\t\t\"The same player-owned carry seam can reacquire a settled ordinary prop\"\n\t)\n\tawait _settle_physics(tree)\n\n\tvar input_boundary: Node = application.get_node(\"InputBoundary\")\n\tinput_boundary.call(\"set_gameplay_enabled\", false)\n\tInput.action_press(\"throw_prop\")\n\tinput_boundary.call(\"set_gameplay_enabled\", true)\n\tawait _settle_physics(tree, 2)\n\tassert_true.call(\n\t\tbool(player.call(\"is_carrying_prop\")),\n\t\t\"A throw press that began outside gameplay ownership is not replayed after the domain resumes\"\n\t)\n\tInput.action_release(\"throw_prop\")\n\tawait _settle_physics(tree)\n\tInput.action_press(\"throw_prop\")\n\tawait _settle_physics(tree)\n\tInput.action_release(\"throw_prop\")\n\tawait _settle_physics(tree)\n"""
          new = """\tvar input_boundary: Node = application.get_node(\"InputBoundary\")\n\tinput_boundary.call(\"set_gameplay_enabled\", false)\n\tInput.action_press(\"interact\")\n\tinput_boundary.call(\"set_gameplay_enabled\", true)\n\tawait _settle_physics(tree, 2)\n\tassert_true.call(\n\t\tbool(player.call(\"is_carrying_prop\")),\n\t\t\"An F press that began outside gameplay ownership is not replayed as a held-prop throw after resume\"\n\t)\n\tInput.action_release(\"interact\")\n\tawait _settle_physics(tree)\n\tInput.action_press(\"interact\")\n\tawait _settle_physics(tree)\n\tInput.action_release(\"interact\")\n\tawait _settle_physics(tree)\n"""
          text = replace_once(text, old, new, "prop test held F throw sequence")
          text = replace_once(text, "\t\t\"G while carrying throws the prop through the application-owned gameplay edge\"\n", "\t\t\"F while carrying throws the prop through the existing application-owned interaction edge\"\n", "prop test throw message")
          text = replace_once(text, "\t\tand is_equal_approx(stack_upper.global_position.y, 0.3),\n", "\t\tand absf(stack_upper.global_position.y - 0.3) <= 0.01,\n", "prop stack safe-margin tolerance")
          text = replace_once(text, "\tInput.action_release(\"interact\")\n\tInput.action_release(\"throw_prop\")", "\tInput.action_release(\"interact\")", "prop release actions")
          write(path, text)

          # Living product/design/testing docs follow the user's adopted F rule.
          path = "docs/GAME_VISION.md"
          text = read(path)
          anchor = "The player cannot freely rotate a held ordinary world object.\n\n"
          insertion = (
              "The player cannot freely rotate a held ordinary world object.\n\n"
              "The default ordinary-prop control reuses the primary **F** interaction: **F** picks up a targeted ordinary prop when the player is empty-handed, and **F** throws the held prop while carrying it. There is no separate default throw key for ordinary props.\n\n"
          )
          text = replace_once(text, anchor, insertion, "game vision F prop control")
          write(path, text)

          path = "docs/DEVELOPMENT_PLAN.md"
          text = read(path)
          text = replace_once(
              text,
              "`PlayerPropCarry` is a deliberately narrow player-owned transient relationship. **F** uses the accepted primary interaction to pick up and, while carrying, is consumed as drop; **G** is a separate application-owned one-frame `throw_prop` edge. The held object follows one fixed camera-relative first-person offset and preserves one fixed relative basis, so it follows the view but has no free-rotation state. Carrying composes with the existing central `PlayerInteraction.world_interaction_available` gate, so ordinary world interaction is suppressed without teaching each door/switch/loot target about carrying.\n",
              "`PlayerPropCarry` is a deliberately narrow player-owned transient relationship. **F** reuses the accepted application-owned primary-interaction edge for both prop actions: it picks up a targeted prop while empty-handed and throws the held prop while carrying. There is no separate ordinary-prop throw key. The held object follows one fixed camera-relative first-person offset and preserves one fixed relative basis, so it follows the view but has no free-rotation state. Carrying composes with the existing central `PlayerInteraction.world_interaction_available` gate, so ordinary world interaction is suppressed without teaching each door/switch/loot target about carrying. The semantic `dropped` path remains explicit for system/save behavior even though it is not assigned a separate player key in this micro-proof.\n",
              "roadmap carry grammar",
          )
          text = replace_once(
              text,
              "F pickup/drop and G throw use application-owned input, a held prop stays at a fixed first-person offset/orientation with no free rotation, and carrying centrally suppresses ordinary world interaction;",
              "F pickup/throw reuses the application-owned primary-interaction edge, a held prop stays at a fixed first-person offset/orientation with no free rotation, and carrying centrally suppresses ordinary world interaction;",
              "roadmap done input",
          )
          text = replace_once(
              text,
              "It covers external OBJ replacement, real F pickup/drop, G edge ownership including stale-edge suppression, fixed held presentation, central world-interaction suppression, detached held/moving semantic state and restore reconciliation, drop/throw settling, semantic impact sound, edge support, stable stacking, lower-support removal, vertical unsupported fall, and no post-settle drift/rotation.",
              "It covers external OBJ replacement, real F pickup/throw through the existing interaction edge including stale-edge suppression, fixed held presentation, central world-interaction suppression, detached held/moving semantic state and restore reconciliation, the explicit dropped semantic path plus thrown settling, semantic impact sound, edge support, stable stacking, lower-support removal, vertical unsupported fall, and no post-settle drift/rotation.",
              "roadmap automated input",
          )
          text = replace_once(
              text,
              "Verify the center crate highlights normally; **F** picks it up into a stable first-person held position; looking/moving does not let it freely rotate; other ordinary world interaction/highlight is unavailable while it is held; **F** drops it and it settles without continued wobble/spin/roll/drift; pick it up again and **G** throws it, after which it collides/falls and becomes stationary;",
              "Verify the center crate highlights normally; **F** picks it up into a stable first-person held position; looking/moving does not let it freely rotate; other ordinary world interaction/highlight is unavailable while it is held; press **F** again to throw it, after which it collides/falls, settles without continued wobble/spin/roll/drift, and becomes stationary;",
              "roadmap manual input",
          )
          write(path, text)

          path = "docs/TESTING.md"
          text = read(path)
          text = replace_once(
              text,
              "It launches the real `Prop Lab` through the production application/session/player path and proves the external-model seam, F pickup/drop, application-owned G throw edge with stale-edge suppression, fixed camera-relative held presentation/no free rotation, central ordinary-interaction suppression, detached semantic capture/apply/reconciliation, drop/throw impact-and-settle behavior, edge support, stable two-box stacking, lower-support removal causing vertical unsupported fall, and no post-settle rotation/drift.",
              "It launches the real `Prop Lab` through the production application/session/player path and proves the external-model seam, F pickup/throw through the existing application-owned interaction edge with stale-edge suppression, fixed camera-relative held presentation/no free rotation, central ordinary-interaction suppression, detached semantic capture/apply/reconciliation, the explicit dropped semantic path plus thrown impact-and-settle behavior, edge support, stable two-box stacking, lower-support removal causing vertical unsupported fall, and no post-settle rotation/drift.",
              "testing Phase 3.5 input coverage",
          )
          write(path, text)
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix_phase_3_5.yml

      - name: Check intended diff
        run: |
          git diff --check
          git status --short

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run authoritative regression barrier
        run: godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Commit corrected Phase 3.5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            application/application_input_boundary.gd \
            player/player.gd \
            project.godot \
            gameplay/props/ordinary_prop.gd \
            tests/props/prop_regressions.gd \
            docs/GAME_VISION.md \
            docs/DEVELOPMENT_PLAN.md \
            docs/TESTING.md \
            .github/workflows/fix_phase_3_5.yml
          git diff --cached --check
          git commit -m "Fix Phase 3.5 prop controls and settling"
          git push origin HEAD:test
