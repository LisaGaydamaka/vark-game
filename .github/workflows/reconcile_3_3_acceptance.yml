name: Reconcile 3.3 acceptance

on:
  push:
    branches: [test]
    paths:
      - .github/workflows/reconcile_3_3_acceptance.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0
      - name: Finalize accepted 3.3 documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/DEVELOPMENT_PLAN.md')
          text = path.read_text()

          old_status = '## 3.3 Minimal semantic gameplay-sound event `[~]`'
          new_status = '## 3.3 Minimal semantic gameplay-sound event `[x]`'
          if text.count(old_status) != 1:
              raise SystemExit(f'expected one 3.3 status match, found {text.count(old_status)}')
          text = text.replace(old_status, new_status, 1)

          old_auto = '**Automated:** deterministic 3.3 coverage is wired into the existing focused application semantic-event regression and therefore the authoritative all-tests barrier. It checks READY rejection, stale-session rejection, empty/nonpositive semantic validation, rejection of a reserved `gameplay.sound` payload carrying presentation `volume_db`, queue-without-immediate-dispatch behavior, exact detached semantic payload shape, and stable-boundary delivery through the accepted 3.2 route. Acceptance remains `[~]` until exact-head CI is terminal green.'
          new_auto = '**Automated:** passed — deterministic 3.3 coverage is wired into the existing focused application semantic-event regression and authoritative all-tests barrier. It checks READY rejection, stale-session rejection, empty/nonpositive semantic validation, rejection of a reserved `gameplay.sound` payload carrying presentation `volume_db`, queue-without-immediate-dispatch behavior, exact detached semantic payload shape, and stable-boundary delivery through the accepted 3.2 route. Exact implementation verification head `35297d21e864d08c1e8192ceee666cc6d63c3361` passed Godot 4.7.2 `Regression suite` run #76 with the 3.3 cases plus `ALL AUTHORING TESTS PASSED`, `ALL APPLICATION TESTS PASSED`, `ALL MOVEMENT TESTS PASSED`, and `ALL TEST SUITES PASSED`.'
          if text.count(old_auto) != 1:
              raise SystemExit(f'expected one 3.3 automated match, found {text.count(old_auto)}')
          text = text.replace(old_auto, new_auto, 1)

          path.write_text(text)
          PY
      - name: Commit acceptance reconciliation and remove helper
        shell: bash
        run: |
          rm .github/workflows/reconcile_3_3_acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPMENT_PLAN.md .github/workflows/reconcile_3_3_acceptance.yml
          git commit -m "Finalize 3.3 acceptance reconciliation"
          git push origin HEAD:test
