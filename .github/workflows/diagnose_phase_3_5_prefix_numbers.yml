name: Diagnose Phase 3.5 angled mantle pre-fix numbers
on:
  push:
    branches: [test]
    paths: [.github/workflows/diagnose_phase_3_5_prefix_numbers.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: {ref: test, fetch-depth: 0}
      - name: Apply proven angled regression with trace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/validate_phase_3_5_mantle_attachment_v5.yml').read_text(); start=s.index('      - name: Apply angled production-contact regression\n'); end=s.index('      - uses: chickensoft-games/setup-godot@v2\n',start); block=s[start:end]
          ps=block.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n"); pe=block.rindex('\n          PY'); exec(textwrap.dedent(block[ps:pe]), {})
          p=Path('tests/props/phase_3_5_transition_regressions.gd'); t=p.read_text()
          needle='\tassert_true.call(\n\t\tsaw_lateral_prop_motion_during_mantle and max_attachment_lateral_error <= 0.01,\n\t\t"Moving-prop mantle keeps the player attachment-relative during lateral crate translation"\n\t)\n'
          repl='\tprint("TRACE_PRE lateral=", saw_lateral_prop_motion_during_mantle, " max_error=", max_attachment_lateral_error, " prop_dx=", prop.global_position.x - moving_start.x)\n'+needle
          assert t.count(needle)==1; p.write_text(t.replace(needle,repl,1))
          PY
      - uses: chickensoft-games/setup-godot@v2
        with: {version: 4.7.2, use-dotnet: false, include-templates: false}
      - run: godot --headless --path . --import
      - name: Capture pre-fix numbers
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/props/run_prop_tests.gd 2>&1 | tee /tmp/out
          set -e
          grep -E 'TRACE_PRE|FAIL: Moving-prop mantle' /tmp/out > .phase35_prefix_numbers.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .phase35_prefix_numbers.log
          git commit -m 'Record angled mantle pre-fix numeric diagnostics'
          git push origin HEAD:test
