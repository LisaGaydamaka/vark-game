name: Finalize Phase 3.5 prop correction

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  finalize-phase-3-5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Reapply pending Phase 3.5 correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/fix_phase_3_5.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(code, 'phase_3_5_pending_patch.py', 'exec'), {})
          PY

      - name: Apply diagnosed settling fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('gameplay/props/ordinary_prop.gd')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '@export var support_probe_inset: float = 0.9\n',
              '@export var support_probe_inset: float = 1.0\n',
              'full-footprint support probe',
          )
          text = replace_once(
              text,
              '\n\tif velocity.y <= 0.0 and _has_support():\n\t\t_enter_settling()\n',
              '',
              'premature proximity settling',
          )
          path.write_text(text, encoding='utf-8')

          scene = Path('scenes/PropLab.tscn')
          scene_text = scene.read_text(encoding='utf-8')
          scene_text = replace_once(
              scene_text,
              'text = "3.5 PROP LAB\\nF = pick up / drop · G = throw held prop\\nHeld props suppress ordinary world interaction\\nGreen stand: edge support · right stack: remove lower box"',
              'text = "3.5 PROP LAB\\nF = pick up / throw held prop\\nHeld props suppress ordinary world interaction\\nGreen stand: edge support · right stack: remove lower box"',
              'Prop Lab instructions',
          )
          scene.write_text(scene_text, encoding='utf-8')
          PY

      - name: Remove temporary workflows
        run: |
          rm .github/workflows/fix_phase_3_5.yml
          rm .github/workflows/diagnose_phase_3_5.yml

      - name: Check intended diff
        shell: bash
        run: |
          git diff --check
          git status --short
          test "$(git status --short | sed 's/^...//' | sort)" = "$(printf '%s\n' \
            .github/workflows/diagnose_phase_3_5.yml \
            .github/workflows/fix_phase_3_5.yml \
            application/application_input_boundary.gd \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            docs/TESTING.md \
            gameplay/props/ordinary_prop.gd \
            player/player.gd \
            project.godot \
            scenes/PropLab.tscn \
            tests/props/prop_regressions.gd | sort)"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run authoritative regression barrier
        run: godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Commit corrected Phase 3.5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            application/application_input_boundary.gd \
            player/player.gd \
            project.godot \
            gameplay/props/ordinary_prop.gd \
            scenes/PropLab.tscn \
            tests/props/prop_regressions.gd \
            docs/GAME_VISION.md \
            docs/DEVELOPMENT_PLAN.md \
            docs/TESTING.md \
            .github/workflows/fix_phase_3_5.yml \
            .github/workflows/diagnose_phase_3_5.yml
          git diff --cached --check
          git commit -m "Fix Phase 3.5 F prop throw and settling"
          git push origin HEAD:test
