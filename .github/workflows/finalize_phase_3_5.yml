name: Finalize Phase 3.5 roadmap

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  finalize-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Record Phase 3.5 implementation and acceptance gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path("docs/DEVELOPMENT_PLAN.md")
          text = roadmap.read_text(encoding="utf-8")

          old = """## 3.5 Thief-style prop micro-proof `[ ]`

          Implement ordinary prop states sufficient to prove:

          ```text
          settled → held → dropped/thrown/unsupported → settling → settled
          ```

          Use at least one representative replaceable external 3D model asset for the ordinary prop/furniture visual. The prop gameplay archetype owns support/carry/interaction/save semantics; the model is replaceable presentation and must not become semantic identity.

          Protect the LOCKED rules:

          - supported props do not topple/spin/roll/drift;
          - edge-supported boxes remain;
          - simple supported stacks remain still;
          - removing a simple lower support causes unsupported objects above to fall until supported without uncontrolled explosion/scatter;
          - settled props become stationary again;
          - a held ordinary prop uses the intended first-person held presentation;
          - the player cannot freely rotate a held ordinary prop;
          - ordinary world interaction is unavailable while carrying an ordinary prop, enforced at interaction/input ownership rather than by checks copied into every interactable.

          Do not build a universal support-graph engine. If the small fixture appears to require one, reconsider the concrete representation.
          """

          new = """## 3.5 Thief-style prop micro-proof `[~]`

          Implement ordinary prop states sufficient to prove:

          ```text
          settled → held → dropped/thrown/unsupported → settling → settled
          ```

          Use at least one representative replaceable external 3D model asset for the ordinary prop/furniture visual. The prop gameplay archetype owns support/carry/interaction/save semantics; the model is replaceable presentation and must not become semantic identity.

          Protect the LOCKED rules:

          - supported props do not topple/spin/roll/drift;
          - edge-supported boxes remain;
          - simple supported stacks remain still;
          - removing a simple lower support causes unsupported objects above to fall until supported without uncontrolled explosion/scatter;
          - settled props become stationary again;
          - a held ordinary prop uses the intended first-person held presentation;
          - the player cannot freely rotate a held ordinary prop;
          - ordinary world interaction is unavailable while carrying an ordinary prop, enforced at interaction/input ownership rather than by checks copied into every interactable.

          Do not build a universal support-graph engine. If the small fixture appears to require one, reconsider the concrete representation.

          The first ordinary prop is a manually translated `CharacterBody3D`, not a continuously simulated `RigidBody3D`. While settled it performs a small footprint support check and otherwise remains exactly authored; when support disappears, after drop, or after throw it uses explicit linear velocity with fixed orientation until contact/support moves it through a one-frame `settling` state back to `settled`. A nine-point bottom-footprint probe is sufficient for the representative edge-support and simple stack cases without introducing a support graph. Removing the lower box from the Prop Lab stack disables that support collision while held, so the upper box becomes unsupported and falls vertically without torque/scatter.

          `PlayerPropCarry` is a deliberately narrow player-owned transient relationship. **F** uses the accepted primary interaction to pick up and, while carrying, is consumed as drop; **G** is a separate application-owned one-frame `throw_prop` edge. The held object follows one fixed camera-relative first-person offset and preserves one fixed relative basis, so it follows the view but has no free-rotation state. Carrying composes with the existing central `PlayerInteraction.world_interaction_available` gate, so ordinary world interaction is suppressed without teaching each door/switch/loot target about carrying.

          `OrdinaryProp.tscn` selects an external OBJ through an exported `Mesh` seam and the regression swaps a compatible alternate OBJ on the same gameplay instance while preserving collision, state, interaction, and save semantics. `capture_semantic_state()` stores only explicit phase, motion kind, transform, and linear velocity; `apply_semantic_state()` restores those value-owned facts, and `reconcile_after_restore()` rebuilds the transient held-player relationship when the semantic phase is `held`. Prop collision also emits the already-proven semantic `prop.impact` gameplay-sound source fact; Phase 3.6 still owns propagation/hearing.

          A development-only `Prop Lab` exposes the real pickup prop, an intentionally edge-supported box, and a two-box stack through the normal application/session/player path.

          **Done when:** one real ordinary prop uses the accepted center-view/F selection contract and replaceable external-model presentation; settled and edge-supported props plus a simple supported stack remain stationary without toppling/spinning/rolling/drift; removing the lower stack support causes the upper prop to enter unsupported motion, fall without scatter/rotation, and settle again; F pickup/drop and G throw use application-owned input, a held prop stays at a fixed first-person offset/orientation with no free rotation, and carrying centrally suppresses ordinary world interaction; dropped/thrown/unsupported props use bounded explicit motion and become stationary again on support; impact queues only the existing semantic gameplay-sound source fact; capture/apply/reconcile covers settled/held/moving/settling state without live references or serialized runtime continuation machinery; and no universal support graph, inventory framework, acoustic propagation, or general rigid-body prop simulation is introduced.

          **Automated:** required — the dedicated `tests/props/run_prop_tests.gd` suite is wired into `tests/run_all_tests.gd` and must pass through the authoritative GitHub Actions `Test` barrier. It covers external OBJ replacement, real F pickup/drop, G edge ownership including stale-edge suppression, fixed held presentation, central world-interaction suppression, detached held/moving semantic state and restore reconciliation, drop/throw settling, semantic impact sound, edge support, stable stacking, lower-support removal, vertical unsupported fall, and no post-settle drift/rotation.

          **Manual:** pending — validator: **Windows x64 user/playtester**. Launch **Development Launch → Prop Lab**. Verify the center crate highlights normally; **F** picks it up into a stable first-person held position; looking/moving does not let it freely rotate; other ordinary world interaction/highlight is unavailable while it is held; **F** drops it and it settles without continued wobble/spin/roll/drift; pick it up again and **G** throws it, after which it collides/falls and becomes stationary; the green-stand box remains where authored despite overhang; remove the lower box from the right-hand two-box stack and confirm the upper box falls roughly straight down, settles without explosive scatter/toppling, and remains still. Also confirm ordinary movement/jump/crouch/sprint/mouse-look still feel accepted.
          """

          if text.count(old) != 1:
              raise SystemExit("Phase 3.5 roadmap block did not match exactly once.")
          text = text.replace(old, new)

          old_sequence = (
              "1. Finish the current 3.4 ordinary-door item by adding/proving its "
              "replaceable external-model presentation seam, then complete its "
              "authoritative automated validation and focused Windows manual acceptance "
              "before moving to 3.5."
          )
          new_sequence = (
              "1. Finish the current 3.5 Thief-style prop micro-proof through the "
              "authoritative automated barrier and focused Windows manual acceptance "
              "before moving to 3.6."
          )
          if text.count(old_sequence) != 1:
              raise SystemExit("Immediate-sequence lead item did not match exactly once.")
          text = text.replace(old_sequence, new_sequence)

          baseline_anchor = (
              "- a first reusable ordinary-door micro-proof with physical hinge "
              "collision/vision behavior, semantic door events/state capture, and narrow "
              "acoustic/navigation seams\n"
          )
          baseline_prop = (
              "- a first Thief-style ordinary-prop micro-proof with explicit "
              "settled/held/moving/settling state, fixed held presentation, central "
              "interaction suppression, simple support/stack behavior, and semantic "
              "capture/reconcile seams\n"
          )
          if baseline_prop not in text:
              if text.count(baseline_anchor) != 1:
                  raise SystemExit("Implementation-baseline door anchor did not match exactly once.")
              text = text.replace(
                  baseline_anchor,
                  baseline_anchor + baseline_prop,
              )

          roadmap.write_text(text, encoding="utf-8")

          testing = Path("docs/TESTING.md")
          test_text = testing.read_text(encoding="utf-8")

          old_runner = (
              "The all-tests runner invokes the independent authoring, application, and "
              "movement suites through clean headless Godot subprocesses."
          )
          new_runner = (
              "The all-tests runner invokes the independent authoring, application, props, "
              "and movement suites through clean headless Godot subprocesses."
          )
          if test_text.count(old_runner) != 1:
              raise SystemExit("TESTING all-tests suite description did not match exactly once.")
          test_text = test_text.replace(old_runner, new_runner)

          app_command = """Focused application ownership command:

          ```powershell
          godot --headless --path . --script res://tests/application/run_application_tests.gd
          ```

          Expected result: exit code `0` and `ALL APPLICATION TESTS PASSED`.
          """
          prop_command = app_command + """
          Focused Thief-style prop command:

          ```powershell
          godot --headless --path . --script res://tests/props/run_prop_tests.gd
          ```

          Expected result: exit code `0` and `ALL PROP TESTS PASSED`.
          """
          if test_text.count(app_command) != 1:
              raise SystemExit("TESTING focused application command block did not match exactly once.")
          test_text = test_text.replace(app_command, prop_command)

          coverage_anchor = (
              "The same regression now loads the door leaf from its configured external OBJ "
              "model, swaps it to a second compatible external OBJ on the existing door "
              "instance, and proves that presentation replacement leaves interaction ownership, "
              "collision/vision obstruction, semantic state, highlight material, events, "
              "consumer seams, and capture/apply behavior under the unchanged ordinary-door "
              "archetype.\n"
          )
          prop_coverage = (
              "\nPhase 3.5 adds a dedicated Props suite through the same authoritative all-tests "
              "barrier. It launches the real `Prop Lab` through the production application/session/"
              "player path and proves the external-model seam, F pickup/drop, application-owned G "
              "throw edge with stale-edge suppression, fixed camera-relative held presentation/no "
              "free rotation, central ordinary-interaction suppression, detached semantic capture/"
              "apply/reconciliation, drop/throw impact-and-settle behavior, edge support, stable "
              "two-box stacking, lower-support removal causing vertical unsupported fall, and no "
              "post-settle rotation/drift. The prop uses the existing `gameplay.sound` semantic "
              "source route for `prop.impact`; acoustic propagation remains Phase 3.6.\n"
          )
          if prop_coverage.strip() not in test_text:
              if test_text.count(coverage_anchor) != 1:
                  raise SystemExit("TESTING Phase 3.4 coverage anchor did not match exactly once.")
              test_text = test_text.replace(
                  coverage_anchor,
                  coverage_anchor + prop_coverage,
              )

          testing.write_text(test_text, encoding="utf-8")
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize_phase_3_5.yml

      - name: Commit roadmap/testing closeout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPMENT_PLAN.md docs/TESTING.md .github/workflows/finalize_phase_3_5.yml
          git diff --cached --check
          git commit -m "Record Phase 3.5 prop acceptance gate"
          git push origin HEAD:test
