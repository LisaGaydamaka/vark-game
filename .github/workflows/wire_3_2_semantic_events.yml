name: Wire 3.2 semantic event coverage

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message == 'Implement 3.2 semantic event boundary'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0
      - name: Wire focused coverage and implementation docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/application/run_application_tests.gd',
              'const InteractionRegressions = preload(\n\t"res://tests/application/interaction_regressions.gd"\n)\nconst PauseArbitrationRegressions = preload(',
              'const InteractionRegressions = preload(\n\t"res://tests/application/interaction_regressions.gd"\n)\nconst SemanticEventRegressions = preload(\n\t"res://tests/application/semantic_event_regressions.gd"\n)\nconst PauseArbitrationRegressions = preload('
          )
          replace_once(
              'tests/application/run_application_tests.gd',
              '\tvar interaction_regressions: RefCounted = InteractionRegressions.new()\n\tawait interaction_regressions.run(\n\t\tself,\n\t\tCallable(self, "_assert_true")\n\t)\n\n\tvar application: Node = ApplicationScene.instantiate()',
              '\tvar interaction_regressions: RefCounted = InteractionRegressions.new()\n\tawait interaction_regressions.run(\n\t\tself,\n\t\tCallable(self, "_assert_true")\n\t)\n\n\tvar semantic_event_regressions: RefCounted = SemanticEventRegressions.new()\n\tawait semantic_event_regressions.run(\n\t\tself,\n\t\tCallable(self, "_assert_true")\n\t)\n\n\tvar application: Node = ApplicationScene.instantiate()'
          )

          replace_once(
              'docs/DEVELOPMENT_PLAN.md',
              '## 3.2 Minimal semantic gameplay-event queue and stable boundary `[ ]`',
              '## 3.2 Minimal semantic gameplay-event queue and stable boundary `[~]`'
          )
          replace_once(
              'docs/DEVELOPMENT_PLAN.md',
              '- a minimal player-owned interaction selector with application-owned primary-interaction intent, center-view range/occlusion/state eligibility, central ordinary-interaction availability, and Thief-style fullbright/no-received-shadow target-selection feedback that preserves ordinary cast shadows\n- post-push GitHub Actions validation for the authoritative regression barrier',
              '- a minimal player-owned interaction selector with application-owned primary-interaction intent, center-view range/occlusion/state eligibility, central ordinary-interaction availability, and Thief-style fullbright/no-received-shadow target-selection feedback that preserves ordinary cast shadows\n- a minimal `WorldSession`-owned semantic gameplay-event route with FIFO consequence draining, nested append semantics, lifecycle/session rejection, detached payloads, cascade diagnostics, and an explicit stable gameplay-boundary serial\n- post-push GitHub Actions validation for the authoritative regression barrier'
          )
          replace_once(
              'docs/DEVELOPMENT_PLAN.md',
              'Do not create a general scheduler or author-facing rule language here.',
              '''Do not create a general scheduler or author-facing rule language here.\n\nThe implementation is deliberately session-local rather than a new manager layer. `WorldSession` accepts detached value-owned semantic payloads only from its current `PLAYING` session identity, queues them FIFO, and drains them at a late controlled physics priority after ordinary default-priority gameplay physics. Ordered handlers must return `true` synchronously; nested emissions append to the same queue rather than recursing. The session publishes only a monotonically increasing stable-boundary serial after a successful drain, so later save capture can bind to that boundary without exposing an arbitrary callback scheduler. BUILDING, RESTORING, READY, PAUSED, STOPPED, TEARING_DOWN, stale-session, and live-Object payload attempts do not enter normal dispatch. A bounded development cascade guard clears and reports a trace instead of hanging on a self-sustaining loop. Teardown discards queue, handlers, sequence, diagnostics, and boundary state with the old world.\n\n**Done when:** a given emitted sequence drains FIFO at one controlled world-session gameplay point; nested emissions append after already-registered handlers for the current event; detached payloads cannot retain live world objects or be mutated through the emitter/another handler; stale/foreign sessions and non-`PLAYING` lifecycle states cannot enter normal dispatch; participating handlers must acknowledge synchronous completion; a runaway cascade is bounded and reported; ordinary out-of-pass callers can only queue future semantic work; teardown prevents old-world event state from reaching a replacement; and the stable-boundary serial advances only after a successful consequence drain. No global physics-order promise, general scheduler, mission-rule language, sound event, door behavior, or save system is introduced.\n\n**Automated:** deterministic 3.2 coverage is wired into the focused application suite and authoritative all-tests barrier. It covers explicit BUILDING/RESTORING/TEARING_DOWN/READY rejection, stale-session rejection, live-Object payload rejection, deep payload detachment and per-handler isolation, emitted-order FIFO, nested append rather than recursion, a default-priority physics emitter draining at the later session point, out-of-pass queue-without-immediate-mutation behavior, synchronous-handler acknowledgement failure withholding the stable boundary, bounded runaway-loop diagnostics/recovery, teardown cleanup, and replacement-session isolation. Exact-head post-push CI is still required for acceptance.\n\n**Manual:** none — 3.2 establishes deterministic internal timing/ownership semantics and intentionally adds no new player-facing behavior.''' 
          )

          replace_once(
              'docs/TESTING.md',
              'The door-like and prop-like probes both consume the same narrow interactable surface; the fixture does not implement the later door/prop systems or semantic event queue.',
              'The door-like and prop-like probes both consume the same narrow interactable surface; the fixture does not implement the later door/prop systems. Phase 3.2 coverage runs in this same focused application suite through an isolated real `WorldSession`: it proves emitted-order FIFO, nested append rather than recursive dispatch, deep value-owned payload detachment and per-handler isolation, current-session/lifecycle gating including RESTORING, a late controlled physics drain point, out-of-pass queueing without immediate durable consequence dispatch, synchronous-handler acknowledgement, a bounded runaway-cascade diagnostic/recovery path, teardown cleanup, replacement-session isolation, and stable-boundary publication only after a successful consequence pass.'
          )
          PY
          git diff --check
          git diff -- tests/application/run_application_tests.gd docs/DEVELOPMENT_PLAN.md docs/TESTING.md
      - name: Commit wiring and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire_3_2_semantic_events.yml
          git add tests/application/run_application_tests.gd docs/DEVELOPMENT_PLAN.md docs/TESTING.md
          git commit -m "Wire 3.2 semantic event coverage and docs"
          git push origin HEAD:test
