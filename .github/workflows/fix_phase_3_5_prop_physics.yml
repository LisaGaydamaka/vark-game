          '''.replace('          ', ''))

          def hard_box_obj(hx: float, hy: float, hz: float, name: str, comment: str) -> str:
              faces = [
                  ((0, 0, -1), [(-hx, -hy, -hz), (-hx, hy, -hz), (hx, hy, -hz), (hx, -hy, -hz)]),
                  ((0, 0, 1), [(-hx, -hy, hz), (hx, -hy, hz), (hx, hy, hz), (-hx, hy, hz)]),
                  ((1, 0, 0), [(hx, -hy, -hz), (hx, hy, -hz), (hx, hy, hz), (hx, -hy, hz)]),
                  ((-1, 0, 0), [(-hx, -hy, -hz), (-hx, -hy, hz), (-hx, hy, hz), (-hx, hy, -hz)]),
                  ((0, 1, 0), [(-hx, hy, -hz), (-hx, hy, hz), (hx, hy, hz), (hx, hy, -hz)]),
                  ((0, -1, 0), [(-hx, -hy, -hz), (hx, -hy, -hz), (hx, -hy, hz), (-hx, -hy, hz)]),
              ]
              lines = [f'# {comment}', f'o {name}', 's off']
              for _, vertices in faces:
                  for x, y, z in vertices:
                      lines.append(f'v {x:.6f} {y:.6f} {z:.6f}')
              for nx, ny, nz in [face[0] for face in faces]:
                  lines.append(f'vn {nx:.6f} {ny:.6f} {nz:.6f}')
              for face_index in range(6):
                  base = face_index * 4 + 1
                  normal_index = face_index + 1
                  lines.append(f'f {base}//{normal_index} {base + 1}//{normal_index} {base + 2}//{normal_index} {base + 3}//{normal_index}')
              return '\n'.join(lines) + '\n'

          write(
              'assets/models/props/ordinary_crate.obj',
              hard_box_obj(0.3, 0.3, 0.3, 'OrdinaryCrate', 'Hard-edged outward-facing Vark ordinary crate; explicit face normals prevent smoothed inside/rounded shading.'),
