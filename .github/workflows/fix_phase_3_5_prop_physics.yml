              'GAME_VISION rigid-body moving rule',
          )
          text = replace_once(
              text,
              'Ordinary furniture/prop archetypes may use different reusable external 3D model assets without changing these physical rules. Visual model choice is presentation/configuration, not a separate physics behavior or persistent identity.\n',
              'Ordinary furniture/prop archetypes may use different reusable external 3D model assets without changing these physical rules. Visual model choice is presentation/configuration, not a separate physics behavior or persistent identity. Ordinary hard-edged prop models must provide outward-facing geometry and hard/explicit face normals where appropriate so unselected props receive normal lighting and scene shadows; the temporary interaction highlight must not become their permanent render mode.\n',
              'GAME_VISION prop render rule',
          )
          text = replace_once(
              text,
              'Thrown/released objects may move through the world and collide, but ordinary props do not enter indefinite realistic rigid-body simulation. For box-like props, the orientation established at throw/release is held during moving/unsupported/settling motion: the same side continues to face back along the release/throw line instead of freely tumbling or spinning. It does not continuously track later camera turns. When the prop finally becomes `settled`, it normalizes back to its canonical top-up orientation.\n',
              'Thrown/released/unsupported objects use real rigid-body translation while moving: gravity and collisions may change their position, linear velocity, slide, and bounce. Ordinary box-like Junk keeps angular motion locked during this moving phase, so hitting a floor, wall, prop, or actor does **not** rotate the box in flight. It does not continuously track later camera turns. When the prop genuinely settles, only pitch/roll are normalized so the top points upward; its current yaw is preserved. Settling must never rotate a particular side toward world north or any other global compass direction. The settled collider rests directly on its support rather than freezing early from a proximity probe and leaving a visible air gap.\n',
              'GAME_VISION moving orientation and settle rule',
          )
          p.write_text(text, encoding='utf-8')

          # DEVELOPMENT_PLAN: rewrite the Phase 3.5 acceptance around real moving rigid bodies.
          p = Path('docs/DEVELOPMENT_PLAN.md')
          text = p.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '- a first ordinary-prop prototype with explicit settled/held/moving/settling state, central interaction suppression, simple support/stack behavior, and semantic capture/reconcile seams; Phase 3.5 remains `[~]` because the player-facing carry contract has since been revised to single-slot carried Junk with HUD presentation plus F throw / R gentle release, so the current camera-held implementation/tests must be corrected before acceptance\n',
              '- a Phase 3.5 ordinary-prop implementation with single-slot carried Junk HUD presentation, F throw / R gentle release, real dynamic rigid-body translation while moving, frozen settled support/stack behavior, yaw-preserving top-up normalization, hard-edged external-model shading, and semantic capture/reconcile seams; Phase 3.5 remains `[~]` pending the final Windows x64 user acceptance pass\n',
              'DEVELOPMENT_PLAN baseline prop status',
          )
          new_35 = '''## 3.5 Thief-style prop micro-proof `[~]`

          Implement ordinary prop states sufficient to prove:

          ```text
          settled/world → carried_junk → thrown/released/unsupported → moving → settling → settled/world
          ```

          Use at least one representative replaceable external 3D model asset for the ordinary prop/furniture visual. The prop gameplay archetype owns support/carry/interaction/save semantics; the model is replaceable presentation and must not become semantic identity.

          Protect the LOCKED rules:

          - supported/settled props remain exactly where authored until explicitly acted on or their support disappears;
          - edge-supported boxes remain;
          - simple supported stacks remain still;
          - removing a simple lower support activates unsupported objects above so they fall under real physics until supported, without an invented horizontal impulse or forced rotation;
          - settled props become frozen/stationary again;
          - **F/Frob** picks up an eligible highlighted ordinary prop as the player's one carried Junk object;
          - pickup immediately removes/disables that prop's physical world presentation and collision while preserving the same semantic/persistent identity;
          - the player can carry exactly one Junk object at a time;
          - carried Junk is shown at the bottom-center HUD and is never a camera-attached physical world body;
          - carried Junk cannot collide with world geometry while stored;
          - ordinary movement/look/crouch/jump/traversal remain available while carrying;
          - carrying occupies the player's hands and centrally suppresses ordinary world interaction, attack, and normal inventory-item use;
          - **F/Frob** while carrying throws the same prop forward in the current view direction;
          - **R** while carrying gently releases/drops the same prop using a view-derived placement point;
          - release placement uses the actual collision half-extents along the view ray plus only a tiny safety padding, rather than an arbitrary large center offset;
          - while thrown, released, or unsupported, the prop is an active `RigidBody3D`: gravity, friction, bounce/slide, continuous collision detection, and solid-body collision response are owned by the physics engine rather than hand-written `move_and_collide()` motion;
          - ordinary box-like Junk keeps angular motion locked while dynamically moving, so collisions change translation/velocity but do not rotate its release-facing orientation;
          - when genuine resting contact persists, the prop settles/freeze-transitions and normalizes **only pitch/roll** to top-up while preserving its current yaw; there is no world-north or canonical-side snap;
          - settling is based on real rigid-body contact/rest rather than support-probe proximity, so a settled box does not hover above the floor;
          - representative hard-edged OBJ props use outward face winding plus explicit hard face normals, and unselected props use ordinary lit shading with normal cast/receive shadows;
          - thrown/released impacts can emit the existing semantic gameplay-sound source fact for later acoustic/NPC use, with gentle release lower in source strength than a throw.

          Do not build a universal support-graph engine or a general inventory framework. Settled props may be frozen for the Thief-style stable-world rule; real rigid-body simulation is required while they are actively moving, not continuously after rest.

          The intended semantic ownership remains one player-owned `carried_junk` relationship to the same ordinary prop identity. While carried, world presentation/collision are derived inactive state; the object is not converted into inventory data and is not destroyed/recreated as a different gameplay identity. Throw/release restore that same `RigidBody3D` to world participation. Save capture preserves phase, motion kind, transform, linear velocity, and enough yaw-normalization state to restore moving/settling behavior without serializing live player/Node references.

          The focused `Prop Lab` remains the development fixture. Its instructions and regressions must make the render fix, dynamic collision behavior, orientation lock, yaw-preserving top-up settle, no-floor-gap result, edge support, and stack support-removal behavior obvious.

          **Done when:** the ordinary prop reuses center-view/F selection and replaceable external-model presentation; unselected crates render as normal hard-edged boxes with correct one-sided faces and ordinary scene shadows; settled/edge-supported props and a simple stack remain stable; lower-support removal activates a real rigid-body fall; F pickup makes the world prop disappear into exactly one bottom-center carried-Junk HUD slot with no world collision; normal locomotion remains available while carrying while ordinary interaction/hand actions are centrally suppressed; F throws and R gently releases the same prop back into the world from a geometry-aware view-derived release point; thrown/released/unsupported props use real rigid-body translational collision; their orientation stays fixed while dynamically moving/colliding; genuine rest freezes them top-up without changing yaw; no settled prop hovers above its support; semantic capture/apply/reconcile preserves the state without live references; and no universal support graph or general inventory framework is introduced.

          **Automated:** required — keep the dedicated `tests/props/run_prop_tests.gd` suite wired into `tests/run_all_tests.gd`. Coverage must prove hard outward OBJ normals plus normal unselected shadowed shading; `RigidBody3D` ownership and frozen settled state; external model replacement; F pickup into exactly one `carried_junk` slot; physical presentation/collision inactive while carried; bottom-center HUD presentation; normal movement while carrying; central world/hand-action suppression; stale F/R edge suppression; F throw versus R gentle release; geometry-aware release placement; moving bodies unfrozen with continuous collision; a real collision that changes motion without changing orientation; top-up settle preserving yaw rather than snapping to a canonical/global heading; direct floor contact with no hover gap; same semantic identity across world → carried Junk → world; detached capture/apply/reconciliation; lower semantic impact strength for release; edge support; stable stacking; lower-support removal; controlled unsupported rigid-body fall; and no post-settle drift/spin.

          **Manual:** pending — validator: **Windows x64 user/playtester**. Launch **Development Launch → Prop Lab**. Confirm ordinary crates look like normal solid hard-edged boxes when not selected: outside faces visible, lighting/shadows correct, no smoothed/inside-out appearance. Confirm F pickup removes the physical crate and shows one bottom-center Junk HUD object. Confirm movement/look/crouch/jump remain normal and stored Junk has no world collision. Confirm F throws and R gently releases. While a released/thrown crate is flying and colliding, confirm it reacts physically to floors/walls/other bodies but its orientation does not rotate. When it genuinely comes to rest, confirm it rotates only enough to put the top upward while keeping whatever left/right yaw it already had—no side is forced north. Confirm the final collider/visual rests directly on the floor/support with no visible air gap. Retain the edge-support, lower-stack-removal, stable-settle, and locomotion sanity checks.'''.replace('          ', '')
          text, count = re.subn(
              r'## 3\.5 Thief-style prop micro-proof `\[~\]`\n.*?\n## 3\.6 Acoustic propagation micro-proof `\[ \]`',
              new_35 + '\n\n## 3.6 Acoustic propagation micro-proof `[ ]`',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'DEVELOPMENT_PLAN Phase 3.5 block: expected 1 match, found {count}')
          p.write_text(text, encoding='utf-8')

          # TESTING: protect the production failure boundaries that caused the visual/physics defects.
          p = Path('docs/TESTING.md')
          text = p.read_text(encoding='utf-8')
          new_testing = (
              'Phase 3.5 has a dedicated Props suite wired through the authoritative all-tests barrier. '
              'It launches the real `Prop Lab` through the production application/session/player path and proves outward-facing OBJ winding plus explicit per-face hard normals, normal unselected lit/shadowed presentation, the external-model seam, real `RigidBody3D` prop ownership, frozen settled state, F pickup into exactly one semantic `carried_junk` slot, physical world presentation/collision disabled while carried, bottom-center HUD Junk presentation, normal movement while carrying, central world/hand-action suppression, stale F/R edge suppression, F throw versus R gentle release, geometry-aware view-derived placement, same prop identity across world → carried Junk → world, detached capture/apply/reconciliation, active rigid-body translation with continuous collision while moving, collision without angular orientation change, yaw-preserving top-up normalization only on genuine settle, direct floor contact without support-probe hover gaps, lower semantic impact strength for gentle release, semantic `prop.impact` sound, edge support, stable stacking, lower-support removal, controlled unsupported rigid-body fall, and no post-settle drift/spin. Acoustic propagation remains Phase 3.6.'
          )
          text, count = re.subn(
              r'Phase 3\.5 has a dedicated Props suite wired through the authoritative all-tests barrier\..*?Acoustic propagation remains Phase 3\.6\.',
              new_testing,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'TESTING Phase 3.5 paragraph: expected 1 match, found {count}')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove helper and verify bounded diff
        shell: bash
        run: |
          rm .github/workflows/fix_phase_3_5_prop_physics.yml
          git diff --check
          test "$(git status --short | sed 's/^...//' | sort)" = "$(printf '%s\n' \
            .github/workflows/fix_phase_3_5_prop_physics.yml \
            application/application_input_boundary.gd \
            assets/models/props/ordinary_crate.obj \
            assets/models/props/ordinary_crate_tall.obj \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            docs/TESTING.md \
            gameplay/props/OrdinaryProp.tscn \
            gameplay/props/ordinary_prop.gd \
            player/interaction/player_prop_carry.gd \
            scenes/PropLab.tscn \
            tests/props/prop_regressions.gd | sort)"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run authoritative regression barrier
        run: godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Commit corrected prop physics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/models/props/ordinary_crate.obj \
            assets/models/props/ordinary_crate_tall.obj \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            docs/TESTING.md \
            gameplay/props/OrdinaryProp.tscn \
            gameplay/props/ordinary_prop.gd \
            player/interaction/player_prop_carry.gd \
            scenes/PropLab.tscn \
            tests/props/prop_regressions.gd \
            .github/workflows/fix_phase_3_5_prop_physics.yml
          git diff --cached --check
          git commit -m "Use real rigid physics for Phase 3.5 props"
          git push origin HEAD:test
