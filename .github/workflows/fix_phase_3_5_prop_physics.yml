name: Fix Phase 3.5 prop physics

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  fix-phase-3-5-prop-physics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Apply prop rendering and rigid-body correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          write('gameplay/props/ordinary_prop.gd', '''class_name VarkOrdinaryProp
          extends RigidBody3D


          const PHASE_SETTLED: StringName = &"settled"
          const PHASE_CARRIED_JUNK: StringName = &"carried_junk"
          const PHASE_MOVING: StringName = &"moving"
          const PHASE_SETTLING: StringName = &"settling"

          const MOTION_NONE: StringName = &"none"
          const MOTION_RELEASED: StringName = &"released"
          const MOTION_THROWN: StringName = &"thrown"
          const MOTION_UNSUPPORTED: StringName = &"unsupported"

          const IMPACT_SOUND_KIND: StringName = &"prop.impact"


          @export var prop_id: StringName = &"prop"
          @export var visual_model: Mesh
          @export var base_color: Color = Color(0.42, 0.27, 0.12, 1.0)
          @export var throw_speed: float = 6.0
          @export var impact_sound_strength: float = 0.55
          @export var gentle_release_sound_scale: float = 0.35
          @export var settle_linear_speed: float = 0.12
          @export var settle_contact_frames_required: int = 5
          @export var support_probe_distance: float = 0.08
          @export var support_probe_inset: float = 1.0
          @export var minimum_support_normal_y: float = 0.55

          @onready var prop_mesh: MeshInstance3D = $PropMesh
          @onready var prop_collision: CollisionShape3D = $CollisionShape3D

          var _phase: StringName = PHASE_SETTLED
          var _motion_kind: StringName = MOTION_NONE
          var _highlighted: bool = false
          var _material: StandardMaterial3D = null
          var _world_session: Node = null
          var _holder: Node = null
          var _settle_yaw: float = 0.0
          var _settle_contact_frames: int = 0
          var _unsupported_frames: int = 0
          var _last_contact_count: int = 0
          var _ordinary_collision_layer: int = 1
          var _ordinary_collision_mask: int = 1


          func _ready() -> void:
          \tadd_to_group(&"vark_interactable")
          \t_ordinary_collision_layer = collision_layer
          \t_ordinary_collision_mask = collision_mask
          \t_settle_yaw = _yaw_from_basis(global_transform.basis)
          \t_world_session = _find_world_session()

          \t# Ordinary props are frozen while settled, but released/unsupported props
          \t# use the real rigid-body solver for gravity and translational collision.
          \tcontact_monitor = true
          \tif max_contacts_reported < 8:
          \t\tmax_contacts_reported = 8
          \tcontinuous_cd = true
          \tlock_rotation = true
          \tcan_sleep = true
          \tfreeze = true
          \tsleeping = true
          \tlinear_velocity = Vector3.ZERO
          \tangular_velocity = Vector3.ZERO

          \t_material = StandardMaterial3D.new()
          \t_material.cull_mode = BaseMaterial3D.CULL_BACK
          \t_material.roughness = 0.82
          \t_material.metallic = 0.0
          \tprop_mesh.material_override = _material
          \tprop_mesh.cast_shadow = GeometryInstance3D.SHADOW_CASTING_SETTING_ON
          \tif not set_visual_model(visual_model):
          \t\tpush_error("VarkOrdinaryProp requires a configured visual_model Mesh.")
          \t_refresh_visual()


          func _physics_process(_delta: float) -> void:
          \tmatch _phase:
          \t\tPHASE_SETTLED:
          \t\t\tlinear_velocity = Vector3.ZERO
          \t\t\tangular_velocity = Vector3.ZERO
          \t\t\t_last_contact_count = 0
          \t\t\tif _has_support():
          \t\t\t\t_unsupported_frames = 0
          \t\t\telse:
          \t\t\t\t_unsupported_frames += 1
          \t\t\t\tif _unsupported_frames >= 2:
          \t\t\t\t\t_begin_motion(MOTION_UNSUPPORTED, Vector3.ZERO)
          \t\tPHASE_CARRIED_JUNK:
          \t\t\tlinear_velocity = Vector3.ZERO
          \t\t\tangular_velocity = Vector3.ZERO
          \t\t\t_unsupported_frames = 0
          \t\t\t_settle_contact_frames = 0
          \t\t\t_last_contact_count = 0
          \t\tPHASE_MOVING, PHASE_SETTLING:
          \t\t\t_unsupported_frames = 0
          \t\t\tangular_velocity = Vector3.ZERO
          \t\t\t_update_dynamic_settling()


          func can_interact(interactor: Node) -> bool:
          \treturn _phase != PHASE_CARRIED_JUNK and interactor != null and interactor.has_method("try_carry_prop")


          func interact(interactor: Node) -> void:
          \tif can_interact(interactor):
          \t\tinteractor.call("try_carry_prop", self)


          func set_interaction_highlighted(highlighted: bool) -> void:
          \t_highlighted = highlighted
          \t_refresh_visual()


          func is_interaction_highlighted() -> bool:
          \treturn _highlighted


          func set_visual_model(model: Mesh) -> bool:
          \tif model == null:
          \t\treturn false
          \tvisual_model = model
          \tif prop_mesh != null:
          \t\tprop_mesh.mesh = model
          \treturn true


          func get_visual_model() -> Mesh:
          \treturn visual_model


          func get_semantic_phase() -> StringName:
          \treturn _phase


          func get_motion_kind() -> StringName:
          \treturn _motion_kind


          func is_supported() -> bool:
          \tif _phase == PHASE_CARRIED_JUNK:
          \t\treturn false
          \treturn _has_support()


          func is_world_presentation_enabled() -> bool:
          \treturn prop_mesh != null and prop_mesh.visible and collision_layer != 0 and collision_mask != 0


          func get_release_clearance_along(world_direction: Vector3, release_basis: Basis) -> float:
          \tvar box: BoxShape3D = prop_collision.shape as BoxShape3D if prop_collision != null else null
          \tif box == null:
          \t\treturn 0.3
          \tvar direction: Vector3 = world_direction.normalized()
          \tif direction.is_zero_approx():
          \t\treturn box.size.length() * 0.5
          \tvar local_direction: Vector3 = release_basis.inverse() * direction
          \tvar half: Vector3 = box.size * 0.5
          \treturn (
          \t\tabsf(local_direction.x) * half.x
          \t\t+ absf(local_direction.y) * half.y
          \t\t+ absf(local_direction.z) * half.z
          \t)


          func begin_carried_junk(holder: Node) -> bool:
          \tif holder == null or _phase == PHASE_CARRIED_JUNK:
          \t\treturn false
          \t_holder = holder
          \t_phase = PHASE_CARRIED_JUNK
          \t_motion_kind = MOTION_NONE
          \t_settle_contact_frames = 0
          \t_unsupported_frames = 0
          \t_last_contact_count = 0
          \tlinear_velocity = Vector3.ZERO
          \tangular_velocity = Vector3.ZERO
          \tfreeze = true
          \tsleeping = true
          \tset_interaction_highlighted(false)
          \t_set_world_presentation_enabled(false)
          \treturn true


          func release_from_carry(
          \tmotion_kind: StringName,
          \trelease_transform: Transform3D,
          \tinitial_velocity: Vector3
          ) -> bool:
          \tif _phase != PHASE_CARRIED_JUNK:
          \t\treturn false
          \tif motion_kind != MOTION_RELEASED and motion_kind != MOTION_THROWN:
          \t\treturn false
          \tif not _is_finite_transform(release_transform) or not _is_finite_vector(initial_velocity):
          \t\treturn false
          \t_holder = null
          \tglobal_transform = release_transform
          \t_set_world_presentation_enabled(true)
          \t_begin_motion(motion_kind, initial_velocity)
          \treturn true


          func capture_semantic_state() -> Dictionary:
          \treturn {
          \t\t"phase": _phase,
          \t\t"motion_kind": _motion_kind,
          \t\t"transform": global_transform,
          \t\t"linear_velocity": linear_velocity,
          \t\t"settle_yaw": _settle_yaw,
          \t}


          func apply_semantic_state(snapshot: Dictionary) -> bool:
          \tif snapshot.size() != 4 and snapshot.size() != 5:
          \t\treturn false
          \tif not snapshot.has("phase") or not snapshot.has("motion_kind") or not snapshot.has("transform") or not snapshot.has("linear_velocity"):
          \t\treturn false
          \tif typeof(snapshot["phase"]) != TYPE_STRING_NAME or typeof(snapshot["motion_kind"]) != TYPE_STRING_NAME:
          \t\treturn false
          \tif typeof(snapshot["transform"]) != TYPE_TRANSFORM3D or typeof(snapshot["linear_velocity"]) != TYPE_VECTOR3:
          \t\treturn false
          \tif snapshot.has("settle_yaw") and typeof(snapshot["settle_yaw"]) != TYPE_FLOAT and typeof(snapshot["settle_yaw"]) != TYPE_INT:
          \t\treturn false
          \tvar phase: StringName = snapshot["phase"]
          \tvar motion_kind: StringName = snapshot["motion_kind"]
          \tvar restored_transform: Transform3D = snapshot["transform"]
          \tvar restored_velocity: Vector3 = snapshot["linear_velocity"]
          \tif not _is_valid_phase(phase) or not _is_valid_motion_kind(motion_kind):
          \t\treturn false
          \tif not _is_finite_transform(restored_transform) or not _is_finite_vector(restored_velocity):
          \t\treturn false
          \tif (phase == PHASE_SETTLED or phase == PHASE_CARRIED_JUNK) and (motion_kind != MOTION_NONE or not restored_velocity.is_zero_approx()):
          \t\treturn false
          \tif (phase == PHASE_MOVING or phase == PHASE_SETTLING) and motion_kind == MOTION_NONE:
          \t\treturn false

          \t_phase = phase
          \t_motion_kind = motion_kind
          \tglobal_transform = restored_transform
          \tlinear_velocity = restored_velocity
          \tangular_velocity = Vector3.ZERO
          \t_settle_yaw = float(snapshot.get("settle_yaw", _yaw_from_basis(restored_transform.basis)))
          \t_holder = null
          \t_settle_contact_frames = 0
          \t_unsupported_frames = 0
          \t_last_contact_count = 0
          \t_set_world_presentation_enabled(phase != PHASE_CARRIED_JUNK)
          \tset_interaction_highlighted(false)
          \tif phase == PHASE_SETTLED or phase == PHASE_CARRIED_JUNK:
          \t\tfreeze = true
          \t\tsleeping = true
          \telse:
          \t\tfreeze = false
          \t\tsleeping = false
          \treturn true


          func reconcile_after_restore(holder: Node = null) -> bool:
          \tif _phase == PHASE_CARRIED_JUNK:
          \t\tif holder == null or not holder.has_method("reconcile_carried_junk_prop"):
          \t\t\treturn false
          \t\treturn bool(holder.call("reconcile_carried_junk_prop", self))
          \t_holder = null
          \t_set_world_presentation_enabled(true)
          \tif _phase == PHASE_SETTLED:
          \t\tfreeze = true
          \t\tsleeping = true
          \telse:
          \t\tfreeze = false
          \t\tsleeping = false
          \treturn true


          func _begin_motion(motion_kind: StringName, initial_velocity: Vector3) -> void:
          \t_phase = PHASE_MOVING
          \t_motion_kind = motion_kind
          \t_settle_yaw = _yaw_from_basis(global_transform.basis)
          \t_settle_contact_frames = 0
          \t_unsupported_frames = 0
          \t_last_contact_count = 0
          \tlinear_velocity = initial_velocity
          \tangular_velocity = Vector3.ZERO
          \tfreeze = false
          \tsleeping = false


          func _update_dynamic_settling() -> void:
          \tvar contact_count: int = get_colliding_bodies().size()
          \tif contact_count > 0 and _last_contact_count == 0:
          \t\t_queue_impact_sound(linear_velocity.length())
          \t_last_contact_count = contact_count

          \tif contact_count > 0 and linear_velocity.length() <= maxf(settle_linear_speed, 0.01):
          \t\t_settle_contact_frames += 1
          \t\t_phase = PHASE_SETTLING
          \t\tif _settle_contact_frames >= maxi(settle_contact_frames_required, 1):
          \t\t\t_settle_now()
          \t\treturn

          \t_settle_contact_frames = 0
          \t_phase = PHASE_MOVING


          func _settle_now() -> void:
          \tvar settled_origin: Vector3 = global_position
          \tfreeze = true
          \tlinear_velocity = Vector3.ZERO
          \tangular_velocity = Vector3.ZERO
          \tglobal_transform = Transform3D(_top_up_basis_for_yaw(_settle_yaw), settled_origin)
          \tsleeping = true
          \t_phase = PHASE_SETTLED
          \t_motion_kind = MOTION_NONE
          \t_settle_contact_frames = 0
          \t_unsupported_frames = 0
          \t_last_contact_count = 0


          func _has_support() -> bool:
          \tif prop_collision == null or prop_collision.shape == null or not is_inside_tree():
          \t\treturn false
          \tvar box: BoxShape3D = prop_collision.shape as BoxShape3D
          \tif box == null:
          \t\treturn false
          \tvar half: Vector3 = box.size * 0.5
          \tvar inset: float = clampf(support_probe_inset, 0.0, 1.0)
          \tvar x: float = half.x * inset
          \tvar z: float = half.z * inset
          \tvar local_points: Array[Vector3] = [
          \t\tVector3(0.0, -half.y, 0.0),
          \t\tVector3(-x, -half.y, -z), Vector3(x, -half.y, -z),
          \t\tVector3(-x, -half.y, z), Vector3(x, -half.y, z),
          \t\tVector3(-x, -half.y, 0.0), Vector3(x, -half.y, 0.0),
          \t\tVector3(0.0, -half.y, -z), Vector3(0.0, -half.y, z),
          \t]
          \tfor local_point: Vector3 in local_points:
          \t\tvar bottom: Vector3 = global_transform * local_point
          \t\tvar origin: Vector3 = bottom + Vector3.UP * 0.02
          \t\tvar query := PhysicsRayQueryParameters3D.create(
          \t\t\torigin,
          \t\t\tbottom + Vector3.DOWN * maxf(support_probe_distance, 0.03)
          \t\t)
          \t\tquery.exclude = [get_rid()]
          \t\tquery.collision_mask = _ordinary_collision_mask
          \t\tquery.collide_with_areas = false
          \t\tquery.collide_with_bodies = true
          \t\tvar hit: Dictionary = get_world_3d().direct_space_state.intersect_ray(query)
          \t\tif not hit.is_empty():
          \t\t\tvar normal: Vector3 = hit.get("normal", Vector3.UP)
          \t\t\tif normal.y >= minimum_support_normal_y:
          \t\t\t\treturn true
          \treturn false


          func _set_world_presentation_enabled(enabled: bool) -> void:
          \tif prop_mesh != null:
          \t\tprop_mesh.visible = enabled
          \tif enabled:
          \t\tcollision_layer = _ordinary_collision_layer
          \t\tcollision_mask = _ordinary_collision_mask
          \telse:
          \t\tcollision_layer = 0
          \t\tcollision_mask = 0


          func _refresh_visual() -> void:
          \tif _material == null:
          \t\treturn
          \t_material.albedo_color = base_color
          \t_material.emission_enabled = false
          \t_material.disable_receive_shadows = _highlighted
          \t_material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED if _highlighted else BaseMaterial3D.SHADING_MODE_PER_PIXEL


          func _queue_impact_sound(impact_speed: float) -> void:
          \tif _world_session == null:
          \t\treturn
          \tvar speed_scale: float = clampf(impact_speed / maxf(throw_speed, 0.1), 0.15, 1.0)
          \tvar strength: float = impact_sound_strength * speed_scale
          \tif _motion_kind == MOTION_RELEASED:
          \t\tstrength *= clampf(gentle_release_sound_scale, 0.0, 1.0)
          \tvar source_session_id: int = int(_world_session.get("session_id"))
          \t_world_session.call("queue_gameplay_sound", source_session_id, IMPACT_SOUND_KIND, global_position, maxf(strength, 0.001))


          func _find_world_session() -> Node:
          \tvar cursor: Node = get_parent()
          \twhile cursor != null:
          \t\tif cursor.has_method("queue_gameplay_sound"):
          \t\t\treturn cursor
          \t\tcursor = cursor.get_parent()
          \treturn null


          func _yaw_from_basis(source_basis: Basis) -> float:
          \tvar basis: Basis = source_basis.orthonormalized()
          \tvar forward: Vector3 = -basis.z
          \tforward.y = 0.0
          \tif forward.length_squared() <= 0.000001:
          \t\tvar right: Vector3 = basis.x
          \t\tright.y = 0.0
          \t\tif right.length_squared() <= 0.000001:
          \t\t\treturn 0.0
          \t\tright = right.normalized()
          \t\tforward = Vector3(right.z, 0.0, -right.x)
          \tforward = forward.normalized()
          \treturn atan2(-forward.x, -forward.z)


          func _top_up_basis_for_yaw(yaw: float) -> Basis:
          \treturn Basis(Vector3.UP, yaw).orthonormalized()


          func _is_valid_phase(phase: StringName) -> bool:
          \treturn phase == PHASE_SETTLED or phase == PHASE_CARRIED_JUNK or phase == PHASE_MOVING or phase == PHASE_SETTLING


          func _is_valid_motion_kind(motion_kind: StringName) -> bool:
          \treturn motion_kind == MOTION_NONE or motion_kind == MOTION_RELEASED or motion_kind == MOTION_THROWN or motion_kind == MOTION_UNSUPPORTED


          func _is_finite_vector(value: Vector3) -> bool:
          \treturn is_finite(value.x) and is_finite(value.y) and is_finite(value.z)


          func _is_finite_transform(value: Transform3D) -> bool:
          \treturn _is_finite_vector(value.origin) and _is_finite_vector(value.basis.x) and _is_finite_vector(value.basis.y) and _is_finite_vector(value.basis.z)
          '''.replace('          ', ''))

          write('gameplay/props/OrdinaryProp.tscn', '''[gd_scene load_steps=5 format=3]

          [ext_resource type="Script" path="res://gameplay/props/ordinary_prop.gd" id="1_prop"]
          [ext_resource type="ArrayMesh" path="res://assets/models/props/ordinary_crate.obj" id="2_visual"]

          [sub_resource type="PhysicsMaterial" id="PropPhysicsMaterial"]
          friction = 0.8
          bounce = 0.05

          [sub_resource type="BoxShape3D" id="PropShape"]
          size = Vector3(0.6, 0.6, 0.6)

          [node name="OrdinaryProp" type="RigidBody3D"]
          mass = 1.5
          physics_material_override = SubResource("PropPhysicsMaterial")
          continuous_cd = true
          contact_monitor = true
          max_contacts_reported = 8
          linear_damp = 0.1
          lock_rotation = true
          freeze = true
          script = ExtResource("1_prop")
          visual_model = ExtResource("2_visual")

          [node name="PropMesh" type="MeshInstance3D" parent="."]

          [node name="CollisionShape3D" type="CollisionShape3D" parent="."]
          shape = SubResource("PropShape")
          '''.replace('          ', ''))

          write('player/interaction/player_prop_carry.gd', '''class_name PlayerPropCarry
          extends RefCounted


          var player: CharacterBody3D
          var camera: Camera3D
          var held_prop: Node = null
          var hud_container: Control
          var hud_mesh: MeshInstance3D
          var hud_material: StandardMaterial3D

          var release_distance: float = 1.15
          var release_surface_padding: float = 0.006
          var release_speed: float = 0.55


          func _init(
          \towner: CharacterBody3D,
          \tview_camera: Camera3D,
          \tcarried_hud_container: Control,
          \tcarried_hud_mesh: MeshInstance3D,
          \tcarried_hud_material: StandardMaterial3D
          ) -> void:
          \tplayer = owner
          \tcamera = view_camera
          \thud_container = carried_hud_container
          \thud_mesh = carried_hud_mesh
          \thud_material = carried_hud_material
          \t_refresh_hud(null)


          func has_held_prop() -> bool:
          \treturn held_prop != null and is_instance_valid(held_prop)


          func get_held_prop() -> Node:
          \treturn held_prop if has_held_prop() else null


          func try_pick_up(prop: Node) -> bool:
          \tif has_held_prop() or prop == null or not (prop is Node3D):
          \t\treturn false
          \tif not prop.has_method("begin_carried_junk") or not prop.has_method("release_from_carry"):
          \t\treturn false
          \tif not bool(prop.call("begin_carried_junk", player)):
          \t\treturn false
          \theld_prop = prop
          \t_refresh_hud(prop)
          \treturn true


          func adopt_restored_held_prop(prop: Node) -> bool:
          \tif has_held_prop() or prop == null or not (prop is Node3D):
          \t\treturn false
          \tif not prop.has_method("get_semantic_phase") or prop.call("get_semantic_phase") != &"carried_junk":
          \t\treturn false
          \theld_prop = prop
          \t_refresh_hud(prop)
          \treturn true


          func release_held_gently() -> bool:
          \tif not has_held_prop():
          \t\treturn false
          \tvar forward: Vector3 = -camera.global_transform.basis.z.normalized()
          \tvar initial_velocity: Vector3 = forward * release_speed + player.velocity * 0.15
          \treturn _release(&"released", initial_velocity)


          func throw_held() -> bool:
          \tif not has_held_prop():
          \t\treturn false
          \tvar speed: float = maxf(float(held_prop.get("throw_speed")), 0.0)
          \tvar forward: Vector3 = -camera.global_transform.basis.z.normalized()
          \tvar initial_velocity: Vector3 = forward * speed + player.velocity
          \treturn _release(&"thrown", initial_velocity)


          func clear_reference() -> void:
          \theld_prop = null
          \t_refresh_hud(null)


          func _release(motion_kind: StringName, initial_velocity: Vector3) -> bool:
          \tvar prop: Node = held_prop
          \tvar released: bool = bool(prop.call(
          \t\t"release_from_carry",
          \t\tmotion_kind,
          \t\t_compute_release_transform(),
          \t\tinitial_velocity
          \t))
          \tif released:
          \t\theld_prop = null
          \t\t_refresh_hud(null)
          \treturn released


          func _compute_release_transform() -> Transform3D:
          \tvar view_basis: Basis = camera.global_transform.basis.orthonormalized()
          \tvar forward: Vector3 = -view_basis.z.normalized()
          \tvar release_basis: Basis = (
          \t\tview_basis * Basis(Vector3.BACK, PI * 0.5)
          \t).orthonormalized()
          \tvar origin: Vector3 = camera.global_position
          \tvar desired: Vector3 = origin + forward * release_distance
          \tvar query := PhysicsRayQueryParameters3D.create(origin, desired)
          \tquery.exclude = [player.get_rid()]
          \tquery.collision_mask = 0xFFFFFFFF
          \tquery.collide_with_areas = false
          \tquery.collide_with_bodies = true
          \tvar hit: Dictionary = camera.get_world_3d().direct_space_state.intersect_ray(query)
          \tif not hit.is_empty():
          \t\tvar clearance: float = 0.3
          \t\tif held_prop != null and held_prop.has_method("get_release_clearance_along"):
          \t\t\tclearance = float(held_prop.call("get_release_clearance_along", forward, release_basis))
          \t\tdesired = hit.get("position", desired) - forward * (maxf(clearance, 0.0) + release_surface_padding)
          \treturn Transform3D(release_basis, desired)


          func _refresh_hud(prop: Node) -> void:
          \tif hud_container == null or hud_mesh == null:
          \t\treturn
          \tvar active: bool = prop != null and is_instance_valid(prop)
          \thud_container.visible = active
          \tif not active:
          \t\thud_mesh.mesh = null
