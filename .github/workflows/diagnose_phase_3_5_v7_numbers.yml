name: Diagnose Phase 3.5 tangent mantle numbers
on:
  push:
    branches: [test]
    paths: [.github/workflows/diagnose_phase_3_5_v7_numbers.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: {ref: test, fetch-depth: 0}
      - name: Reapply regression and tangent fix with numeric trace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          def exec_step(path, marker, next_marker):
              s=Path(path).read_text(); start=s.index(marker); end=s.index(next_marker,start); block=s[start:end]
              ps=block.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n"); pe=block.rindex('\n          PY')
              exec(textwrap.dedent(block[ps:pe]), {})
          exec_step('.github/workflows/validate_phase_3_5_mantle_attachment_v5.yml','      - name: Apply angled production-contact regression\n','      - uses: chickensoft-games/setup-godot@v2\n')
          exec_step('.github/workflows/validate_phase_3_5_mantle_attachment_v7.yml','      - name: Apply tangent-only source motion inheritance\n','      - name: Verify focused Props\n')
          p=Path('tests/props/phase_3_5_transition_regressions.gd'); t=p.read_text()
          needle='\tassert_true.call(\n\t\tsaw_lateral_prop_motion_during_mantle and max_attachment_lateral_error <= 0.01,\n\t\t"Moving-prop mantle keeps the player attachment-relative during lateral crate translation"\n\t)\n'
          repl='\tprint("TRACE_V7 lateral=", saw_lateral_prop_motion_during_mantle, " max_error=", max_attachment_lateral_error, " prop_dx=", prop.global_position.x - moving_start.x, " player=", player.global_position, " prop=", prop.global_position, " state=", controller.state)\n'+needle
          assert t.count(needle)==1
          p.write_text(t.replace(needle,repl,1))
          PY
      - uses: chickensoft-games/setup-godot@v2
        with: {version: 4.7.2, use-dotnet: false, include-templates: false}
      - run: godot --headless --path . --import
      - name: Capture numbers
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/props/run_prop_tests.gd 2>&1 | tee /tmp/out
          set -e
          grep -E 'TRACE_V7|FAIL: Moving-prop mantle' /tmp/out > .phase35_v7_numbers.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .phase35_v7_numbers.log
          git commit -m 'Record tangent mantle numeric diagnostics'
          git push origin HEAD:test
