name: Validate discriminating Phase 3.5 angled mantle regression
on:
  push:
    branches: [test]
    paths: [.github/workflows/validate_phase_3_5_mantle_attachment_v8.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with: {ref: test, fetch-depth: 0}
      - name: Apply proven angled regression with discriminating thresholds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/validate_phase_3_5_mantle_attachment_v5.yml').read_text(); start=s.index('      - name: Apply angled production-contact regression\n'); end=s.index('      - uses: chickensoft-games/setup-godot@v2\n',start); block=s[start:end]
          ps=block.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n"); pe=block.rindex('\n          PY'); exec(textwrap.dedent(block[ps:pe]), {})
          p=Path('tests/props/phase_3_5_transition_regressions.gd'); t=p.read_text()
          a='\t\tif absf(prop.global_position.x - moving_start.x) > 0.01:\n'; b='\t\tif absf(prop.global_position.x - moving_start.x) > 0.005:\n'; assert t.count(a)==1; t=t.replace(a,b,1)
          a='saw_lateral_prop_motion_during_mantle and max_attachment_lateral_error <= 0.01'; b='saw_lateral_prop_motion_during_mantle and max_attachment_lateral_error <= 0.003'; assert t.count(a)==1; t=t.replace(a,b,1)
          p.write_text(t)
          PY
      - uses: chickensoft-games/setup-godot@v2
        with: {version: 4.7.2, use-dotnet: false, include-templates: false}
      - run: godot --headless --path . --import
      - name: Prove old code fails for attachment error
        shell: bash
        run: |
          set -euo pipefail
          set +e
          godot --headless --path . --script res://tests/props/run_prop_tests.gd 2>&1 | tee /tmp/pre.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'FAIL: Moving-prop mantle keeps the player attachment-relative during lateral crate translation' /tmp/pre.log
      - name: Apply proven tangent-only correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/validate_phase_3_5_mantle_attachment_v7.yml').read_text(); start=s.index('      - name: Apply tangent-only source motion inheritance\n'); end=s.index('      - name: Verify focused Props\n',start); block=s[start:end]
          ps=block.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n"); pe=block.rindex('\n          PY'); exec(textwrap.dedent(block[ps:pe]), {})
          PY
      - name: Verify focused Props
        run: godot --headless --path . --script res://tests/props/run_prop_tests.gd
      - name: Verify focused Movement
        run: godot --headless --path . --script res://tests/movement/run_movement_tests.gd
      - name: Verify authoritative full barrier
        run: godot --headless --path . --script res://tests/run_all_tests.gd
