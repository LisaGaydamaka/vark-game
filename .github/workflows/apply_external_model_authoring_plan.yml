name: Apply external-model authoring plan

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Apply bounded documentation update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          plan_path = Path('docs/DEVELOPMENT_PLAN.md')
          plan = plan_path.read_text(encoding='utf-8')

          plan = replace_once(plan, '''- TrenchBroom: geometry and ordinary spatial entities
          - typed Godot Resources/config: reusable non-spatial authored configuration
          - GDScript: genuinely procedural or unusual mission behavior through supported APIs
          - writer-facing text data: dialogue/narrative content without gameplay-code editing

          Shared authored/configuration Resources are treated as configuration, not mission-local mutable runtime state. Mutable gameplay state belongs to the current world/session or concrete runtime owner.
          '''.replace('          ', ''), '''- TrenchBroom: structural brush geometry plus placement/configuration of ordinary spatial entities
          - external Godot-supported 3D model assets: reusable visual geometry for ordinary objects such as doors/openable windows, furniture, containers, movable props, mechanisms, and loot presentation
          - typed Godot Resources/config: reusable non-spatial authored configuration
          - GDScript: genuinely procedural or unusual mission behavior through supported APIs
          - writer-facing text data: dialogue/narrative content without gameplay-code editing

          Structural architecture such as rooms, walls, floors, ceilings, stairs, and major built forms remains natural TrenchBroom brush geometry. Reusable object visuals should use external model assets when that is the natural representation rather than forcing furniture/doors/props into brush geometry.

          The Vark gameplay archetype/entity owns semantic behavior, persistent/content identity, interaction/state, and the stable authoring contract. The selected external model is replaceable presentation/configuration and must not become the object's semantic identity or make gameplay depend on fragile mesh/node names. Openable windows are ordinary door/opening variants and reuse the same door behavior/integration contracts; do not create a separate window gameplay subsystem.

          Shared authored/configuration Resources are treated as configuration, not mission-local mutable runtime state. Mutable gameplay state belongs to the current world/session or concrete runtime owner.
          '''.replace('          ', ''), 'development authoring model contract')

          plan = replace_once(plan, '''Primary spatial authoring tool for brush geometry/materials, routes/rooms, player starts, guards/patrol markers, doors/lights, loot/containers/props, triggers/exits, and ordinary spatial mission objects.

          The `.map` file is authored source. Generated/imported geometry must not contain irreplaceable manual edits.
          '''.replace('          ', ''), '''Primary spatial authoring tool for brush geometry/materials, routes/rooms, player starts, guards/patrol markers, doors/lights, loot/containers/props, triggers/exits, and ordinary spatial mission objects. TrenchBroom also places/configures model-backed ordinary entities; reusable furniture, doors/openable windows, containers, props, and similar objects do not need to be rebuilt as brushes merely to participate in mission authoring.

          The `.map` file is authored source. Generated/imported geometry must not contain irreplaceable manual edits. External 3D model assets are authored visual source alongside the map: the map/entity selects a model or variant while Vark's gameplay archetype remains the semantic owner.
          '''.replace('          ', ''), 'TrenchBroom model-backed authoring')

          plan = replace_once(plan, '''`mission.tres` is the authored `MissionDefinition` metadata owner for a package. `mission.gd` is optional; a simple mission must not require custom mission behavior GDScript. `world.tscn` is the current Godot runtime wrapper around the package's authored spatial source; the exact amount of technical loader glue may shrink as Phase 2 proves the final import/loading workflow.
          '''.replace('          ', ''), '''`mission.tres` is the authored `MissionDefinition` metadata owner for a package. `mission.gd` is optional; a simple mission must not require custom mission behavior GDScript. `world.tscn` is the current Godot runtime wrapper around the package's authored spatial source; the exact amount of technical loader glue may shrink as Phase 2 proves the final import/loading workflow. Reusable external models may live in shared project asset locations while mission-specific models may live under the package `assets/` directory; an asset path/filename is presentation configuration, not persistent identity or saved semantic type.
          '''.replace('          ', ''), 'mission package model assets')

          plan = replace_once(plan, '''The first ordinary door is a reusable `AnimatableBody3D` hinge leaf rather than the 3.1 door-like probe. It consumes the same `vark_interactable` surface and Thief-style selection presentation, owns explicit `closed/opening/open/closing` semantic phase plus `open_fraction`, and advances its physical hinge transform from gameplay physics rather than a tween/coroutine as durable truth. A completed transition emits `door.state_changed`; each accepted use emits the 3.3 `gameplay.sound` source fact with kind `door.use`. The physical leaf collider is also the closed-door vision obstruction, so opening clears the actual doorway rather than toggling a separate invisible blocker.
          '''.replace('          ', ''), '''The first ordinary door is a reusable `AnimatableBody3D` hinge leaf rather than the 3.1 door-like probe. It consumes the same `vark_interactable` surface and Thief-style selection presentation, owns explicit `closed/opening/open/closing` semantic phase plus `open_fraction`, and advances its physical hinge transform from gameplay physics rather than a tween/coroutine as durable truth. A completed transition emits `door.state_changed`; each accepted use emits the 3.3 `gameplay.sound` source fact with kind `door.use`. The physical leaf collider is also the closed-door vision obstruction, so opening clears the actual doorway rather than toggling a separate invisible blocker.

          The current 3.4 implementation proves those behavior seams with project-owned placeholder box presentation. Before 3.4 can become `[x]`, move the visible leaf behind a replaceable external 3D-model presentation seam and prove that choosing/swapping the model does not replace the ordinary-door semantic owner, interaction contract, collision/vision behavior, events, or save-state contract. An openable window is simply a door/opening variant using this same archetype/integration path; no separate window subsystem is planned.
          '''.replace('          ', ''), '3.4 external model follow-up')

          plan = replace_once(plan, '''**Done when:** one real ordinary door uses the accepted center-view/F interaction contract and selection feedback; interaction visibly animates one physical collision leaf between explicit closed/open states; the closed leaf blocks the doorway and straight-through vision while the fully open leaf clears both; accepted use emits one semantic `door.use` gameplay sound and completed transitions emit one semantic door-state event through the current world session; acoustic openness and navigation-passage state are exposed only as door-side source-state seams; semantic capture/apply preserves stable and in-progress state without serializing/replaying runtime continuation machinery; and no keys/locks/barred behavior, acoustic propagation, hearing consumer, guard AI, or general navigation framework is introduced.
          '''.replace('          ', ''), '''**Done when:** one real ordinary door uses the accepted center-view/F interaction contract and selection feedback; its visible leaf comes from a replaceable external 3D model asset while the ordinary-door archetype remains the semantic/gameplay owner; interaction visibly animates one physical collision leaf between explicit closed/open states; the closed leaf blocks the doorway and straight-through vision while the fully open leaf clears both; accepted use emits one semantic `door.use` gameplay sound and completed transitions emit one semantic door-state event through the current world session; acoustic openness and navigation-passage state are exposed only as door-side source-state seams; semantic capture/apply preserves stable and in-progress state without serializing/replaying runtime continuation machinery; swapping a compatible visual model does not require changing gameplay rules; and no keys/locks/barred behavior, separate window subsystem, acoustic propagation, hearing consumer, guard AI, or general navigation framework is introduced.
          '''.replace('          ', ''), '3.4 done when model')

          plan = replace_once(plan, '''**Automated:** pending post-push CI — the new focused Application regression launches `Door Lab` through the real application/session/player path and deterministically covers accepted interaction/highlight reuse, closed/open physical-overlap and vision-ray behavior, animated phase/progress, one semantic `door.use` source fact per accepted use, completed `door.state_changed` events, acoustic/navigation door-side seams, in-progress semantic capture/apply with invalid-state rejection, no consequence replay during apply, and closing restoration. It is wired into the authoritative Application suite and all-tests barrier.
          '''.replace('          ', ''), '''**Automated:** the existing focused Application regression covers the current door behavior seams through `Door Lab`. Before `[x]`, extend that deterministic coverage to prove the configured external-model presentation instantiates through the same ordinary-door archetype and that compatible model replacement does not change its semantic/collision/interaction/state behavior; then run the authoritative all-tests barrier on the resulting implementation head.
          '''.replace('          ', ''), '3.4 automated model')

          plan = replace_once(plan, '''**Manual:** required — validator: **Windows x64 user/playtester**. F5 → Development Launch → Door Lab; confirm the closed door selects with the accepted fullbright/no-received-shadow surface while retaining its ordinary cast shadow; one **F** press makes the physical leaf visibly swing open rather than snap, revealing the green marker and allowing the player through the doorway; aim at the open leaf and press **F** to visibly close it, after which the doorway is physically blocked and the green marker is occluded again; confirm there is no obvious ghost collision or locomotion/mouse-look regression. No audible door clip is expected in 3.4—the required sound proof here is the semantic gameplay-sound fact, not presentation audio.
          '''.replace('          ', ''), '''**Manual:** required after the external-model follow-up — validator: **Windows x64 user/playtester**. F5 → Development Launch → Door Lab; confirm the model-backed closed door selects with the accepted fullbright/no-received-shadow surface while retaining its ordinary cast shadow; one **F** press makes the physical leaf visibly swing open rather than snap, revealing the green marker and allowing the player through the doorway; aim at the open leaf and press **F** to visibly close it, after which the doorway is physically blocked and the green marker is occluded again; confirm there is no obvious ghost collision, presentation detachment, or locomotion/mouse-look regression. No audible door clip is expected in 3.4—the required sound proof here is the semantic gameplay-sound fact, not presentation audio.
          '''.replace('          ', ''), '3.4 manual model')

          plan = replace_once(plan, '''Protect the LOCKED rules:
          '''.replace('          ', ''), '''Use at least one representative replaceable external 3D model asset for the ordinary prop/furniture visual. The prop gameplay archetype owns support/carry/interaction/save semantics; the model is replaceable presentation and must not become semantic identity.

          Protect the LOCKED rules:
          '''.replace('          ', ''), '3.5 model prop')

          plan = replace_once(plan, '''## 6.2 Door completion `[ ]`

          Keys/locks/barred restrictions, authoring properties, obstruction behavior, NPC use, events, save state.
          '''.replace('          ', ''), '''## 6.2 Door completion `[ ]`

          Keys/locks/barred restrictions, authoring properties, obstruction behavior, NPC use, events, save state. Complete the mapper-facing external-model/variant authoring path so wooden, metal, ornate, window-like, or other compatible opening presentations can reuse the same ordinary door/opening gameplay archetype. Openable windows are variants of this system, not a separate gameplay subsystem.
          '''.replace('          ', ''), '6.2 door variants')

          plan = replace_once(plan, '''## 6.4 Containers `[ ]`

          Physical opening/exposed contents where appropriate.
          '''.replace('          ', ''), '''## 6.4 Containers `[ ]`

          Physical opening/exposed contents where appropriate. Ordinary cabinets, chests, drawers, and furniture-like containers use reusable external model assets/variants where appropriate rather than requiring bespoke brush geometry or gameplay code per visual model.
          '''.replace('          ', ''), '6.4 containers models')

          plan = replace_once(plan, '''Expand support relationships, stacking/climbing, held presentation, drop/throw, impacts/noise, obstruction, and save state only as real content needs them.
          '''.replace('          ', ''), '''Expand support relationships, stacking/climbing, held presentation, drop/throw, impacts/noise, obstruction, save state, and reusable external-model presentation/variant authoring only as real content needs them. Furniture/prop visual replacement must not require rewriting the shared physical-prop gameplay rules.
          '''.replace('          ', ''), '6.6 prop models')

          plan = replace_once(plan, '''The mission uses real TrenchBroom geometry/entities, multiple routes where practical, doors/keys, darkness/light, surfaces, throwable props, guard patrol/investigation, typed audible speech, loot/container interaction, objectives, one declarative rule, one mission-specific GDScript example where useful, quicksave/load, restart, and minimal results/run-stat inspection.
          '''.replace('          ', ''), '''The mission uses real TrenchBroom geometry/entities, multiple routes where practical, reusable external-model-backed doors/openings and furniture/props, doors/keys, darkness/light, surfaces, throwable props, guard patrol/investigation, typed audible speech, loot/container interaction, objectives, one declarative rule, one mission-specific GDScript example where useful, quicksave/load, restart, and minimal results/run-stat inspection.
          '''.replace('          ', ''), 'phase 8 model objects')

          plan = replace_once(plan, '''## 8.1 Mapper workflow proof `[ ]`

          A mapper should not need hand-edits in generated output.
          '''.replace('          ', ''), '''## 8.1 Mapper workflow proof `[ ]`

          A mapper should not need hand-edits in generated output. The ordinary workflow includes placing/configuring model-backed gameplay entities and selecting compatible reusable model variants without editing core gameplay scenes/code.
          '''.replace('          ', ''), '8.1 model workflow')

          plan = replace_once(plan, '''## 11.2 Vark TrenchBroom entity library `[ ]`

          Promote ordinary entities/fields proven in real mission authoring.
          '''.replace('          ', ''), '''## 11.2 Vark TrenchBroom entity library `[ ]`

          Promote ordinary entities/fields proven in real mission authoring, including the stable model/variant-facing fields needed for reusable model-backed doors/openings, containers/furniture, props, and other ordinary modeled world objects. Do not expose fragile imported mesh hierarchy as gameplay API.
          '''.replace('          ', ''), '11.2 model fields')

          plan = replace_once(plan, '''## 14.1 Art replacement paths `[ ]`

          Models/textures/animations/HUD/menu assets can be replaced without changing gameplay rules.
          '''.replace('          ', ''), '''## 14.1 Art replacement paths `[ ]`

          Models/textures/animations/HUD/menu assets can be replaced without changing gameplay rules. This phase hardens production replacement at scale; it is **not** the first proof of model-backed world objects. Doors/openable windows, containers/furniture, and representative props must already have used replaceable external 3D model presentation through their earlier gameplay/authoring proofs.
          '''.replace('          ', ''), '14.1 replacement clarification')

          plan = replace_once(plan, '''## Door / acoustic / lighting / prop / nav integration

          Keep small representative fixtures and progressively use the same ordinary gameplay objects rather than subsystem-specific fakes.

          The prop fixture includes locked held-prop presentation/no-free-rotation/no-ordinary-interaction behavior.
          '''.replace('          ', ''), '''## Door / acoustic / lighting / prop / nav integration

          Keep small representative fixtures and progressively use the same ordinary gameplay objects rather than subsystem-specific fakes.

          Prove the external-model presentation seam early on those real objects: the ordinary door/opening and representative prop use replaceable model assets while gameplay identity/state/collision/integration remain owned by their Vark archetypes. An openable window reuses the ordinary door/opening path rather than creating a parallel subsystem.

          The prop fixture includes locked held-prop presentation/no-free-rotation/no-ordinary-interaction behavior.
          '''.replace('          ', ''), 'early model integration proof')

          plan = replace_once(plan, '''1. Complete 3.1 minimal-interaction CI/manual acceptance, then continue with 3.2; keep the event/sound contracts in their ordered roadmap items.
          '''.replace('          ', ''), '''1. Finish the current 3.4 ordinary-door item by adding/proving its replaceable external-model presentation seam, then complete its authoritative automated validation and focused Windows manual acceptance before moving to 3.5.
          '''.replace('          ', ''), 'immediate sequence current step')

          plan_path.write_text(plan, encoding='utf-8')

          vision_path = Path('docs/GAME_VISION.md')
          vision = vision_path.read_text(encoding='utf-8')

          vision = replace_once(vision, '''Examples include doors, drawers, containers, switches, loot, keys, inventory items, extinguishable lights, movable props, and bodies.

          ---

          # Doors — LOCKED capabilities, integration spine
          '''.replace('          ', ''), '''Examples include doors, drawers, containers, switches, loot, keys, inventory items, extinguishable lights, movable props, and bodies.

          ---

          # Reusable modeled world objects — LOCKED authoring direction

          Major structural architecture such as rooms, walls, floors, ceilings, stairs, and other built forms may remain brush-authored through TrenchBroom.

          Reusable ordinary objects use external Godot-supported 3D model assets when that is the natural representation. This includes doors/openable windows, furniture, containers, movable props, mechanisms, loot presentation, and other repeated modeled world objects.

          The gameplay archetype/entity and the visual model are separate concerns. The Vark archetype owns gameplay behavior, semantic/persistent identity, interaction/state, and cross-system integration. A model asset supplies replaceable presentation/configuration and must not become semantic identity or require gameplay code to depend on fragile imported mesh/node names.

          Different compatible visual models should therefore be able to reuse the same gameplay archetype—for example wooden, metal, and ornate door models using ordinary door behavior, or chair/crate/vase models using ordinary prop behavior.

          Openable windows are treated as ordinary door/opening variants. They reuse the same interaction, movement/open-state, collision/vision/acoustic/navigation/save integration as appropriate and do **not** require a separate window gameplay subsystem. A purely static/decorative window may simply be ordinary architecture/model presentation.

          Final art replacement must preserve these gameplay contracts rather than forcing gameplay rewrites.

          ---

          # Doors — LOCKED capabilities, integration spine
          '''.replace('          ', ''), 'vision modeled objects section')

          vision = replace_once(vision, '''Doors physically animate between open and closed states. The player does not need a special mechanic for holding a normal door at an arbitrary partial angle.
          '''.replace('          ', ''), '''Doors physically animate between open and closed states. The player does not need a special mechanic for holding a normal door at an arbitrary partial angle. Compatible external model variants provide the visible door/openable-window presentation without replacing the shared ordinary-door gameplay contract.
          '''.replace('          ', ''), 'vision door models')

          vision = replace_once(vision, '''An object remains where the mission creator placed it until something explicitly acts on it or its support disappears.
          '''.replace('          ', ''), '''An object remains where the mission creator placed it until something explicitly acts on it or its support disappears.

          Ordinary furniture/prop archetypes may use different reusable external 3D model assets without changing these physical rules. Visual model choice is presentation/configuration, not a separate physics behavior or persistent identity.
          '''.replace('          ', ''), 'vision prop models')

          vision = replace_once(vision, '''A mission may contain geometry, lighting, surfaces, NPCs, patrols, routines, doors, containers, props, loot, keys, items, mechanisms, triggers, objectives, narrative events, cutscenes, hazards, rules, exits, statistics, and campaign consequences.
          '''.replace('          ', ''), '''A mission may contain brush geometry, external 3D model assets/variants, lighting, surfaces, NPCs, patrols, routines, doors/openable windows, containers, furniture/props, loot, keys, items, mechanisms, triggers, objectives, narrative events, cutscenes, hazards, rules, exits, statistics, and campaign consequences.
          '''.replace('          ', ''), 'vision mission models')

          vision = replace_once(vision, '''The game uses a readable low-fi first-person visual language inspired by Thief 1 & 2 and compatible with brush-based TrenchBroom construction.
          '''.replace('          ', ''), '''The game uses a readable low-fi first-person visual language inspired by Thief 1 & 2 and compatible with brush-based TrenchBroom construction. Structural spaces can remain brush-authored while reusable doors/openable windows, furniture, containers, props, mechanisms, and similar world objects use replaceable external 3D model assets through their gameplay archetypes.
          '''.replace('          ', ''), 'vision visual models')

          vision = replace_once(vision, '''- keys/doors/containers/props
          '''.replace('          ', ''), '''- keys/doors/openable-window variants/containers/furniture/props and their reusable external model variants
          '''.replace('          ', ''), 'vision author freedom models')

          vision = replace_once(vision, '''- doors/keys/containers
          '''.replace('          ', ''), '''- reusable external-model doors/openable-window variants/keys/containers/furniture
          '''.replace('          ', ''), 'vision completion models')

          vision_path.write_text(vision, encoding='utf-8')
          PY

          rm .github/workflows/apply_external_model_authoring_plan.yml
          git diff --check
          grep -q "Reusable modeled world objects" docs/GAME_VISION.md
          grep -q "Openable windows are ordinary door/opening variants" docs/DEVELOPMENT_PLAN.md
          grep -q "Finish the current 3.4 ordinary-door item" docs/DEVELOPMENT_PLAN.md

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run regression suites on final working tree
        run: godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Commit final documentation patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPMENT_PLAN.md docs/GAME_VISION.md .github/workflows/apply_external_model_authoring_plan.yml
          git diff --cached --check
          git commit -m "Plan external 3D model world objects"
          git push origin HEAD:test
