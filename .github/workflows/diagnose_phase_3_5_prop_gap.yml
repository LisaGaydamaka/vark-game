name: Diagnose Phase 3.5 prop floor gap

on:
  push:
    branches:
      - test

jobs:
  diagnose-phase-3-5-prop-gap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test

      - name: Apply staged candidate and add focused diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix_phase_3_5_prop_physics.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code_lines = []
          for line in source[start:end]:
              code_lines.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(code_lines), 'phase_3_5_prop_physics_fix.py', 'exec'), {})

          path = Path('tests/props/prop_regressions.gd')
          text = path.read_text(encoding='utf-8')
          needle = '\tassert_true.call(absf(pickup_prop.global_position.y - 0.3) <= 0.015, "A released crate settles directly on the floor instead of freezing with a visible air gap")\n'
          diagnostic = '\tvar release_contacts: Array[String] = []\n\tfor body: Node3D in pickup_prop.get_colliding_bodies():\n\t\trelease_contacts.append(str(body.get_path()))\n\tprint("DEBUG_RELEASE_GAP y=", pickup_prop.global_position.y, " transform=", pickup_prop.global_transform, " contacts=", release_contacts, " supported=", pickup_prop.call("is_supported"), " phase=", pickup_prop.call("get_semantic_phase"), " freeze=", pickup_prop.freeze)\n'
          if text.count(needle) != 1:
              raise SystemExit('diagnostic assertion marker not found exactly once')
          path.write_text(text.replace(needle, diagnostic + needle, 1), encoding='utf-8')
          PY

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run focused Props diagnostics
        run: godot --headless --path . --script res://tests/props/run_prop_tests.gd
