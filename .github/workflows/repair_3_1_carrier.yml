name: Repair 3.1 carrier

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair 3.1 interaction implementation carrier'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0
      - name: Correct documentation target and retrigger carrier
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/implement_3_1.yml')
          text = path.read_text()
          old = '''          replace_once(
              "docs/TESTING.md",
              ''' + "'''- gameplay-intent one-tick edge lifetime, domain-loss gesture cancellation, and no look/input-feel drift;\\n'''," + '''
              ''' + "'''- gameplay-intent one-tick edge lifetime, domain-loss gesture cancellation, and no look/input-feel drift;\\n- center-view interaction range/first-hit occlusion/current-state eligibility, one-frame primary-interaction intent, highlight clearing, and central ordinary-interaction availability;\\n'''" + '''
          )'''
          new = old.replace('"docs/TESTING.md"', '"docs/DEVELOPMENT_PLAN.md"')
          if text.count(old) != 1:
              raise SystemExit('expected one mistaken TESTING.md requirements target')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git rm .github/workflows/repair_3_1_carrier.yml
          git add .github/workflows/implement_3_1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare 3.1 interaction implementation"
          git push origin HEAD:test
