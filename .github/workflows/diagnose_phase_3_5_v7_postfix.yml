name: Diagnose Phase 3.5 tangent mantle post-fix
on:
  push:
    branches: [test]
    paths: [.github/workflows/diagnose_phase_3_5_v7_postfix.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: {ref: test, fetch-depth: 0}
      - name: Reapply validated regression and tangent fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          def exec_step(path, marker, next_marker):
              s=Path(path).read_text(); start=s.index(marker); end=s.index(next_marker,start); block=s[start:end]
              ps=block.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n"); pe=block.rindex('\n          PY')
              exec(textwrap.dedent(block[ps:pe]), {})
          exec_step('.github/workflows/validate_phase_3_5_mantle_attachment_v5.yml','      - name: Apply angled production-contact regression\n','      - uses: chickensoft-games/setup-godot@v2\n')
          exec_step('.github/workflows/validate_phase_3_5_mantle_attachment_v7.yml','      - name: Apply tangent-only source motion inheritance\n','      - name: Verify focused Props\n')
          PY
      - uses: chickensoft-games/setup-godot@v2
        with: {version: 4.7.2, use-dotnet: false, include-templates: false}
      - run: godot --headless --path . --import
      - name: Capture focused Props result
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/props/run_prop_tests.gd 2>&1 | tee /tmp/post.log
          set -e
          grep -E 'FAIL:|ERROR:|SCRIPT ERROR|Ground-mantle|Grounded mantle|Ground mantle|Prop-backed mantle|Moving-prop mantle|Completed moving-prop' /tmp/post.log > .phase35_v7_post.log || cp /tmp/post.log .phase35_v7_post.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .phase35_v7_post.log
          git commit -m 'Record tangent mantle post-fix diagnostics'
          git push origin HEAD:test
