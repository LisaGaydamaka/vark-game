name: Finalize Phase 3.5 true rigid throw

on:
  push:
    branches:
      - test
    paths:
      - ".github/workflows/finalize_phase_3_5_true_rigid_throw.yml"

permissions:
  contents: write

jobs:
  finalize-phase-3-5-true-rigid-throw:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Verify authoritative trigger head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin test
          test "$(git rev-parse origin/test)" = "$GITHUB_SHA"

      - name: Apply true rigid throw correction
        shell: bash
        run: |
          set -euo pipefail
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCgpwcm9wX3BhdGggPSBQYXRoKCJnYW1lcGxheS9wcm9wcy9vcmRpbmFyeV9wcm9wLmdkIikKcHJvcCA9IHByb3BfcGF0aC5yZWFkX3RleHQoZW5jb2Rpbmc9InV0Zi04IikKCm9sZCA9ICIiInZhciBfdGVtcG9yYXJ5X3BsYXllcl9jb2xsaXNpb25fZXhjZXB0aW9uOiBQaHlzaWNzQm9keTN EID0gbnVsbAp2YXIgX3BsYXllcl9lc2NhcGVfY29sbGlzaW9uX3N1cHByZXNzZWQ6IGJvb2wgPSBmYWxzZQp2YXIgX3BsYXllcl9lc2NhcGVfbGF1bmNoX3ZlbG9jaXR5OiBWZWN0b3IzID0gVmVjdG9yMy5aRVJPCnZhciBfcGxheWVyX2VzY2FwZV9zdGVwX3ZlbG9jaXR5OiBWZWN0b3IzID0gVmVjdG9yMy5aRVJPCiIiIgp    iIiIKbmV3ID0gIiIiXHRfdGVtcG9yYXJ5X3BsYXllcl9jb2xsaXNpb25fZXhjZXB0aW9uID0gbnVsbAo  lcdGFuZCBub3QgcHJvcC5zbGVlcGluZwoJXHRhbmQgcHJvcC5jb2xsaXNpb25fbGF5ZXIgPT0gMQoJXHRhbmQgcHJvcC5jb2xsaXNpb25fbWFzayA9PSAxCg ' | base64 -d > /tmp/phase35_throw_fix.py
          python /tmp/phase35_throw_fix.py
          rm -f .github/workflows/finalize_phase_3_5_true_rigid_throw.yml
          git diff --check

      - name: Verify bounded production tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/finalize_phase_3_5_true_rigid_throw.yml",
              "docs/DEVELOPMENT_PLAN.md",
              "docs/GAME_VISION.md",
              "gameplay/props/ordinary_prop.gd",
              "tests/props/phase_3_5_transition_regressions.gd",
          }
          raw = subprocess.check_output(["git", "status", "--porcelain=v1", "-uall"], text=True)
          changed = set()
          for line in raw.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)
          if changed != expected:
              raise SystemExit(
                  "bounded tree mismatch\nexpected=" + repr(sorted(expected)) +
                  "\nactual=" + repr(sorted(changed))
              )
          print("BOUNDED PRODUCTION TREE PASSED")
          PY

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: timeout 120s godot --headless --path . --import

      - name: Run focused Props suite
        run: timeout 150s godot --headless --path . --script res://tests/props/run_prop_tests.gd

      - name: Run authoritative full barrier
        run: timeout 240s godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Commit and push verified production tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin test
          test "$(git rev-parse origin/test)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/finalize_phase_3_5_true_rigid_throw.yml \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            gameplay/props/ordinary_prop.gd \
            tests/props/phase_3_5_transition_regressions.gd
          git diff --cached --check
          git commit -m "Restore true rigid prop throwing"
          git push origin HEAD:test
