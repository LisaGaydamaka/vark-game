name: Diagnose deterministic Phase 3.5 mantle setup
on:
  push:
    branches: [test]
    paths: [.github/workflows/diagnose_phase_3_5_mantle_v3.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: {ref: test, fetch-depth: 0}
      - name: Patch trace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/props/phase_3_5_transition_regressions.gd'); t=p.read_text()
          a='\tInput.action_press("jump")\n\tawait _settle_physics(tree)\n\tInput.action_release("jump")\n'
          b='\tInput.action_release("move_forward")\n\tvar lateral_push_applied: bool = bool(prop.call("receive_player_push", Vector3(1.0, 0.0, -1.0)))\n\tawait _settle_physics(tree)\n\tprint("TRACE setup push=", lateral_push_applied, " vx=", prop.linear_velocity.x, " phase=", prop.call("get_semantic_phase"), " player=", player.global_position, " prop=", prop.global_position)\n\tInput.action_press("move_forward")\n\tInput.action_press("jump")\n\tawait _settle_physics(tree)\n\tInput.action_release("jump")\n'
          assert t.count(a)==1; t=t.replace(a,b,1)
          a='\tInput.action_release("move_forward")\n\n\tvar moving_start: Vector3 = prop.global_position\n\tvar saw_prop_motion_during_mantle: bool = false\n'
          b='\tvar moving_start: Vector3 = prop.global_position\n\tvar attachment_local_start: Vector3 = prop.global_transform.affine_inverse() * player.global_position\n\tvar saw_prop_motion_during_mantle: bool = false\n\tvar saw_lateral_prop_motion_during_mantle: bool = false\n\tvar max_attachment_lateral_error: float = 0.0\n'
          assert t.count(a)==1; t=t.replace(a,b,1)
          a='\t\tif prop.global_position.distance_to(moving_start) > 0.01:\n\t\t\tsaw_prop_motion_during_mantle = true\n\t\tif (\n'
          b='\t\tif prop.global_position.distance_to(moving_start) > 0.01:\n\t\t\tsaw_prop_motion_during_mantle = true\n\t\tif absf(prop.global_position.x-moving_start.x)>0.02:\n\t\t\tsaw_lateral_prop_motion_during_mantle=true\n\t\tif controller.state == PlayerLedgeController.State.MANTLING:\n\t\t\tvar attachment_local_now: Vector3 = prop.global_transform.affine_inverse() * player.global_position\n\t\t\tmax_attachment_lateral_error=maxf(max_attachment_lateral_error, absf(attachment_local_now.x-attachment_local_start.x))\n\t\tif (\n'
          assert t.count(a)==1; t=t.replace(a,b,1)
          a='\tassert_true.call(\n\t\tsaw_prop_motion_during_mantle\n\t\tor prop.call("get_semantic_phase") == OrdinaryProp.PHASE_SETTLED,\n\t\t"Prop-backed mantle remains coherent while the shoved source prop moves or finishes settling"\n\t)\n\n\tvar locomotion_start: Vector3 = player.global_position\n'
          b='\tassert_true.call(\n\t\tsaw_prop_motion_during_mantle\n\t\tor prop.call("get_semantic_phase") == OrdinaryProp.PHASE_SETTLED,\n\t\t"Prop-backed mantle remains coherent while the shoved source prop moves or finishes settling"\n\t)\n\tprint("TRACE result lateral=", saw_lateral_prop_motion_during_mantle, " error=", max_attachment_lateral_error, " completed=", completed_mantle, " state=", controller.state, " dx=", prop.global_position.x-moving_start.x)\n\tInput.action_release("move_forward")\n\n\tvar locomotion_start: Vector3 = player.global_position\n'
          assert t.count(a)==1; t=t.replace(a,b,1)
          p.write_text(t)
          PY
      - uses: chickensoft-games/setup-godot@v2
        with: {version: 4.7.2, use-dotnet: false, include-templates: false}
      - run: godot --headless --path . --import
      - name: Run and capture
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/props/run_prop_tests.gd 2>&1 | tee /tmp/out
          set -e
          grep -E 'TRACE|FAIL:|ERROR:|Ground-mantle|Grounded mantle|Ground mantle|Prop-backed mantle|Completed moving-prop' /tmp/out > .phase35_v3_trace.log || cp /tmp/out .phase35_v3_trace.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .phase35_v3_trace.log
          git commit -m 'Record deterministic mantle setup trace'
          git push origin HEAD:test
