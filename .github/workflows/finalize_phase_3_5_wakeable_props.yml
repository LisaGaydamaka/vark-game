name: Finalize Phase 3.5 wakeable props

on:
  push:
    branches:
      - test
    paths:
      - ".github/workflows/finalize_phase_3_5_wakeable_props.yml"

permissions:
  contents: write

jobs:
  finalize-phase-3-5-wakeable-props:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Verify authoritative trigger head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin test
          test "$(git rev-parse origin/test)" = "$GITHUB_SHA"

      - name: Apply explicit prop physics correction
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase35_wakeable_props_fix_tmp.py
          python tools/phase35_explicit_prop_physics_fix_tmp.py
          python -m py_compile \
            tools/phase35_wakeable_props_tmp.py \
            tools/phase35_explicit_prop_physics_tmp.py
          python tools/phase35_wakeable_props_tmp.py
          python tools/phase35_explicit_prop_physics_tmp.py
          rm -f \
            .github/workflows/finalize_phase_3_5_wakeable_props.yml \
            tools/phase35_wakeable_props_tmp.py \
            tools/phase35_wakeable_props_fix_tmp.py \
            tools/phase35_explicit_prop_physics_tmp.py \
            tools/phase35_explicit_prop_physics_fix_tmp.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

      - name: Verify bounded production tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/finalize_phase_3_5_wakeable_props.yml",
              "tools/phase35_wakeable_props_tmp.py",
              "tools/phase35_wakeable_props_fix_tmp.py",
              "tools/phase35_explicit_prop_physics_tmp.py",
              "tools/phase35_explicit_prop_physics_fix_tmp.py",
              "gameplay/props/ordinary_prop.gd",
              "player/locomotion/player_contact_motion_solver.gd",
              "scenes/PropLab.tscn",
              "tests/props/prop_regressions.gd",
              "tests/props/phase_3_5_transition_regressions.gd",
              "docs/GAME_VISION.md",
              "docs/DEVELOPMENT_PLAN.md",
              "docs/TESTING.md",
          }
          raw = subprocess.check_output(["git", "status", "--porcelain=v1", "-uall"], text=True)
          changed = set()
          for line in raw.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)
          if changed != expected:
              raise SystemExit(
                  "bounded tree mismatch\nexpected=" + repr(sorted(expected)) +
                  "\nactual=" + repr(sorted(changed))
              )
          print("BOUNDED EXPLICIT PROP PHYSICS TREE PASSED")
          PY

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: timeout 120s godot --headless --path . --import

      - name: Run focused Props suite
        run: timeout 180s godot --headless --path . --script res://tests/props/run_prop_tests.gd

      - name: Run authoritative full barrier
        run: timeout 300s godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Commit and push verified production tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin test
          test "$(git rev-parse origin/test)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/finalize_phase_3_5_wakeable_props.yml \
            tools/phase35_wakeable_props_tmp.py \
            tools/phase35_wakeable_props_fix_tmp.py \
            tools/phase35_explicit_prop_physics_tmp.py \
            tools/phase35_explicit_prop_physics_fix_tmp.py \
            gameplay/props/ordinary_prop.gd \
            player/locomotion/player_contact_motion_solver.gd \
            scenes/PropLab.tscn \
            tests/props/prop_regressions.gd \
            tests/props/phase_3_5_transition_regressions.gd \
            docs/GAME_VISION.md \
            docs/DEVELOPMENT_PLAN.md \
            docs/TESTING.md
          git diff --cached --check
          git commit -m "Add explicit prop physics and smooth settling"
          git push origin HEAD:test
