name: Diagnose Phase 3.5 explicit prop physics

on:
  push:
    branches:
      - test
    paths:
      - ".github/workflows/diagnose_phase_3_5_explicit_props.yml"

permissions:
  contents: read

jobs:
  diagnose-explicit-props:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Reconstruct persisted candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase35_wakeable_props_fix_tmp.py
          python tools/phase35_explicit_prop_physics_fix_tmp.py
          python tools/phase35_explicit_prop_physics_write_fix_tmp.py
          python tools/phase35_wakeable_props_tmp.py
          python tools/phase35_explicit_prop_physics_tmp.py
          python tools/phase35_solver_owned_external_motion_tmp.py

      - name: Add prop-impact trace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("gameplay/props/ordinary_prop.gd")
          t = p.read_text(encoding="utf-8")
          anchor = 'func receive_prop_impact(source_velocity: Vector3) -> bool:\n'
          t = t.replace(anchor, anchor + '\tprint("TRACE_RECEIVE_PROP name=", name, " phase=", _phase, " freeze=", freeze, " source=", source_velocity)\n', 1)
          anchor = '\t_pending_external_impulse += horizontal_velocity.normalized() * impulse_strength\n\tsleeping = false\n'
          t = t.replace(anchor, '\t_pending_external_impulse += horizontal_velocity.normalized() * impulse_strength\n\tprint("TRACE_STAGE_PROP name=", name, " impulse=", _pending_external_impulse, " phase=", _phase, " freeze=", freeze)\n\tsleeping = false\n', 1)
          anchor = '\tif not _pending_external_impulse.is_zero_approx():\n\t\tstate.apply_central_impulse(_pending_external_impulse)\n'
          t = t.replace(anchor, '\tif not _pending_external_impulse.is_zero_approx():\n\t\tprint("TRACE_INTEGRATE_PROP name=", name, " before=", state.linear_velocity, " impulse=", _pending_external_impulse, " freeze=", freeze, " phase=", _phase)\n\t\tstate.apply_central_impulse(_pending_external_impulse)\n', 1)
          p.write_text(t, encoding="utf-8")

          p = Path("tests/props/phase_3_5_transition_regressions.gd")
          t = p.read_text(encoding="utf-8")
          anchor = '\tassert_true.call(\n\t\ttarget_moved\n'
          trace = '\tprint("TRACE_IMPACT_RESULT moved=", target_moved, " target_pos=", target.global_position, " start=", target_start, " delta=", target.global_position.distance_to(target_start), " phase=", target.call("get_semantic_phase"), " motion=", target.call("get_motion_kind"), " freeze=", target.freeze, " vel=", target.linear_velocity, " striker_pos=", striker.global_position, " striker_vel=", striker.linear_velocity, " striker_contacts=", striker.get_colliding_bodies())\n'
          t = t.replace(anchor, trace + anchor, 1)
          p.write_text(t, encoding="utf-8")
          PY

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import
        run: timeout 120s godot --headless --path . --import

      - name: Run traced Props suite
        run: timeout 180s godot --headless --path . --script res://tests/props/run_prop_tests.gd
