name: Clean Phase 3.5 generated validation artifacts

on:
  push:
    branches: [test]
    paths: [.github/workflows/cleanup_phase_3_5_generated_artifacts.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_SHA: e6bf630fb16c04ff5b032bc072b0dad00368d508
      SELF: .github/workflows/cleanup_phase_3_5_generated_artifacts.yml
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0
      - name: Remove generated validation artifacts
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            docs/TESTING.md \
            player/traversal/player_mantle.gd \
            tests/props/phase_3_5_transition_regressions.gd | sort > /tmp/expected

          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/current
          while IFS= read -r path; do
            if grep -Fxq "$path" /tmp/expected; then
              continue
            fi
            if [ "$path" = "$SELF" ]; then
              continue
            fi
            case "$path" in
              *.gd.uid|*.obj.import)
                git rm -- "$path"
                ;;
              *)
                echo "Unexpected non-generated Phase 3.5 diff path: $path" >&2
                exit 1
                ;;
            esac
          done < /tmp/current

          rm "$SELF"
          git add -A
          git diff --cached --check
          git diff --name-only "$BASE_SHA" | sort > /tmp/final
          diff -u /tmp/expected /tmp/final

      - name: Commit clean bounded tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Remove generated Phase 3.5 validation artifacts'
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/test)"
          git push origin HEAD:test
