name: Diagnose Phase 3.5 player exception release

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  diagnose-phase-3-5-player-exception:
    if: github.event.head_commit.message == 'Diagnose Phase 3.5 player exception release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Apply candidate and diagnostic probe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/phase35_transition_fix_tmp.py')
          text = path.read_text(encoding='utf-8')
          old = '    dynamic_settle + "func _has_support() -> bool:\\n",\n'
          new = '    dynamic_settle,\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'dynamic settle splice marker count={count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tools/phase35_transition_fix_tmp.py
          python -m py_compile tools/phase35_final_adjust_tmp.py
          python tools/phase35_transition_fix_tmp.py
          python tools/phase35_final_adjust_tmp.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/props/phase_3_5_transition_regressions.gd')
          text = path.read_text(encoding='utf-8')
          old = '''func _wait_for_player_exception_clear(tree: SceneTree, prop: RigidBody3D, player: CharacterBody3D, max_frames: int) -> bool:
\tfor _frame_index: int in max_frames:
\t\tif not bool(prop.call("has_temporary_player_collision_exception")) and not (player in prop.get_collision_exceptions()):
\t\t\treturn true
\t\tawait tree.physics_frame
\t\tawait tree.process_frame
\treturn false
'''
          new = '''func _wait_for_player_exception_clear(tree: SceneTree, prop: RigidBody3D, player: CharacterBody3D, max_frames: int) -> bool:
\tfor frame_index: int in max_frames:
\t\tvar overlap_now: bool = bool(prop.call("_shape_overlaps_body_at_transform", prop.global_transform, player))
\t\tif frame_index == 0 or frame_index % 5 == 0 or frame_index == max_frames - 1:
\t\t\tprint("PHASE35 EXCEPTION DIAG frame=", frame_index, " prop=", prop.global_position, " player=", player.global_position, " distance=", prop.global_position.distance_to(player.global_position), " velocity=", prop.linear_velocity, " overlap_query=", overlap_now, " temp_exception=", bool(prop.call("has_temporary_player_collision_exception")), " prop_has_player=", player in prop.get_collision_exceptions(), " player_has_prop=", prop in player.get_collision_exceptions())
\t\tif not bool(prop.call("has_temporary_player_collision_exception")) and not (player in prop.get_collision_exceptions()) and not (prop in player.get_collision_exceptions()):
\t\t\treturn true
\t\tawait tree.physics_frame
\t\tawait tree.process_frame
\treturn false
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'diagnostic wait marker count={count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: timeout 120s godot --headless --path . --import

      - name: Run focused Props diagnostic
        shell: bash
        run: |
          set +e
          timeout 150s godot --headless --path . --script res://tests/props/run_prop_tests.gd
          status=$?
          echo "Focused diagnostic exit status: $status"
          exit 1
