name: Retry Phase 3.5 transition finalizer

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  finalize-phase-3-5-transition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Apply readable candidate from staged payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path

          source = Path('.github/workflows/finalize_phase_3_5_transition_ownership.yml').read_text(encoding='utf-8')
          match = re.search(r"payload = '''([A-Za-z0-9+/=]+)'''", source)
          if match is None:
              raise SystemExit('staged transition payload not found')
          packed = base64.b64decode(match.group(1))
          # The original transport damaged only the zlib integrity trailer. The
          # raw DEFLATE body remains structurally valid; decode that body and
          # let the normal bounded-diff + Godot barriers validate its result.
          script = zlib.decompress(packed[2:-4], -zlib.MAX_WBITS).decode('utf-8')
          exec(compile(script, 'phase_3_5_transition_fix.py', 'exec'), {})
          PY

      - name: Remove temporary helpers and verify bounded diff
        shell: bash
        run: |
          rm .github/workflows/finalize_phase_3_5_transition_ownership.yml
          rm .github/workflows/finalize_phase_3_5_transition_retry.yml
          git diff --check
          actual="$(git status --short | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/finalize_phase_3_5_transition_ownership.yml \
            .github/workflows/finalize_phase_3_5_transition_retry.yml \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            docs/TESTING.md \
            gameplay/props/ordinary_prop.gd \
            player/interaction/player_prop_carry.gd \
            player/locomotion/player_support.gd \
            player/player.gd \
            player/traversal/player_ledge_controller.gd \
            tests/props/prop_regressions.gd | sort)"
          test "$actual" = "$expected"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run focused Props regressions
        run: godot --headless --path . --script res://tests/props/run_prop_tests.gd

      - name: Run authoritative regression barrier
        run: godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Commit Phase 3.5 transition correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/finalize_phase_3_5_transition_ownership.yml \
            .github/workflows/finalize_phase_3_5_transition_retry.yml \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            docs/TESTING.md \
            gameplay/props/ordinary_prop.gd \
            player/interaction/player_prop_carry.gd \
            player/locomotion/player_support.gd \
            player/player.gd \
            player/traversal/player_ledge_controller.gd \
            tests/props/prop_regressions.gd
          git diff --cached --check
          git commit -m "Fix Phase 3.5 prop transition ownership"
          git push origin HEAD:test
