name: Diagnose Phase 3.5 first physics tick

on:
  push:
    branches:
      - test

permissions:
  contents: read

jobs:
  diagnose-phase-3-5-first-tick:
    if: github.event.head_commit.message == 'Run Phase 3.5 first-tick diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Apply candidate and first-tick diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/phase35_transition_fix_tmp.py')
          text = path.read_text(encoding='utf-8')
          old = '    dynamic_settle + "func _has_support() -> bool:\\n",\n'
          new = '    dynamic_settle,\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'dynamic settle splice marker count={count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tools/phase35_transition_fix_tmp.py
          python -m py_compile tools/phase35_final_adjust_tmp.py
          python -m py_compile tools/phase35_first_tick_diag_tmp.py
          python tools/phase35_transition_fix_tmp.py
          python tools/phase35_final_adjust_tmp.py
          python tools/phase35_first_tick_diag_tmp.py
          git diff --check

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: timeout 120s godot --headless --path . --import

      - name: Run focused Props diagnostic
        shell: bash
        run: |
          set +e
          timeout 150s godot --headless --path . --script res://tests/props/run_prop_tests.gd
          status=$?
          echo "Focused diagnostic exit status: $status"
          exit 1
