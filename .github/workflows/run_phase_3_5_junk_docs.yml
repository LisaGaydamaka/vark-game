name: Run Phase 3.5 carried Junk docs update

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  run-doc-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Apply staged documentation rewrite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/update_phase_3_5_junk_docs.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code_lines = []
          for line in source[start:end]:
              if line.startswith('          '):
                  code_lines.append(line[10:])
              else:
                  code_lines.append(line)
          code = '\n'.join(code_lines)
          exec(compile(code, 'phase_3_5_junk_docs.py', 'exec'), {})
          PY

      - name: Remove temporary helpers and verify bounded diff
        shell: bash
        run: |
          rm .github/workflows/update_phase_3_5_junk_docs.yml
          rm .github/workflows/run_phase_3_5_junk_docs.yml
          git diff --check
          test "$(git status --short | sed 's/^...//' | sort)" = "$(printf '%s\n' \
            .github/workflows/run_phase_3_5_junk_docs.yml \
            .github/workflows/update_phase_3_5_junk_docs.yml \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            docs/TESTING.md | sort)"

      - name: Commit documentation contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GAME_VISION.md docs/DEVELOPMENT_PLAN.md docs/TESTING.md .github/workflows/update_phase_3_5_junk_docs.yml .github/workflows/run_phase_3_5_junk_docs.yml
          git diff --cached --check
          git commit -m "Redefine Phase 3.5 carried Junk behavior"
          git push origin HEAD:test
