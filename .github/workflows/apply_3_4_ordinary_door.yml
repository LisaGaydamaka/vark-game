name: Apply 3.4 ordinary door

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0
      - name: Apply bounded 3.4 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          doors = root / 'gameplay' / 'doors'
          doors.mkdir(parents=True, exist_ok=True)

          (doors / 'ordinary_door.gd').write_text(r'''class_name VarkOrdinaryDoor
          extends AnimatableBody3D


          const PHASE_CLOSED: StringName = &"closed"
          const PHASE_OPENING: StringName = &"opening"
          const PHASE_OPEN: StringName = &"open"
          const PHASE_CLOSING: StringName = &"closing"
          const STATE_CHANGED_EVENT_NAME: StringName = &"door.state_changed"
          const USE_SOUND_KIND: StringName = &"door.use"


          @export var door_id: StringName = &"door"
          @export var transition_seconds: float = 0.55
          @export var open_angle_degrees: float = 90.0
          @export var gameplay_sound_strength: float = 0.65
          @export var base_color: Color = Color(0.34, 0.20, 0.10, 1.0)

          @onready var door_mesh: MeshInstance3D = $DoorMesh

          var _phase: StringName = PHASE_CLOSED
          var _open_fraction: float = 0.0
          var _closed_rotation_y: float = 0.0
          var _highlighted: bool = false
          var _material: StandardMaterial3D = null
          var _world_session: Node = null


          func _ready() -> void:
          	add_to_group(&"vark_interactable")
          	_closed_rotation_y = rotation.y
          	_world_session = _find_world_session()
          	_material = StandardMaterial3D.new()
          	door_mesh.material_override = _material
          	_sync_derived_state()


          func _physics_process(delta: float) -> void:
          	if _phase != PHASE_OPENING and _phase != PHASE_CLOSING:
          		return

          	var duration: float = maxf(transition_seconds, 0.001)
          	var step: float = delta / duration
          	if _phase == PHASE_OPENING:
          		_open_fraction = minf(1.0, _open_fraction + step)
          		if is_equal_approx(_open_fraction, 1.0):
          			_open_fraction = 1.0
          			_phase = PHASE_OPEN
          			_sync_derived_state()
          			_queue_state_changed()
          			return
          	else:
          		_open_fraction = maxf(0.0, _open_fraction - step)
          		if is_zero_approx(_open_fraction):
          			_open_fraction = 0.0
          			_phase = PHASE_CLOSED
          			_sync_derived_state()
          			_queue_state_changed()
          			return

          	_sync_derived_state()


          func can_interact(_interactor: Node) -> bool:
          	return true


          func interact(_interactor: Node) -> void:
          	if _phase == PHASE_CLOSED or _phase == PHASE_CLOSING:
          		_phase = PHASE_OPENING
          	else:
          		_phase = PHASE_CLOSING
          	_queue_use_sound()


          func set_interaction_highlighted(highlighted: bool) -> void:
          	_highlighted = highlighted
          	_refresh_visual()


          func is_interaction_highlighted() -> bool:
          	return _highlighted


          func get_semantic_phase() -> StringName:
          	return _phase


          func get_open_fraction() -> float:
          	return _open_fraction


          func get_acoustic_openness() -> float:
          	# This is a door-side source-state seam only. Phase 3.6 still owns how
          	# openness affects propagated audibility through actual architecture.
          	return _open_fraction


          func is_navigation_passage_open() -> bool:
          	# The first guard/nav proof can consume this same seam without the door
          	# knowing anything about a particular NPC or navigation implementation.
          	return _phase == PHASE_OPEN


          func capture_semantic_state() -> Dictionary:
          	return {
          		"phase": _phase,
          		"open_fraction": _open_fraction,
          	}


          func apply_semantic_state(snapshot: Dictionary) -> bool:
          	if snapshot.size() != 2:
          		return false
          	if not snapshot.has("phase") or not snapshot.has("open_fraction"):
          		return false
          	if typeof(snapshot["phase"]) != TYPE_STRING_NAME:
          		return false
          	var phase: StringName = snapshot["phase"]
          	if not _is_valid_phase(phase):
          		return false
          	var fraction_value: Variant = snapshot["open_fraction"]
          	if typeof(fraction_value) != TYPE_FLOAT and typeof(fraction_value) != TYPE_INT:
          		return false
          	var fraction: float = float(fraction_value)
          	if not is_finite(fraction) or fraction < 0.0 or fraction > 1.0:
          		return false
          	if phase == PHASE_CLOSED and not is_zero_approx(fraction):
          		return false
          	if phase == PHASE_OPEN and not is_equal_approx(fraction, 1.0):
          		return false

          	_phase = phase
          	_open_fraction = fraction
          	_sync_derived_state()
          	return true


          func reconcile_after_restore() -> void:
          	# Transform, interaction presentation, and the consumer seams are derived
          	# from semantic phase/progress rather than serialized engine machinery.
          	_sync_derived_state()


          func _sync_derived_state() -> void:
          	rotation.y = (
          		_closed_rotation_y
          		+ deg_to_rad(open_angle_degrees) * _open_fraction
          	)
          	_refresh_visual()


          func _refresh_visual() -> void:
          	if _material == null:
          		return
          	_material.albedo_color = base_color
          	_material.emission_enabled = false
          	_material.disable_receive_shadows = _highlighted
          	_material.shading_mode = (
          		BaseMaterial3D.SHADING_MODE_UNSHADED
          		if _highlighted
          		else BaseMaterial3D.SHADING_MODE_PER_PIXEL
          	)


          func _queue_use_sound() -> void:
          	if _world_session == null:
          		return
          	var source_session_id: int = int(_world_session.get("session_id"))
          	_world_session.call(
          		"queue_gameplay_sound",
          		source_session_id,
          		USE_SOUND_KIND,
          		door_mesh.global_position,
          		gameplay_sound_strength
          	)


          func _queue_state_changed() -> void:
          	if _world_session == null:
          		return
          	var source_session_id: int = int(_world_session.get("session_id"))
          	_world_session.call(
          		"queue_semantic_gameplay_event",
          		source_session_id,
          		STATE_CHANGED_EVENT_NAME,
          		{
          			"door_id": door_id,
          			"state": _phase,
          		}
          	)


          func _find_world_session() -> Node:
          	var cursor: Node = get_parent()
          	while cursor != null:
          		if (
          			cursor.has_method("queue_gameplay_sound")
          			and cursor.has_method("queue_semantic_gameplay_event")
          		):
          			return cursor
          		cursor = cursor.get_parent()
          	return null


          func _is_valid_phase(phase: StringName) -> bool:
          	return (
          		phase == PHASE_CLOSED
          		or phase == PHASE_OPENING
          		or phase == PHASE_OPEN
          		or phase == PHASE_CLOSING
          	)
          '''.replace('          ', ''), encoding='utf-8')

          (doors / 'OrdinaryDoor.tscn').write_text(r'''[gd_scene load_steps=4 format=3]

          [ext_resource type="Script" path="res://gameplay/doors/ordinary_door.gd" id="1_door"]

          [sub_resource type="BoxMesh" id="DoorMesh"]
          size = Vector3(1.3, 2.1, 0.12)

          [sub_resource type="BoxShape3D" id="DoorShape"]
          size = Vector3(1.3, 2.1, 0.12)

          [node name="OrdinaryDoor" type="AnimatableBody3D"]
          script = ExtResource("1_door")

          [node name="DoorMesh" type="MeshInstance3D" parent="."]
          position = Vector3(0.65, 1.05, 0)
          mesh = SubResource("DoorMesh")

          [node name="CollisionShape3D" type="CollisionShape3D" parent="."]
          position = Vector3(0.65, 1.05, 0)
          shape = SubResource("DoorShape")
          '''.replace('          ', ''), encoding='utf-8')

          scenes = root / 'scenes'
          (scenes / 'DoorLab.tscn').write_text(r'''[gd_scene load_steps=13 format=3]

          [ext_resource type="PackedScene" path="res://player/Player.tscn" id="1_player"]
          [ext_resource type="PackedScene" path="res://gameplay/doors/OrdinaryDoor.tscn" id="2_door"]

          [sub_resource type="BoxShape3D" id="FloorShape"]
          size = Vector3(8, 0.2, 8)

          [sub_resource type="BoxMesh" id="FloorMesh"]
          size = Vector3(8, 0.2, 8)

          [sub_resource type="BoxShape3D" id="SideWallShape"]
          size = Vector3(3.25, 2.6, 0.3)

          [sub_resource type="BoxMesh" id="SideWallMesh"]
          size = Vector3(3.25, 2.6, 0.3)

          [sub_resource type="BoxShape3D" id="HeaderShape"]
          size = Vector3(1.5, 0.5, 0.3)

          [sub_resource type="BoxMesh" id="HeaderMesh"]
          size = Vector3(1.5, 0.5, 0.3)

          [sub_resource type="BoxShape3D" id="TargetShape"]
          size = Vector3(0.35, 0.35, 0.35)

          [sub_resource type="BoxMesh" id="TargetMesh"]
          size = Vector3(0.35, 0.35, 0.35)

          [sub_resource type="StandardMaterial3D" id="TargetMaterial"]
          albedo_color = Color(0.18, 0.82, 0.30, 1)

          [node name="DoorLab" type="Node3D"]

          [node name="DirectionalLight3D" type="DirectionalLight3D" parent="."]
          rotation_degrees = Vector3(-55, -30, 0)
          shadow_enabled = true

          [node name="Player" parent="." instance=ExtResource("1_player")]
          position = Vector3(0, 0, 2.2)

          [node name="Floor" type="StaticBody3D" parent="."]
          position = Vector3(0, -0.1, 0)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="Floor"]
          shape = SubResource("FloorShape")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="Floor"]
          mesh = SubResource("FloorMesh")

          [node name="LeftWall" type="StaticBody3D" parent="."]
          position = Vector3(-2.375, 1.3, 0)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="LeftWall"]
          shape = SubResource("SideWallShape")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="LeftWall"]
          mesh = SubResource("SideWallMesh")

          [node name="RightWall" type="StaticBody3D" parent="."]
          position = Vector3(2.375, 1.3, 0)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="RightWall"]
          shape = SubResource("SideWallShape")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="RightWall"]
          mesh = SubResource("SideWallMesh")

          [node name="Header" type="StaticBody3D" parent="."]
          position = Vector3(0, 2.35, 0)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="Header"]
          shape = SubResource("HeaderShape")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="Header"]
          mesh = SubResource("HeaderMesh")

          [node name="OrdinaryDoor" parent="." instance=ExtResource("2_door")]
          position = Vector3(-0.65, 0, 0)
          door_id = &"door.lab"

          [node name="VisionTarget" type="StaticBody3D" parent="."]
          position = Vector3(0, 1.1, -2)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="VisionTarget"]
          shape = SubResource("TargetShape")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="VisionTarget"]
          mesh = SubResource("TargetMesh")
          material_override = SubResource("TargetMaterial")

          [node name="Instructions" type="Label3D" parent="."]
          position = Vector3(0, 2.9, 1.0)
          text = "3.4 DOOR LAB\nF = toggle ordinary door\nClosed = blocks doorway/green marker · Open = passage clear"
          billboard = 1
          font_size = 28
          '''.replace('          ', ''), encoding='utf-8')

          tests = root / 'tests' / 'application'
          (tests / 'door_regressions.gd').write_text(r'''extends RefCounted


          const ApplicationScene = preload("res://application/Application.tscn")
          const ApplicationRoot = preload("res://application/application_root.gd")
          const OrdinaryDoor = preload("res://gameplay/doors/ordinary_door.gd")


          func run(tree: SceneTree, assert_true: Callable) -> void:
          	_release_interact()
          	var application: Node = ApplicationScene.instantiate()
          	var default_labels: PackedStringArray = application.get("development_launch_labels")
          	var default_paths: PackedStringArray = application.get("development_launch_resource_paths")
          	assert_true.call(
          		default_labels.has("Door Lab")
          		and default_paths.has("res://scenes/DoorLab.tscn"),
          		"Application Development Launch exposes the 3.4 Door Lab"
          	)

          	application.set("development_launch_labels", PackedStringArray(["Door Lab"]))
          	application.set(
          		"development_launch_resource_paths",
          		PackedStringArray(["res://scenes/DoorLab.tscn"])
          	)
          	tree.get_root().add_child(application)
          	await tree.process_frame

          	var launched: bool = bool(application.call("launch_development_target", 0))
          	await tree.process_frame
          	await _settle_player_physics(tree, 2)
          	var world: Node3D = application.get("current_world") as Node3D
          	var player: Node3D = application.get("current_player") as Node3D
          	var session: Node = application.get("current_session") as Node
          	assert_true.call(
          		launched
          		and world != null
          		and world.name == &"DoorLab"
          		and player != null
          		and session != null
          		and int(application.call("get_control_mode")) == ApplicationRoot.ControlMode.GAMEPLAY,
          		"Door Lab launches through the production application/session/input path"
          	)
          	if world == null or player == null or session == null:
          		_release_interact()
          		application.queue_free()
          		await tree.process_frame
          		return

          	var door: AnimatableBody3D = world.get_node("OrdinaryDoor") as AnimatableBody3D
          	var vision_target: StaticBody3D = world.get_node("VisionTarget") as StaticBody3D
          	var door_mesh: MeshInstance3D = door.get_node("DoorMesh") as MeshInstance3D
          	var door_material: StandardMaterial3D = door_mesh.material_override as StandardMaterial3D

          	var door_events: Array[StringName] = []
          	var sound_events: Array[Dictionary] = []
          	var door_handler: Callable = func(event: Dictionary) -> bool:
          		var payload: Dictionary = event.get("payload", {})
          		door_events.append(payload.get("state", &""))
          		return true
          	var sound_handler: Callable = func(event: Dictionary) -> bool:
          		sound_events.append(event)
          		return true
          	assert_true.call(
          		bool(session.call(
          			"register_semantic_event_handler",
          			OrdinaryDoor.STATE_CHANGED_EVENT_NAME,
          			door_handler
          		))
          		and bool(session.call(
          			"register_semantic_event_handler",
          			&"gameplay.sound",
          			sound_handler
          		)),
          		"Ordinary door registers consumers through the accepted semantic event route"
          	)

          	var initial_state: Dictionary = door.call("capture_semantic_state")
          	var centered_state: Dictionary = player.call("get_interaction_semantic_state")
          	assert_true.call(
          		initial_state == {
          			"phase": OrdinaryDoor.PHASE_CLOSED,
          			"open_fraction": 0.0,
          		}
          		and not bool(door.call("is_navigation_passage_open"))
          		and is_zero_approx(float(door.call("get_acoustic_openness"))),
          		"Ordinary door begins as one authoritative CLOSED semantic state with closed nav/acoustic seams"
          	)
          	assert_true.call(
          		bool(door.call("is_interaction_highlighted"))
          		and bool(centered_state.get("has_target", false))
          		and centered_state.get("target_name", "") == "OrdinaryDoor"
          		and door_material != null
          		and door_material.shading_mode == BaseMaterial3D.SHADING_MODE_UNSHADED
          		and door_material.disable_receive_shadows
          		and door_mesh.cast_shadow == GeometryInstance3D.SHADOW_CASTING_SETTING_ON,
          		"Real ordinary door consumes the accepted center-view interaction and Thief-style selection contract"
          	)
          	assert_true.call(
          		_first_ray_collider(world, Vector3(0, 1.1, 1.5), Vector3(0, 1.1, -2.2)) == door
          		and _door_overlaps_passage_probe(world, door),
          		"Closed ordinary door is the physical and vision obstruction across its doorway"
          	)

          	Input.action_press("interact")
          	await _settle_player_physics(tree)
          	Input.action_release("interact")
          	await _settle_player_physics(tree, 3)
          	assert_true.call(
          		door.call("get_semantic_phase") == OrdinaryDoor.PHASE_OPENING
          		and sound_events.size() == 1
          		and door_events.is_empty(),
          		"Fresh F interaction starts the real door transition and emits gameplay sound without prematurely publishing OPEN"
          	)
          	var first_sound_payload: Dictionary = {}
          	if sound_events.size() == 1:
          		first_sound_payload = sound_events[0].get("payload", {})
          	assert_true.call(
          		first_sound_payload.get("kind", &"") == OrdinaryDoor.USE_SOUND_KIND
          		and first_sound_payload.get("origin", Vector3.ZERO) is Vector3
          		and is_equal_approx(
          			float(first_sound_payload.get("strength", 0.0)),
          			float(door.get("gameplay_sound_strength"))
          		)
          		and not first_sound_payload.has("audio_stream")
          		and not first_sound_payload.has("volume_db"),
          		"Door use emits only the 3.3 semantic gameplay-sound source fact, not presentation audio"
          	)

          	var mid_state: Dictionary = door.call("capture_semantic_state")
          	assert_true.call(
          		mid_state.get("phase", &"") == OrdinaryDoor.PHASE_OPENING
          		and float(mid_state.get("open_fraction", 0.0)) > 0.0
          		and float(mid_state.get("open_fraction", 1.0)) < 1.0,
          		"Door semantic capture preserves explicit in-progress opening state instead of a timer/coroutine"
          	)

          	await _settle_player_physics(tree, 45)
          	assert_true.call(
          		door.call("get_semantic_phase") == OrdinaryDoor.PHASE_OPEN
          		and is_equal_approx(float(door.call("get_open_fraction")), 1.0)
          		and bool(door.call("is_navigation_passage_open"))
          		and is_equal_approx(float(door.call("get_acoustic_openness")), 1.0)
          		and door_events == [OrdinaryDoor.PHASE_OPEN],
          		"Completed opening publishes OPEN once and exposes the same open state through nav/acoustic door seams"
          	)
          	assert_true.call(
          		_first_ray_collider(world, Vector3(0, 1.1, 1.5), Vector3(0, 1.1, -2.2)) == vision_target
          		and not _door_overlaps_passage_probe(world, door),
          		"Open ordinary door clears the same doorway for physical passage and straight-through vision"
          	)

          	var open_state: Dictionary = door.call("capture_semantic_state")
          	var event_count_before_apply: int = door_events.size()
          	var sound_count_before_apply: int = sound_events.size()
          	assert_true.call(
          		bool(door.call("apply_semantic_state", mid_state))
          		and door.call("get_semantic_phase") == OrdinaryDoor.PHASE_OPENING
          		and is_equal_approx(
          			float(door.call("get_open_fraction")),
          			float(mid_state.get("open_fraction", -1.0))
          		)
          		and door_events.size() == event_count_before_apply
          		and sound_events.size() == sound_count_before_apply,
          		"Applying captured door progress restores semantic/derived state without replaying interaction consequences"
          	)
          	assert_true.call(
          		not bool(door.call("apply_semantic_state", {
          			"phase": OrdinaryDoor.PHASE_OPEN,
          			"open_fraction": 0.5,
          		})),
          		"Ordinary door rejects internally inconsistent semantic restore state"
          	)
          	assert_true.call(
          		bool(door.call("apply_semantic_state", open_state))
          		and door.call("get_semantic_phase") == OrdinaryDoor.PHASE_OPEN
          		and bool(door.call("is_navigation_passage_open")),
          		"Applying a captured OPEN state restores the door-side consumer seams from semantic truth"
          	)
          	await _settle_player_physics(tree, 2)

          	door.call("interact", player)
          	await _settle_player_physics(tree, 3)
          	assert_true.call(
          		door.call("get_semantic_phase") == OrdinaryDoor.PHASE_CLOSING
          		and sound_events.size() == 2,
          		"The same ordinary interaction contract reverses an open door into a closing transition"
          	)
          	await _settle_player_physics(tree, 45)
          	assert_true.call(
          		door.call("get_semantic_phase") == OrdinaryDoor.PHASE_CLOSED
          		and is_zero_approx(float(door.call("get_open_fraction")))
          		and not bool(door.call("is_navigation_passage_open"))
          		and is_zero_approx(float(door.call("get_acoustic_openness")))
          		and door_events == [OrdinaryDoor.PHASE_OPEN, OrdinaryDoor.PHASE_CLOSED],
          		"Completed closing republishes CLOSED and returns both door-side consumer seams to closed state"
          	)
          	assert_true.call(
          		_first_ray_collider(world, Vector3(0, 1.1, 1.5), Vector3(0, 1.1, -2.2)) == door
          		and _door_overlaps_passage_probe(world, door),
          		"Closing restores the ordinary door's physical and vision obstruction"
          	)

          	_release_interact()
          	application.call("exit_current_world")
          	application.queue_free()
          	await tree.process_frame


          func _first_ray_collider(world: Node3D, from: Vector3, to: Vector3) -> Object:
          	var query := PhysicsRayQueryParameters3D.create(from, to)
          	query.collision_mask = 1
          	var hit: Dictionary = world.get_world_3d().direct_space_state.intersect_ray(query)
          	return hit.get("collider", null) as Object


          func _door_overlaps_passage_probe(world: Node3D, door: CollisionObject3D) -> bool:
          	var shape := BoxShape3D.new()
          	shape.size = Vector3(0.5, 1.8, 0.35)
          	var query := PhysicsShapeQueryParameters3D.new()
          	query.shape = shape
          	query.transform = Transform3D(Basis.IDENTITY, Vector3(0, 1.0, 0))
          	query.collision_mask = 1
          	for result: Dictionary in world.get_world_3d().direct_space_state.intersect_shape(query, 32):
          		if result.get("collider", null) == door:
          			return true
          	return false


          func _settle_player_physics(tree: SceneTree, frame_count: int = 1) -> void:
          	for _frame_index: int in frame_count:
          		await tree.physics_frame
          		await tree.process_frame


          func _release_interact() -> void:
          	Input.action_release("interact")
          '''.replace('          ', ''), encoding='utf-8')

          app_path = root / 'application' / 'Application.tscn'
          app = app_path.read_text(encoding='utf-8')
          old_labels = 'development_launch_labels = PackedStringArray("VarkTest", "Playground", "Interaction Lab")'
          new_labels = 'development_launch_labels = PackedStringArray("VarkTest", "Playground", "Interaction Lab", "Door Lab")'
          old_paths = 'development_launch_resource_paths = PackedStringArray("res://scenes/VarkTest.tscn", "res://missions/playground/mission.tres", "res://scenes/InteractionLab.tscn")'
          new_paths = 'development_launch_resource_paths = PackedStringArray("res://scenes/VarkTest.tscn", "res://missions/playground/mission.tres", "res://scenes/InteractionLab.tscn", "res://scenes/DoorLab.tscn")'
          if old_labels not in app or old_paths not in app:
              raise SystemExit('Application.tscn development target anchors changed')
          app = app.replace(old_labels, new_labels, 1).replace(old_paths, new_paths, 1)
          app_path.write_text(app, encoding='utf-8')

          runner_path = tests / 'run_application_tests.gd'
          runner = runner_path.read_text(encoding='utf-8')
          const_anchor = '''const SemanticEventRegressions = preload(
          \t"res://tests/application/semantic_event_regressions.gd"
          )
          '''.replace('          ', '')
          const_insert = const_anchor + '''const DoorRegressions = preload(
          \t"res://tests/application/door_regressions.gd"
          )
          '''.replace('          ', '')
          if const_anchor not in runner or 'const DoorRegressions' in runner:
              raise SystemExit('application test runner const anchor changed')
          runner = runner.replace(const_anchor, const_insert, 1)
          run_anchor = '''\tvar semantic_event_regressions: RefCounted = SemanticEventRegressions.new()
          \tawait semantic_event_regressions.run(
          \t\tself,
          \t\tCallable(self, "_assert_true")
          \t)
          '''.replace('          ', '')
          run_insert = run_anchor + '''
          \tvar door_regressions: RefCounted = DoorRegressions.new()
          \tawait door_regressions.run(
          \t\tself,
          \t\tCallable(self, "_assert_true")
          \t)
          '''.replace('          ', '')
          if run_anchor not in runner or 'var door_regressions:' in runner:
              raise SystemExit('application test runner execution anchor changed')
          runner = runner.replace(run_anchor, run_insert, 1)
          runner_path.write_text(runner, encoding='utf-8')

          plan_path = root / 'docs' / 'DEVELOPMENT_PLAN.md'
          plan = plan_path.read_text(encoding='utf-8')
          start = plan.index('## 3.4 Ordinary door micro-proof `[ ]`')
          end = plan.index('## 3.5 Thief-style prop micro-proof `[ ]`', start)
          new_block = r'''## 3.4 Ordinary door micro-proof `[~]`

          Prove interaction, collision/obstruction, open/closed presentation, vision-blocking relationship, acoustic integration seam, NPC/navigation integration seam, semantic events, and semantic state capture/apply.

          At this step, prove the **door-side contracts/seams** needed by later acoustics and NPC/navigation use. Do not pull the primitive guard/navigation implementation from 3.7 into 3.4 merely to exercise that future consumer. The first real guard/nav proof in 3.7 must exercise this same ordinary door seam; if that integration exposes a defect, correct the seam rather than inventing a second door/nav model.

          Do not build keys/locks/barred behavior yet unless required by the proof.

          The first ordinary door is a reusable `AnimatableBody3D` hinge leaf rather than the 3.1 door-like probe. It consumes the same `vark_interactable` surface and Thief-style selection presentation, owns explicit `closed/opening/open/closing` semantic phase plus `open_fraction`, and advances its physical hinge transform from gameplay physics rather than a tween/coroutine as durable truth. A completed transition emits `door.state_changed`; each accepted use emits the 3.3 `gameplay.sound` source fact with kind `door.use`. The physical leaf collider is also the closed-door vision obstruction, so opening clears the actual doorway rather than toggling a separate invisible blocker.

          Two deliberately narrow consumer seams are exposed for later proofs: `get_acoustic_openness()` reports only the door-side 0..1 opening state for 3.6 to interpret through whatever propagation model proves correct, and `is_navigation_passage_open()` reports whether the leaf is fully open for the first 3.7 guard/nav consumer. The door does not implement propagation, hearing, a nav framework, or guard logic. `capture_semantic_state()` / `apply_semantic_state()` preserve phase plus progress and rebuild the derived hinge pose without replaying sound or state-change consequences.

          A development-only `Door Lab` launches through the normal application/session/input path with a framed doorway and a visible target behind it so closed/open collision and straight-through vision behavior are legible. The accepted 3.1 Interaction Lab remains unchanged as the narrow selector/highlight fixture.

          **Done when:** one real ordinary door uses the accepted center-view/F interaction contract and selection feedback; interaction visibly animates one physical collision leaf between explicit closed/open states; the closed leaf blocks the doorway and straight-through vision while the fully open leaf clears both; accepted use emits one semantic `door.use` gameplay sound and completed transitions emit one semantic door-state event through the current world session; acoustic openness and navigation-passage state are exposed only as door-side source-state seams; semantic capture/apply preserves stable and in-progress state without serializing/replaying runtime continuation machinery; and no keys/locks/barred behavior, acoustic propagation, hearing consumer, guard AI, or general navigation framework is introduced.

          **Automated:** pending post-push CI — the new focused Application regression launches `Door Lab` through the real application/session/player path and deterministically covers accepted interaction/highlight reuse, closed/open physical-overlap and vision-ray behavior, animated phase/progress, one semantic `door.use` source fact per accepted use, completed `door.state_changed` events, acoustic/navigation door-side seams, in-progress semantic capture/apply with invalid-state rejection, no consequence replay during apply, and closing restoration. It is wired into the authoritative Application suite and all-tests barrier.

          **Manual:** required — validator: **Windows x64 user/playtester**. F5 → Development Launch → Door Lab; confirm the closed door selects with the accepted fullbright/no-received-shadow surface while retaining its ordinary cast shadow; one **F** press makes the physical leaf visibly swing open rather than snap, revealing the green marker and allowing the player through the doorway; aim at the open leaf and press **F** to visibly close it, after which the doorway is physically blocked and the green marker is occluded again; confirm there is no obvious ghost collision or locomotion/mouse-look regression. No audible door clip is expected in 3.4—the required sound proof here is the semantic gameplay-sound fact, not presentation audio.

          '''.replace('          ', '')
          plan = plan[:start] + new_block + plan[end:]
          baseline_anchor = '- a minimal `WorldSession`-owned semantic gameplay-event route with FIFO consequence draining, nested append semantics, lifecycle/session rejection, detached payloads, cascade diagnostics, and an explicit stable gameplay-boundary serial\n'
          baseline_insert = baseline_anchor + '- a minimal semantic `gameplay.sound` source fact separated from presentation audio\n- a first reusable ordinary-door micro-proof with physical hinge collision/vision behavior, semantic door events/state capture, and narrow acoustic/navigation seams\n'
          if baseline_anchor in plan and 'first reusable ordinary-door micro-proof' not in plan:
              plan = plan.replace(baseline_anchor, baseline_insert, 1)
          plan_path.write_text(plan, encoding='utf-8')

          testing_path = root / 'docs' / 'TESTING.md'
          testing = testing_path.read_text(encoding='utf-8')
          movement_marker = '\n\nThe movement runner currently:'
          addition = (' Phase 3.4 adds a dedicated real `Door Lab` regression through that same production application/session/player path: '
                      'the ordinary door reuses center-view/F selection, its one physical leaf is both collision and closed-door vision obstruction, '
                      'opening/closing advances explicit semantic phase/progress, accepted use emits the reserved `door.use` gameplay-sound source fact, '
                      'completed transitions emit `door.state_changed`, narrow acoustic-openness/navigation-passage seams follow the same door state, and semantic capture/apply restores stable/in-progress state without replaying consequences.')
          if movement_marker not in testing or 'Phase 3.4 adds a dedicated real `Door Lab` regression' in testing:
              raise SystemExit('TESTING.md application coverage anchor changed')
          testing = testing.replace(movement_marker, addition + movement_marker, 1)
          testing_path.write_text(testing, encoding='utf-8')
          PY
