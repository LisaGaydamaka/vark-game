name: Apply 3.1 runtime

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply 3.1 runtime patch carrier'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0
      - name: Apply bounded runtime test and docs patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          carrier = Path('.github/workflows/implement_3_1.yml').read_text()
          marker_start = "          python3 <<'PY'\n"
          marker_end = "\n          PY\n"
          start = carrier.index(marker_start) + len(marker_start)
          end = carrier.index(marker_end, start)
          source_lines = carrier[start:end].splitlines()
          source_lines = [line[10:] if line.startswith('          ') else line for line in source_lines]

          changed = 0
          for index, line in enumerate(source_lines[:-1]):
              if (
                  line.strip() == '"docs/TESTING.md",'
                  and 'gameplay-intent one-tick edge lifetime' in source_lines[index + 1]
              ):
                  source_lines[index] = line.replace('docs/TESTING.md', 'docs/DEVELOPMENT_PLAN.md')
                  changed += 1
          if changed != 1:
              raise SystemExit(f'expected one requirements-doc target correction, changed {changed}')

          source = '\n'.join(source_lines) + '\n'
          exec(compile(source, 'implement_3_1_carrier.py', 'exec'), {})

          generated = [
              'player/interaction/player_interaction.gd',
              'scenes/interaction_probe.gd',
              'scenes/InteractionLab.tscn',
              'tests/application/interaction_regressions.gd',
          ]
          for generated_path in generated:
              path = Path(generated_path)
              lines = path.read_text().splitlines()
              if not lines:
                  continue
              normalized = [lines[0]]
              normalized.extend(
                  line[10:] if line.startswith('          ') else line
                  for line in lines[1:]
              )
              path.write_text('\n'.join(normalized) + '\n')
          PY

          git diff --check
          git add \
            project.godot \
            application/Application.tscn \
            application/application_input_boundary.gd \
            player/player.gd \
            player/interaction/player_interaction.gd \
            scenes/interaction_probe.gd \
            scenes/InteractionLab.tscn \
            tests/application/input_boundary_regressions.gd \
            tests/application/interaction_regressions.gd \
            tests/application/run_application_tests.gd \
            docs/DEVELOPMENT_PLAN.md \
            docs/TESTING.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement 3.1 minimal interaction contract"
          git push origin HEAD:test
