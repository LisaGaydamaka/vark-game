name: Reconcile 2.9

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
      - name: Reconcile accepted 2.9 docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          plan_path = Path("docs/DEVELOPMENT_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          plan = replace_once(
              plan,
              "## 2.9 Basic content validation `[~]`",
              "## 2.9 Basic content validation `[x]`",
              "2.9 status",
          )
          plan = replace_once(
              plan,
              "**Automated:** coverage is wired into the focused authoring suite and authoritative all-tests/CI barrier: it exercises the real Playground valid path, empty static selector rejection, missing and wrong-role player-start references, a disposable real-Playground map with the exit role removed, and zero/two-player world fixtures, while the existing identity/content-duplicate regressions and 2.8 reimport-to-`PLAYING` proof remain active. Exact-head post-push CI is still required for acceptance.",
              "**Automated:** passed — the focused authoring suite and authoritative all-tests/CI barrier exercise the real Playground valid path, empty static selector rejection, missing and wrong-role player-start references, a disposable real-Playground map with the exit role removed, and zero/two-player world fixtures while retaining the identity/content-duplicate regressions and 2.8 reimport-to-`PLAYING` proof. Exact implementation head `82fd934c9239cafbb5dac23deef3b5be79fc2ed8` passed Godot 4.7.2 `Regression suite` run #54 with `ALL AUTHORING TESTS PASSED`, `ALL APPLICATION TESTS PASSED`, `ALL MOVEMENT TESTS PASSED`, and `ALL TEST SUITES PASSED`.",
              "2.9 automated evidence",
          )
          plan = replace_once(
              plan,
              "1. Complete 2.9 basic-content-validation acceptance on the exact uploaded head, then begin Phase 3.",
              "1. Begin Phase 3 with 3.1 minimal interaction contract; continue the event/sound contracts only in their ordered roadmap items.",
              "immediate sequence",
          )
          plan_path.write_text(plan, encoding="utf-8")

          testing_path = Path("docs/TESTING.md")
          testing = testing_path.read_text(encoding="utf-8")
          testing = replace_once(
              testing,
              "Phase 2.8 additionally derives a disposable real-Playground copy, moves only the player start, proves dry identity repair is a byte-for-byte no-op, proves all tracked persistent/content IDs remain stable, proves only the intended point transform changes, rebuilds through the real `WorldSession`, and enters `PLAYING`. Useful missing/duplicate persistent-ID diagnostics, optional blank semantic IDs, duplicate non-empty semantic-ID diagnostics, the `WorldSession` fail-closed boundary, and current-session registry lookup/missing/lifetime behavior across teardown and replacement remain covered. Temporary authoring fixtures never mutate the tracked Playground map.",
              "Phase 2.8 additionally derives a disposable real-Playground copy, moves only the player start, proves dry identity repair is a byte-for-byte no-op, proves all tracked persistent/content IDs remain stable, proves only the intended point transform changes, rebuilds through the real `WorldSession`, and enters `PLAYING`. Phase 2.9 adds pre-`READY` mission-content coverage: direct session callers cannot bypass `MissionDefinition` load validation, the current player-start selector must resolve through the registry to an authored `vark_player_start`, at least one authored persistent `vark_exit` must exist, and zero or multiple `vark_player` nodes fail cleanly. Useful missing/duplicate persistent-ID diagnostics, optional blank semantic IDs, duplicate non-empty semantic-ID diagnostics, the `WorldSession` fail-closed boundary, and current-session registry lookup/missing/lifetime behavior across teardown and replacement remain covered. Temporary authoring fixtures never mutate the tracked Playground map.",
              "authoring suite coverage",
          )
          testing = replace_once(
              testing,
              "Phase 2.6 consumes those already-validated IDs for current-session lookup, while missing authored-reference resolution remains future content validation once real references exist.",
              "Phase 2.6 consumes those already-validated IDs for current-session lookup. Phase 2.9 now validates the first real authored semantic reference by requiring `MissionDefinition.player_start_selector` to resolve through that registry to an authored player-start role before `READY`.",
              "semantic reference coverage",
          )
          testing = replace_once(
              testing,
              "The `.map` remains the single spatial source of truth. Phase 2.8 now proves representative edit/save/rebuild/run stability; missing authored-reference checks remain Phase 2.9.",
              "The `.map` remains the single spatial source of truth. Phase 2.8 proves representative edit/save/rebuild/run stability, and Phase 2.9 now enforces the current authored player-start reference plus required mission-exit/player objects before `READY`.",
              "mission package coverage",
          )
          testing = replace_once(
              testing,
              "Before `READY`, the session registry build rejects missing/duplicate persistent IDs and duplicate non-empty semantic `content_id` values on explicitly identity-bearing authored runtime nodes, leaving no partial registry and tearing the invalid world down. A valid build owns the current-world registry for its lifetime.",
              "Before `READY`, the session registry build rejects missing/duplicate persistent IDs and duplicate non-empty semantic `content_id` values on explicitly identity-bearing authored runtime nodes, leaving no partial registry and tearing the invalid world down. Typed mission sessions then validate current mission content: required definition metadata is rechecked, `player_start_selector` must resolve to an authored player-start role, at least one persistent mission exit must exist, and the runtime world must expose exactly one `vark_player`. A valid build owns the current-world registry for its lifetime.",
              "world-session lifecycle coverage",
          )
          testing = replace_once(
              testing,
              "Phase 2.7 adds the mapper/runtime vocabulary for player start, generic marker, and exit and directly declares both identity fields in each point's own FGD block so TrenchBroom treats the on-disk point keys as real entity properties; the tracked Playground proves those points build, register, and resolve the semantic player-start selector. Missing semantic-reference checks require actual references and therefore remain 2.9. Phase 2.8 now adds an automated representative player-start edit on a disposable real-Playground copy, read-only no-repair verification, real wrapper rebuild to `PLAYING`, stable persistent/content IDs, and an intended-only transform change.",
              "Phase 2.7 adds the mapper/runtime vocabulary for player start, generic marker, and exit and directly declares both identity fields in each point's own FGD block so TrenchBroom treats the on-disk point keys as real entity properties; the tracked Playground proves those points build and register. Phase 2.8 adds an automated representative player-start edit on a disposable real-Playground copy, read-only no-repair verification, real wrapper rebuild to `PLAYING`, stable persistent/content IDs, and an intended-only transform change. Phase 2.9 closes the first real authored-reference/required-object boundary by validating the player-start selector through the current registry, requiring an authored persistent exit, rechecking typed mission metadata, and failing cleanly on zero or multiple runtime players before `READY`.",
              "persistent fixture 2.9 coverage",
          )
          testing = replace_once(
              testing,
              "The deliberate missing/duplicate persistent-identity and duplicate-content-ID fixtures emit expected error diagnostics while asserting that the session fails closed; those messages are test evidence, not unexpected project-load failures.",
              "The deliberate missing/duplicate persistent-identity, duplicate-content-ID, invalid mission-content/reference, and zero/multiple-player fixtures emit expected error diagnostics while asserting that the session fails closed; those messages are test evidence, not unexpected project-load failures.",
              "CI expected diagnostics",
          )
          testing_path.write_text(testing, encoding="utf-8")
          PY
          git diff --check
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPMENT_PLAN.md docs/TESTING.md
          git diff --cached --quiet && exit 1
          git commit -m "Reconcile 2.9 roadmap status"
          git push origin HEAD:test
