name: Reconcile 3.1 selected-surface shadow docs

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Refine 3.1 selected surface shadows'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0
      - name: Patch interaction selection documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/GAME_VISION.md',
              'Interactable objects use a Thief 1 & 2-style shadowless/fullbright selection highlight: while targeted they keep their authored color but render without scene-light shadowing and do not cast a shadow; normal shaded/shadow-casting presentation returns immediately when selection is lost.',
              'Interactable objects use a Thief 1 & 2-style fullbright selection highlight: while targeted they keep their authored color and ordinary cast shadow, but the object\'s own visible surface is unshaded and receives no scene shadowing; normal shaded surface response returns immediately when selection is lost.'
          )

          replace_once(
              'docs/DEVELOPMENT_PLAN.md',
              '- a minimal player-owned interaction selector with application-owned primary-interaction intent, center-view range/occlusion/state eligibility, central ordinary-interaction availability, and Thief-style shadowless/fullbright target-selection feedback',
              '- a minimal player-owned interaction selector with application-owned primary-interaction intent, center-view range/occlusion/state eligibility, central ordinary-interaction availability, and Thief-style fullbright/no-received-shadow target-selection feedback that preserves ordinary cast shadows'
          )
          replace_once(
              'docs/DEVELOPMENT_PLAN.md',
              'Introduce only enough common behavior for center-view target selection, range/occlusion/state eligibility, one primary interaction command, and the locked Thief-style shadowless/fullbright selection feedback.',
              'Introduce only enough common behavior for center-view target selection, range/occlusion/state eligibility, one primary interaction command, and the locked Thief-style fullbright/no-received-shadow selection feedback while preserving ordinary cast shadows.'
          )
          replace_once(
              'docs/DEVELOPMENT_PLAN.md',
              'A separate `world_interaction_available` gate gives later held-prop/body ownership one central place to suppress ordinary interaction without checks copied into every interactable. The default keyboard mapping for the primary interaction action is **F**. Selection feedback does not tint or emissively recolor the target: the target keeps its base color, renders unshaded/fullbright, and stops casting shadows until selection clears, at which point ordinary shaded/shadow-casting presentation is restored.',
              'A separate `world_interaction_available` gate gives later held-prop/body ownership one central place to suppress ordinary interaction without checks copied into every interactable. The default keyboard mapping for the primary interaction action is **F**. Selection feedback does not tint or emissively recolor the target: the target keeps its base color and ordinary cast-shadow behavior, while its own visible surface renders unshaded/fullbright and receives no scene shadows until selection clears, at which point ordinary shaded surface response is restored.'
          )
          replace_once(
              'docs/DEVELOPMENT_PLAN.md',
              'Thief-style shadowless/fullbright selection follows the eligible current target, clears on loss, and restores ordinary shadowed rendering;',
              'Thief-style fullbright/no-received-shadow selection follows the eligible current target while preserving ordinary cast-shadow behavior, clears on loss, and restores ordinary shaded surface response;'
          )
          replace_once(
              'docs/DEVELOPMENT_PLAN.md',
              'It exercises the real application/session/player path in `Interaction Lab`, the **F** input mapping, center targeting, out-of-range rejection, first-hit occlusion, state eligibility, shadowless/fullbright selection plus normal-shadow restoration, fresh-edge/no-hold-repeat behavior, central availability suppression/resume, and application-domain stale-edge suppression while retaining all existing application/input/movement coverage.',
              'It exercises the real application/session/player path in `Interaction Lab`, the **F** input mapping, center targeting, out-of-range rejection, first-hit occlusion, state eligibility, fullbright/no-received-shadow selected surfaces with preserved cast shadows plus normal shaded-surface restoration, fresh-edge/no-hold-repeat behavior, central availability suppression/resume, and application-domain stale-edge suppression while retaining all existing application/input/movement coverage.'
          )
          replace_once(
              'docs/DEVELOPMENT_PLAN.md',
              'In F5 → Development Launch → Interaction Lab, confirm there is no permanent central crosshair; the Door Contract Probe becomes visibly shadowless/fullbright without a color tint only while centered, in range, and unobstructed, then restores normal shading/shadow casting when looking away/backing off; the Prop Contract Probe cannot select through the divider but uses the same shadowless/fullbright feedback after moving around it; pressing **F** changes only the selected probe once per press and holding F does not repeat; the prop probe becomes `INACTIVE` and loses the shadowless selection state after its one accepted use; and ordinary walk/jump/crouch/sprint/mouse-look still feel like the accepted controller.',
              'In F5 → Development Launch → Interaction Lab, confirm there is no permanent central crosshair; the Door Contract Probe keeps casting its normal world shadow but its own visible surface becomes fully unshaded/fullbright with no received/self-shadow-style darkening and no color tint only while centered, in range, and unobstructed, then restores normal surface shading when looking away/backing off; the Prop Contract Probe cannot select through the divider but uses the same fullbright/no-received-shadow surface feedback after moving around it; pressing **F** changes only the selected probe once per press and holding F does not repeat; the prop probe becomes `INACTIVE` and loses the selected-surface state after its one accepted use; and ordinary walk/jump/crouch/sprint/mouse-look still feel like the accepted controller.'
          )

          replace_once(
              'docs/TESTING.md',
              'The interaction regression launches the real `Interaction Lab` through the production application/session/player path and proves the **F** primary-interaction mapping, center-view first-hit targeting, range and occlusion rejection, target-state eligibility, Thief-style shadowless/fullbright selection with base-color preservation and ordinary-shadow restoration, one fresh primary-interaction edge with no held repeat, central ordinary-interaction suppression/resume, and stale-edge suppression across gameplay-domain loss.',
              'The interaction regression launches the real `Interaction Lab` through the production application/session/player path and proves the **F** primary-interaction mapping, center-view first-hit targeting, range and occlusion rejection, target-state eligibility, Thief-style fullbright/no-received-shadow selected surfaces with base-color and ordinary cast-shadow preservation plus normal shaded-surface restoration, one fresh primary-interaction edge with no held repeat, central ordinary-interaction suppression/resume, and stale-edge suppression across gameplay-domain loss.'
          )
          PY
          git diff --check
          git diff -- docs/GAME_VISION.md docs/DEVELOPMENT_PLAN.md docs/TESTING.md
      - name: Commit documentation synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GAME_VISION.md docs/DEVELOPMENT_PLAN.md docs/TESTING.md
          git commit -m "Sync 3.1 selected-surface shadow docs"
          git push origin HEAD:test