name: Implement 3.1

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'Prepare 3.1 interaction implementation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0
      - name: Apply bounded 3.1 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          Path("player/interaction").mkdir(parents=True, exist_ok=True)
          Path("player/interaction/player_interaction.gd").write_text(r'''class_name PlayerInteraction
          extends RefCounted


          const INTERACTABLE_GROUP: StringName = &"vark_interactable"


          var player: CollisionObject3D
          var camera: Camera3D
          var max_range: float
          var input_enabled: bool = true
          var world_interaction_available: bool = true
          var current_target: Node = null


          func _init(
          	interactor: CollisionObject3D,
          	view_camera: Camera3D,
          	interaction_range: float
          ) -> void:
          	player = interactor
          	camera = view_camera
          	max_range = maxf(interaction_range, 0.0)


          func update(interact_pressed: bool) -> void:
          	if not is_available():
          		_set_target(null)
          		return

          	_set_target(_select_target())
          	if not interact_pressed or current_target == null:
          		return

          	current_target.call("interact", player)
          	# Interaction is allowed to change the target's own eligibility. Refresh
          	# immediately so one-shot interactions do not leave stale highlight.
          	_set_target(_select_target())


          func set_input_enabled(enabled: bool) -> void:
          	input_enabled = enabled
          	if not input_enabled:
          		_set_target(null)


          func set_world_interaction_available(available: bool) -> void:
          	world_interaction_available = available
          	if not world_interaction_available:
          		_set_target(null)


          func is_available() -> bool:
          	return input_enabled and world_interaction_available


          func get_semantic_state() -> Dictionary:
          	var has_target: bool = current_target != null and is_instance_valid(current_target)
          	return {
          		"available": is_available(),
          		"has_target": has_target,
          		"target_name": str(current_target.name) if has_target else "",
          	}


          func _select_target() -> Node:
          	if player == null or camera == null:
          		return null
          	if not is_instance_valid(player) or not is_instance_valid(camera):
          		return null
          	if player.get_world_3d() == null:
          		return null

          	var origin: Vector3 = camera.global_position
          	var direction: Vector3 = -camera.global_transform.basis.z.normalized()
          	var query := PhysicsRayQueryParameters3D.create(
          		origin,
          		origin + direction * max_range
          	)
          	query.exclude = [player.get_rid()]
          	query.collide_with_areas = true
          	query.collide_with_bodies = true

          	var hit: Dictionary = player.get_world_3d().direct_space_state.intersect_ray(query)
          	if hit.is_empty():
          		return null

          	var collider: Node = hit.get("collider") as Node
          	var candidate: Node = _find_interactable(collider)
          	if candidate == null:
          		return null
          	if (
          		not candidate.has_method("can_interact")
          		or not candidate.has_method("interact")
          		or not candidate.has_method("set_interaction_highlighted")
          	):
          		return null
          	if not bool(candidate.call("can_interact", player)):
          		return null
          	return candidate


          func _find_interactable(collider: Node) -> Node:
          	var candidate: Node = collider
          	while candidate != null:
          		if candidate.is_in_group(INTERACTABLE_GROUP):
          			return candidate
          		candidate = candidate.get_parent()
          	return null


          func _set_target(target: Node) -> void:
          	if current_target == target:
          		return

          	if (
          		current_target != null
          		and is_instance_valid(current_target)
          		and current_target.has_method("set_interaction_highlighted")
          	):
          		current_target.call("set_interaction_highlighted", false)

          	current_target = target
          	if (
          		current_target != null
          		and is_instance_valid(current_target)
          		and current_target.has_method("set_interaction_highlighted")
          	):
          		current_target.call("set_interaction_highlighted", true)
          ''')

          Path("scenes/interaction_probe.gd").write_text(r'''extends StaticBody3D


          @export var interaction_label: String = "Interaction Probe"
          @export var interaction_enabled: bool = true
          @export var disable_after_interact: bool = false
          @export var base_color: Color = Color(0.25, 0.45, 0.75, 1.0)
          @export var highlight_color: Color = Color(0.95, 0.95, 0.35, 1.0)

          @onready var mesh: MeshInstance3D = $MeshInstance3D
          @onready var status_label: Label3D = $StatusLabel

          var _highlighted: bool = false
          var _interaction_count: int = 0
          var _material: StandardMaterial3D


          func _ready() -> void:
          	add_to_group(&"vark_interactable")
          	_material = StandardMaterial3D.new()
          	mesh.material_override = _material
          	_refresh_visual()


          func can_interact(_interactor: Node) -> bool:
          	return interaction_enabled


          func interact(_interactor: Node) -> void:
          	if not interaction_enabled:
          		return
          	_interaction_count += 1
          	if disable_after_interact:
          		interaction_enabled = false
          		_highlighted = false
          	_refresh_visual()


          func set_interaction_highlighted(highlighted: bool) -> void:
          	_highlighted = highlighted and interaction_enabled
          	_refresh_visual()


          func set_interaction_enabled(enabled: bool) -> void:
          	interaction_enabled = enabled
          	if not interaction_enabled:
          		_highlighted = false
          	_refresh_visual()


          func is_interaction_highlighted() -> bool:
          	return _highlighted


          func get_interaction_count() -> int:
          	return _interaction_count


          func _refresh_visual() -> void:
          	if _material != null:
          		_material.albedo_color = highlight_color if _highlighted else base_color
          		_material.emission_enabled = _highlighted
          		_material.emission = highlight_color
          	if status_label != null:
          		var state_text: String = "READY" if interaction_enabled else "INACTIVE"
          		status_label.text = "%s\n%s · uses: %d" % [
          			interaction_label,
          			state_text,
          			_interaction_count,
          		]
          ''')

          Path("scenes/InteractionLab.tscn").write_text(r'''[gd_scene load_steps=11 format=3]

          [ext_resource type="PackedScene" path="res://player/Player.tscn" id="1_player"]
          [ext_resource type="Script" path="res://scenes/interaction_probe.gd" id="2_probe"]

          [sub_resource type="BoxShape3D" id="FloorShape"]
