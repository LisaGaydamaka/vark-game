          size = Vector3(0.8, 1.6, 0.3)

          [sub_resource type="BoxMesh" id="DoorMesh"]
          size = Vector3(0.8, 1.6, 0.3)

          [sub_resource type="BoxShape3D" id="PropShape"]
          size = Vector3(0.7, 0.7, 0.7)

          [sub_resource type="BoxMesh" id="PropMesh"]
          size = Vector3(0.7, 0.7, 0.7)

          [sub_resource type="BoxShape3D" id="DividerShape"]
          size = Vector3(0.45, 1.8, 0.55)

          [sub_resource type="BoxMesh" id="DividerMesh"]
          size = Vector3(0.45, 1.8, 0.55)

          [node name="InteractionLab" type="Node3D"]

          [node name="DirectionalLight3D" type="DirectionalLight3D" parent="."]
          rotation_degrees = Vector3(-55, -30, 0)
          shadow_enabled = true

          [node name="Player" parent="." instance=ExtResource("1_player")]
          position = Vector3(0, 0, 2)

          [node name="Floor" type="StaticBody3D" parent="."]
          position = Vector3(0, -0.1, 0)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="Floor"]
          shape = SubResource("FloorShape")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="Floor"]
          mesh = SubResource("FloorMesh")

          [node name="DoorProbe" type="StaticBody3D" parent="."]
          position = Vector3(0, 0.8, 0)
          script = ExtResource("2_probe")
          interaction_label = "Door Contract Probe"
          base_color = Color(0.2, 0.42, 0.75, 1)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="DoorProbe"]
          shape = SubResource("DoorShape")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="DoorProbe"]
          mesh = SubResource("DoorMesh")

          [node name="StatusLabel" type="Label3D" parent="DoorProbe"]
          position = Vector3(0, 1.15, 0)
          text = "Door Contract Probe\nREADY · uses: 0"
          billboard = 1
          font_size = 28

          [node name="PropProbe" type="StaticBody3D" parent="."]
          position = Vector3(1.4, 0.4, 0.25)
          script = ExtResource("2_probe")
          interaction_label = "Prop Contract Probe"
          disable_after_interact = true
          base_color = Color(0.72, 0.38, 0.18, 1)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="PropProbe"]
          shape = SubResource("PropShape")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="PropProbe"]
          mesh = SubResource("PropMesh")

          [node name="StatusLabel" type="Label3D" parent="PropProbe"]
          position = Vector3(0, 0.65, 0)
          text = "Prop Contract Probe\nREADY · uses: 0"
          billboard = 1
          font_size = 28

          [node name="Divider" type="StaticBody3D" parent="."]
          position = Vector3(0.75, 0.9, 1.1)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="Divider"]
          shape = SubResource("DividerShape")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="Divider"]
          mesh = SubResource("DividerMesh")

          [node name="Instructions" type="Label3D" parent="."]
          position = Vector3(0, 2.3, 0.7)
          text = "3.1 INTERACTION LAB\nCenter + range + clear line = highlight\nE = primary interaction"
          billboard = 1
          font_size = 30
          ''')

          Path("tests/application/interaction_regressions.gd").write_text(r'''extends RefCounted


          const ApplicationScene = preload("res://application/Application.tscn")
          const ApplicationRoot = preload("res://application/application_root.gd")


          func run(tree: SceneTree, assert_true: Callable) -> void:
          	_release_interact()
          	var application: Node = ApplicationScene.instantiate()
          	var default_labels: PackedStringArray = application.get("development_launch_labels")
          	var default_paths: PackedStringArray = application.get("development_launch_resource_paths")
          	assert_true.call(
          		default_labels.has("Interaction Lab")
          		and default_paths.has("res://scenes/InteractionLab.tscn"),
          		"Application Development Launch exposes the 3.1 Interaction Lab"
          	)

          	application.set(
          		"development_launch_labels",
          		PackedStringArray(["Interaction Lab"])
          	)
          	application.set(
          		"development_launch_resource_paths",
          		PackedStringArray(["res://scenes/InteractionLab.tscn"])
          	)
          	tree.get_root().add_child(application)
          	await tree.process_frame

          	var launched: bool = bool(application.call("launch_development_target", 0))
          	await tree.process_frame
          	await tree.physics_frame
          	var world: Node = application.get("current_world") as Node
          	var player: Node3D = application.get("current_player") as Node3D
          	assert_true.call(
          		launched
          		and world != null
          		and world.name == &"InteractionLab"
          		and player != null
          		and int(application.call("get_control_mode")) == ApplicationRoot.ControlMode.GAMEPLAY,
          		"Interaction Lab launches through the production application/session/input path"
          	)
          	if world == null or player == null:
          		_release_interact()
          		application.queue_free()
          		await tree.process_frame
          		return

          	var camera: Camera3D = player.get_node("Head/Camera3D") as Camera3D
          	var door: Node3D = world.get_node("DoorProbe") as Node3D
          	var prop: Node3D = world.get_node("PropProbe") as Node3D
          	var divider: Node3D = world.get_node("Divider") as Node3D

          	_aim(camera, door)
          	await tree.physics_frame
          	var centered_state: Dictionary = player.call("get_interaction_semantic_state")
          	assert_true.call(
          		bool(door.call("is_interaction_highlighted"))
          		and bool(centered_state.get("has_target", false))
          		and centered_state.get("target_name", "") == "DoorProbe",
          		"Center-view interaction targeting highlights the first eligible in-range hit"
          	)

          	player.global_position = Vector3(0, 0, 5)
          	player.set("velocity", Vector3.ZERO)
          	_aim(camera, door)
          	await tree.physics_frame
          	assert_true.call(
          		not bool(door.call("is_interaction_highlighted"))
          		and not bool((player.call("get_interaction_semantic_state") as Dictionary).get("has_target", false)),
          		"Interaction targeting rejects an otherwise valid target outside the configured range"
          	)

          	player.global_position = Vector3(0, 0, 2)
          	player.set("velocity", Vector3.ZERO)
          	_aim(camera, prop)
          	await tree.physics_frame
          	assert_true.call(
          		not bool(prop.call("is_interaction_highlighted")),
          		"Interaction targeting treats the first blocking physics hit as occlusion"
          	)

          	var divider_position: Vector3 = divider.position
          	divider.position = Vector3(-3, divider_position.y, divider_position.z)
          	_aim(camera, prop)
          	await tree.physics_frame
          	assert_true.call(
          		bool(prop.call("is_interaction_highlighted")),
          		"An eligible target highlights once the center-view line is unobstructed"
          	)

          	prop.call("set_interaction_enabled", false)
          	await tree.physics_frame
          	assert_true.call(
          		not bool(prop.call("is_interaction_highlighted"))
          		and not bool((player.call("get_interaction_semantic_state") as Dictionary).get("has_target", false)),
          		"Target-owned current-state eligibility can reject interaction without changing the selector"
          	)
          	prop.call("set_interaction_enabled", true)

          	_aim(camera, door)
          	await tree.physics_frame
          	var door_count_before: int = int(door.call("get_interaction_count"))
          	Input.action_press("interact")
          	await tree.physics_frame
          	var first_count: int = int(door.call("get_interaction_count"))
          	await tree.physics_frame
          	var held_count: int = int(door.call("get_interaction_count"))
          	Input.action_release("interact")
          	await tree.physics_frame
          	Input.action_press("interact")
          	await tree.physics_frame
          	var second_count: int = int(door.call("get_interaction_count"))
          	Input.action_release("interact")
          	await tree.physics_frame
          	assert_true.call(
          		first_count == door_count_before + 1
          		and held_count == first_count
          		and second_count == first_count + 1,
          		"Primary interaction consumes one fresh application-owned edge instead of repeating while held"
          	)

          	player.call("set_world_interaction_available", false)
          	var unavailable_state: Dictionary = player.call("get_interaction_semantic_state")
          	var unavailable_count_before: int = int(door.call("get_interaction_count"))
          	Input.action_press("interact")
          	await tree.physics_frame
          	Input.action_release("interact")
          	await tree.physics_frame
          	assert_true.call(
          		not bool(unavailable_state.get("available", true))
          		and not bool(door.call("is_interaction_highlighted"))
          		and int(door.call("get_interaction_count")) == unavailable_count_before,
          		"Player interaction ownership can centrally suppress ordinary world interaction"
          	)

          	player.call("set_world_interaction_available", true)
          	_aim(camera, door)
          	await tree.physics_frame
          	assert_true.call(
          		bool(door.call("is_interaction_highlighted"))
          		and bool((player.call("get_interaction_semantic_state") as Dictionary).get("available", false)),
          		"Central interaction availability can resume without teaching the interactable private owner state"
          	)

          	_release_interact()
          	application.call("exit_current_world")
          	application.queue_free()
          	await tree.process_frame


          func _aim(camera: Camera3D, target: Node3D) -> void:
          	camera.look_at(target.global_position, Vector3.UP)


          func _release_interact() -> void:
          	Input.action_release("interact")
          ''')

          replace_once(
              "project.godot",
              "\n[physics]\n",
              '''\ninteract={\n"deadzone": 0.2,\n"events": [Object(InputEventKey,"resource_local_to_scene":false,"resource_name":"","device":-1,"window_id":0,"alt_pressed":false,"shift_pressed":false,"ctrl_pressed":false,"meta_pressed":false,"pressed":false,"keycode":0,"physical_keycode":69,"key_label":0,"unicode":101,"location":0,"echo":false,"script":null)\n]\n}\n\n[physics]\n'''
          )

          replace_once(
              "application/Application.tscn",
              'development_launch_labels = PackedStringArray("VarkTest", "Playground")\ndevelopment_launch_resource_paths = PackedStringArray("res://scenes/VarkTest.tscn", "res://missions/playground/mission.tres")',
              'development_launch_labels = PackedStringArray("VarkTest", "Playground", "Interaction Lab")\ndevelopment_launch_resource_paths = PackedStringArray("res://scenes/VarkTest.tscn", "res://missions/playground/mission.tres", "res://scenes/InteractionLab.tscn")'
          )

          replace_once(
              "application/application_input_boundary.gd",
              'var _crouch_blocked_until_release: bool = false\n',
              'var _crouch_blocked_until_release: bool = false\nvar _interact_blocked_until_release: bool = false\nvar _last_interaction_sampled_physics_frame: int = -1\nvar _last_interaction_pressed: bool = false\n'
          )
          replace_once(
              "application/application_input_boundary.gd",
              '''\tif current_player != null and is_instance_valid(current_player):\n\t\tcurrent_player.call("bind_gameplay_input_boundary", null)\n''',
              '''\tif current_player != null and is_instance_valid(current_player):\n\t\tcurrent_player.call("set_interaction_input_enabled", false)\n\t\tcurrent_player.call("bind_gameplay_input_boundary", null)\n'''
          )
          replace_once(
              "application/application_input_boundary.gd",
              '''\tif current_player != null:\n\t\tcurrent_player.call("bind_gameplay_input_boundary", self)\n\t\tif look_enabled:\n''',
              '''\tif current_player != null:\n\t\tcurrent_player.call("bind_gameplay_input_boundary", self)\n\t\tcurrent_player.call("set_interaction_input_enabled", gameplay_enabled)\n\t\tif look_enabled:\n'''
          )
          replace_once(
              "application/application_input_boundary.gd",
              '''\tgameplay_enabled = enabled\n\t_last_sampled_physics_frame = -1\n\t_last_locomotion_command = PlayerCommand.new()\n\n\tif enabled:\n''',
              '''\tgameplay_enabled = enabled\n\t_last_sampled_physics_frame = -1\n\t_last_locomotion_command = PlayerCommand.new()\n\t_last_interaction_sampled_physics_frame = -1\n\t_last_interaction_pressed = false\n\tif current_player != null and is_instance_valid(current_player):\n\t\tcurrent_player.call("set_interaction_input_enabled", enabled)\n\n\tif enabled:\n'''
          )
          replace_once(
              "application/application_input_boundary.gd",
              '''\t\t_crouch_blocked_until_release = (\n\t\t\tInput.is_action_pressed("crouch")\n\t\t\tor Input.is_action_just_pressed("crouch")\n\t\t)\n\t\treturn\n\n\t_jump_blocked_until_release = Input.is_action_pressed("jump")\n\t_crouch_blocked_until_release = Input.is_action_pressed("crouch")\n''',
              '''\t\t_crouch_blocked_until_release = (\n\t\t\tInput.is_action_pressed("crouch")\n\t\t\tor Input.is_action_just_pressed("crouch")\n\t\t)\n\t\t_interact_blocked_until_release = (\n\t\t\tInput.is_action_pressed("interact")\n\t\t\tor Input.is_action_just_pressed("interact")\n\t\t)\n\t\treturn\n\n\t_jump_blocked_until_release = Input.is_action_pressed("jump")\n\t_crouch_blocked_until_release = Input.is_action_pressed("crouch")\n\t_interact_blocked_until_release = Input.is_action_pressed("interact")\n'''
          )
          replace_once(
              "application/application_input_boundary.gd",
              '''\t_last_locomotion_command = command\n\treturn _last_locomotion_command\n\n\nfunc route_input_event(event: InputEvent) -> void:\n''',
              '''\t_last_locomotion_command = command\n\treturn _last_locomotion_command\n\n\nfunc sample_interaction_pressed() -> bool:\n\tvar physics_frame: int = Engine.get_physics_frames()\n\tif physics_frame == _last_interaction_sampled_physics_frame:\n\t\treturn _last_interaction_pressed\n\n\t_last_interaction_sampled_physics_frame = physics_frame\n\t_last_interaction_pressed = false\n\tif not gameplay_enabled:\n\t\treturn false\n\n\tvar interact_held: bool = Input.is_action_pressed("interact")\n\tif _interact_blocked_until_release:\n\t\tif not interact_held:\n\t\t\t_interact_blocked_until_release = false\n\t\treturn false\n\n\t_last_interaction_pressed = Input.is_action_just_pressed("interact")\n\treturn _last_interaction_pressed\n\n\nfunc route_input_event(event: InputEvent) -> void:\n'''
          )

          replace_once(
              "player/player.gd",
              '@onready var head: Node3D = $Head\n',
              '@onready var head: Node3D = $Head\n@onready var view_camera: Camera3D = $Head/Camera3D\n'
          )
          replace_once(
              "player/player.gd",
              '''@export_category("Look")\n@export var mouse_sensitivity: float = 0.007\n\n\nvar gameplay_input_boundary: Node = null\n''',
              '''@export_category("Look")\n@export var mouse_sensitivity: float = 0.007\n\n\n@export_category("Interaction")\n@export var interaction_range: float = 2.5\n\n\nvar gameplay_input_boundary: Node = null\n'''
          )
          replace_once(
              "player/player.gd",
              'var locomotion_controller: PlayerLocomotionController\n',
              'var locomotion_controller: PlayerLocomotionController\nvar player_interaction: PlayerInteraction\n'
          )
          replace_once(
              "player/player.gd",
              '''\t\tcommand = player_input.sample()\n\n\tplayer_input.current_command = command\n''',
              '''\t\tcommand = player_input.sample()\n\n\tvar interact_pressed: bool = false\n\tif gameplay_input_boundary != null and is_instance_valid(gameplay_input_boundary):\n\t\tinteract_pressed = bool(gameplay_input_boundary.call("sample_interaction_pressed"))\n\telse:\n\t\tinteract_pressed = Input.is_action_just_pressed("interact")\n\n\tplayer_input.current_command = command\n'''
          )
          replace_once(
              "player/player.gd",
              '''\t\tif ledge_controller.is_active():\n\t\t\tvelocity_state.capture_body_as_controlled(self)\n\n\nfunc _unhandled_input(event: InputEvent) -> void:\n''',
              '''\t\tif ledge_controller.is_active():\n\t\t\tvelocity_state.capture_body_as_controlled(self)\n\n\tif player_interaction != null:\n\t\tplayer_interaction.update(interact_pressed)\n\n\nfunc _unhandled_input(event: InputEvent) -> void:\n'''
          )
          replace_once(
