name: Finish phase 3.4 external model door seam

on:
  push:
    branches: [test]
    paths:
      - .github/workflows/phase_3_4_external_model_patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply bounded phase 3.4 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          door_script = "gameplay/doors/ordinary_door.gd"
          replace_once(
              door_script,
              '@export var base_color: Color = Color(0.34, 0.20, 0.10, 1.0)\n\n@onready var door_mesh: MeshInstance3D = $DoorMesh',
              '@export var base_color: Color = Color(0.34, 0.20, 0.10, 1.0)\n@export var visual_model: Mesh\n\n@onready var door_mesh: MeshInstance3D = $DoorMesh',
          )
          replace_once(
              door_script,
              '\t_material = StandardMaterial3D.new()\n\tdoor_mesh.material_override = _material\n\t_sync_derived_state()',
              '\t_material = StandardMaterial3D.new()\n\tdoor_mesh.material_override = _material\n\tif not set_visual_model(visual_model):\n\t\tpush_error("VarkOrdinaryDoor requires a configured visual_model Mesh.")\n\t_sync_derived_state()',
          )
          replace_once(
              door_script,
              'func is_interaction_highlighted() -> bool:\n\treturn _highlighted\n\n\nfunc get_semantic_phase() -> StringName:',
              'func is_interaction_highlighted() -> bool:\n\treturn _highlighted\n\n\nfunc set_visual_model(model: Mesh) -> bool:\n\tif model == null:\n\t\treturn false\n\tvisual_model = model\n\tif door_mesh != null:\n\t\tdoor_mesh.mesh = model\n\treturn true\n\n\nfunc get_visual_model() -> Mesh:\n\treturn visual_model\n\n\nfunc get_semantic_phase() -> StringName:',
          )

          Path("gameplay/doors/OrdinaryDoor.tscn").write_text('''[gd_scene load_steps=4 format=3]\n\n[ext_resource type="Script" path="res://gameplay/doors/ordinary_door.gd" id="1_door"]\n[ext_resource type="ArrayMesh" path="res://assets/models/doors/ordinary_door_leaf.obj" id="2_visual"]\n\n[sub_resource type="BoxShape3D" id="DoorShape"]\nsize = Vector3(1.3, 2.1, 0.12)\n\n[node name="OrdinaryDoor" type="AnimatableBody3D"]\nscript = ExtResource("1_door")\nvisual_model = ExtResource("2_visual")\n\n[node name="DoorMesh" type="MeshInstance3D" parent="."]\nposition = Vector3(0.65, 1.05, 0)\n\n[node name="CollisionShape3D" type="CollisionShape3D" parent="."]\nposition = Vector3(0.65, 1.05, 0)\nshape = SubResource("DoorShape")\n''', encoding="utf-8")

          model_dir = Path("assets/models/doors")
          model_dir.mkdir(parents=True, exist_ok=True)
          (model_dir / "ordinary_door_leaf.obj").write_text('''# Vark ordinary-door presentation proof mesh. Gameplay collision/state live in the door archetype.\no ordinary_door_leaf\nv -0.65 -1.05 0.06\nv 0.65 -1.05 0.06\nv 0.65 1.05 0.06\nv -0.65 1.05 0.06\nv -0.65 -1.05 -0.06\nv -0.65 1.05 -0.06\nv 0.65 1.05 -0.06\nv 0.65 -1.05 -0.06\nvn 0 0 1\nvn 0 0 -1\nvn -1 0 0\nvn 1 0 0\nvn 0 1 0\nvn 0 -1 0\nf 1//1 2//1 3//1 4//1\nf 5//2 6//2 7//2 8//2\nf 5//3 1//3 4//3 6//3\nf 2//4 8//4 7//4 3//4\nf 4//5 3//5 7//5 6//5\nf 5//6 8//6 2//6 1//6\n''', encoding="utf-8")
          (model_dir / "ordinary_door_leaf_narrow.obj").write_text('''# Compatible alternate presentation proof mesh. Gameplay collision/state remain archetype-owned.\no ordinary_door_leaf_narrow\nv -0.55 -1.00 0.05\nv 0.55 -1.00 0.05\nv 0.55 1.00 0.05\nv -0.55 1.00 0.05\nv -0.55 -1.00 -0.05\nv -0.55 1.00 -0.05\nv 0.55 1.00 -0.05\nv 0.55 -1.00 -0.05\nvn 0 0 1\nvn 0 0 -1\nvn -1 0 0\nvn 1 0 0\nvn 0 1 0\nvn 0 -1 0\nf 1//1 2//1 3//1 4//1\nf 5//2 6//2 7//2 8//2\nf 5//3 1//3 4//3 6//3\nf 2//4 8//4 7//4 3//4\nf 4//5 3//5 7//5 6//5\nf 5//6 8//6 2//6 1//6\n''', encoding="utf-8")

          tests = "tests/application/door_regressions.gd"
          replace_once(
              tests,
              'const OrdinaryDoor = preload("res://gameplay/doors/ordinary_door.gd")\n',
              'const OrdinaryDoor = preload("res://gameplay/doors/ordinary_door.gd")\nconst DefaultDoorVisual: Mesh = preload("res://assets/models/doors/ordinary_door_leaf.obj")\nconst AlternateDoorVisual: Mesh = preload("res://assets/models/doors/ordinary_door_leaf_narrow.obj")\n',
          )
          replace_once(
              tests,
              '\tvar door_mesh: MeshInstance3D = door.get_node("DoorMesh") as MeshInstance3D\n\tvar door_material: StandardMaterial3D = door_mesh.material_override as StandardMaterial3D\n',
              '\tvar door_mesh: MeshInstance3D = door.get_node("DoorMesh") as MeshInstance3D\n\tvar door_collision: CollisionShape3D = door.get_node("CollisionShape3D") as CollisionShape3D\n\tvar door_material: StandardMaterial3D = door_mesh.material_override as StandardMaterial3D\n',
          )
          closed = '''\tassert_true.call(\n\t\t_first_ray_collider(world, Vector3(0, 1.1, 1.5), Vector3(0, 1.1, -2.2)) == door\n\t\tand _door_overlaps_passage_probe(world, door),\n\t\t"Closed ordinary door is the physical and vision obstruction across its doorway"\n\t)\n'''
          replacement = closed + '''\n\tvar configured_visual: Mesh = door.call("get_visual_model") as Mesh\n\tvar state_before_model_swap: Dictionary = door.call("capture_semantic_state")\n\tvar centered_before_model_swap: Dictionary = player.call("get_interaction_semantic_state")\n\tvar collision_shape_before_model_swap: Shape3D = door_collision.shape\n\tvar door_instance_id_before_model_swap: int = door.get_instance_id()\n\tassert_true.call(\n\t\tconfigured_visual == DefaultDoorVisual\n\t\tand door_mesh.mesh == DefaultDoorVisual\n\t\tand configured_visual.resource_path == "res://assets/models/doors/ordinary_door_leaf.obj",\n\t\t"Ordinary door instantiates its visible leaf from the configured external model resource"\n\t)\n\n\tvar swapped_model: bool = bool(door.call("set_visual_model", AlternateDoorVisual))\n\tvar replacement_visual: Mesh = door.call("get_visual_model") as Mesh\n\tvar centered_after_model_swap: Dictionary = player.call("get_interaction_semantic_state")\n\tassert_true.call(\n\t\tswapped_model\n\t\tand door.get_instance_id() == door_instance_id_before_model_swap\n\t\tand door.get_script() == OrdinaryDoor\n\t\tand replacement_visual == AlternateDoorVisual\n\t\tand door_mesh.mesh == AlternateDoorVisual\n\t\tand door_collision.shape == collision_shape_before_model_swap\n\t\tand door.call("capture_semantic_state") == state_before_model_swap\n\t\tand centered_before_model_swap.get("target_name", "") == "OrdinaryDoor"\n\t\tand centered_after_model_swap.get("target_name", "") == "OrdinaryDoor"\n\t\tand bool(door.call("is_interaction_highlighted"))\n\t\tand door_mesh.material_override == door_material\n\t\tand door.is_in_group(&"vark_interactable")\n\t\tand not bool(door.call("is_navigation_passage_open"))\n\t\tand is_zero_approx(float(door.call("get_acoustic_openness"))),\n\t\t"Compatible model replacement keeps the same semantic owner, interaction target, collider, highlight, and door-side state"\n\t)\n\tassert_true.call(\n\t\t_first_ray_collider(world, Vector3(0, 1.1, 1.5), Vector3(0, 1.1, -2.2)) == door\n\t\tand _door_overlaps_passage_probe(world, door),\n\t\t"Visual model replacement does not replace the closed-door collision or vision obstruction"\n\t)\n'''
          replace_once(tests, closed, replacement)

          plan = "docs/DEVELOPMENT_PLAN.md"
          replace_once(
              plan,
              'The current 3.4 implementation proves those behavior seams with project-owned placeholder box presentation. Before 3.4 can become `[x]`, move the visible leaf behind a replaceable external 3D-model presentation seam and prove that choosing/swapping the model does not replace the ordinary-door semantic owner, interaction contract, collision/vision behavior, events, or save-state contract. An openable window is simply a door/opening variant using this same archetype/integration path; no separate window subsystem is planned.',
              'The 3.4 implementation now keeps the visible leaf behind an exported `Mesh` presentation seam. `OrdinaryDoor.tscn` selects a project-authored external OBJ model by default, and the Door Lab regression swaps that presentation to a second compatible OBJ while retaining the same ordinary-door instance, interaction target, collider/vision obstruction, semantic state, events, and save-state behavior. The model remains presentation/configuration rather than semantic identity. An openable window is simply a door/opening variant using this same archetype/integration path; no separate window subsystem is planned. 3.4 remains `[~]` until the resulting implementation head passes its required automated barrier and the focused Windows manual acceptance is reported.',
          )
          replace_once(
              plan,
              '**Automated:** the existing focused Application regression covers the current door behavior seams through `Door Lab`. Before `[x]`, extend that deterministic coverage to prove the configured external-model presentation instantiates through the same ordinary-door archetype and that compatible model replacement does not change its semantic/collision/interaction/state behavior; then run the authoritative all-tests barrier on the resulting implementation head.',
              '**Automated:** the focused Application regression covers the ordinary-door behavior seams through `Door Lab` and now additionally proves that the configured external OBJ instantiates through the same ordinary-door archetype, then swaps to a compatible alternate model without replacing the door owner, interaction target, collider/vision obstruction, semantic state, highlight surface, events, consumer seams, or restore behavior. The regression remains wired into the authoritative all-tests barrier; the resulting implementation head must pass that barrier before 3.4 can be accepted.',
          )

          testing = "docs/TESTING.md"
          old_testing = 'Phase 3.4 adds a dedicated real `Door Lab` regression through that same production application/session/player path: the ordinary door reuses center-view/F selection, its one physical leaf is both collision and closed-door vision obstruction, opening/closing advances explicit semantic phase/progress, accepted use emits the reserved `door.use` gameplay-sound source fact, completed transitions emit `door.state_changed`, narrow acoustic-openness/navigation-passage seams follow the same door state, and semantic capture/apply restores stable/in-progress state without replaying consequences.'
          new_testing = old_testing + ' The same regression now loads the door leaf from its configured external OBJ model, swaps it to a second compatible external OBJ on the existing door instance, and proves that presentation replacement leaves interaction ownership, collision/vision obstruction, semantic state, highlight material, events, consumer seams, and capture/apply behavior under the unchanged ordinary-door archetype.'
          replace_once(testing, old_testing, new_testing)
          PY

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Verify model import metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/models/doors/ordinary_door_leaf.obj.import
          test -f assets/models/doors/ordinary_door_leaf_narrow.obj.import

      - name: Run focused application regressions
        run: godot --headless --path . --script res://tests/application/run_application_tests.gd

      - name: Run authoritative regression barrier
        run: godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Verify exact final diff and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase_3_4_external_model_patch.yml

          while IFS= read -r generated_uid; do
            rm -- "$generated_uid"
          done < <(git ls-files --others --exclude-standard -- '*.gd.uid')

          git diff --check
          mapfile -t changed < <(git status --short --untracked-files=all | sed -E 's/^.. //' | sort)
          expected=(
            ".github/workflows/phase_3_4_external_model_patch.yml"
            "assets/models/doors/ordinary_door_leaf.obj"
            "assets/models/doors/ordinary_door_leaf.obj.import"
            "assets/models/doors/ordinary_door_leaf_narrow.obj"
            "assets/models/doors/ordinary_door_leaf_narrow.obj.import"
            "docs/DEVELOPMENT_PLAN.md"
            "docs/TESTING.md"
            "gameplay/doors/OrdinaryDoor.tscn"
            "gameplay/doors/ordinary_door.gd"
            "tests/application/door_regressions.gd"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

          remote_head=$(git ls-remote origin refs/heads/test | awk '{print $1}')
          test "$remote_head" = "$GITHUB_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/phase_3_4_external_model_patch.yml
          git add \
            assets/models/doors/ordinary_door_leaf.obj \
            assets/models/doors/ordinary_door_leaf.obj.import \
            assets/models/doors/ordinary_door_leaf_narrow.obj \
            assets/models/doors/ordinary_door_leaf_narrow.obj.import \
            docs/DEVELOPMENT_PLAN.md \
            docs/TESTING.md \
            gameplay/doors/OrdinaryDoor.tscn \
            gameplay/doors/ordinary_door.gd \
            tests/application/door_regressions.gd
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Finish 3.4 external model door seam"
          git push origin HEAD:test
