name: Inspect Phase 3.5 transition patch anchors

on:
  push:
    branches:
      - test

jobs:
  inspect-transition-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
      - name: Print recovered documentation patch anchors
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path
          source = Path('.github/workflows/finalize_phase_3_5_transition_ownership.yml').read_text(encoding='utf-8')
          match = re.search(r"payload = '''([A-Za-z0-9+/=]+)'''", source)
          packed = base64.b64decode(match.group(1))
          script = zlib.decompress(packed[2:-4], -zlib.MAX_WBITS).decode('utf-8')
          lines = script.splitlines()
          for index, line in enumerate(lines):
              if any(token in line for token in ('GAME_VISION', 'DEVELOPMENT_PLAN', 'TESTING')):
                  start = max(0, index - 12)
                  end = min(len(lines), index + 18)
                  print('\n--- recovered patch around line', index + 1, '---')
                  print('\n'.join(f'{n + 1:04d}: {lines[n]}' for n in range(start, end)))
          PY
