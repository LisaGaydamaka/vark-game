name: Run Phase 3.5 prop physics correction

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  run-phase-3-5-prop-physics-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout authoritative test head
        uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0

      - name: Apply staged correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix_phase_3_5_prop_physics.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code_lines = []
          for line in source[start:end]:
              if line.startswith('          '):
                  code_lines.append(line[10:])
              else:
                  code_lines.append(line)
          code = '\n'.join(code_lines)
          exec(compile(code, 'phase_3_5_prop_physics_fix.py', 'exec'), {})
          PY

      - name: Remove temporary helpers and verify bounded diff
        shell: bash
        run: |
          rm .github/workflows/fix_phase_3_5_prop_physics.yml
          rm .github/workflows/run_phase_3_5_prop_physics_fix.yml
          git diff --check
          test "$(git status --short | sed 's/^...//' | sort)" = "$(printf '%s\n' \
            .github/workflows/fix_phase_3_5_prop_physics.yml \
            .github/workflows/run_phase_3_5_prop_physics_fix.yml \
            assets/models/props/ordinary_crate.obj \
            assets/models/props/ordinary_crate_tall.obj \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            docs/TESTING.md \
            gameplay/props/OrdinaryProp.tscn \
            gameplay/props/ordinary_prop.gd \
            player/interaction/player_prop_carry.gd \
            scenes/PropLab.tscn \
            tests/props/prop_regressions.gd | sort)"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run authoritative regression barrier
        run: godot --headless --path . --script res://tests/run_all_tests.gd

      - name: Commit corrected prop physics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/models/props/ordinary_crate.obj \
            assets/models/props/ordinary_crate_tall.obj \
            docs/DEVELOPMENT_PLAN.md \
            docs/GAME_VISION.md \
            docs/TESTING.md \
            gameplay/props/OrdinaryProp.tscn \
            gameplay/props/ordinary_prop.gd \
            player/interaction/player_prop_carry.gd \
            scenes/PropLab.tscn \
            tests/props/prop_regressions.gd \
            .github/workflows/fix_phase_3_5_prop_physics.yml \
            .github/workflows/run_phase_3_5_prop_physics_fix.yml
          git diff --cached --check
          git commit -m "Use real rigid physics for Phase 3.5 props"
          git push origin HEAD:test
