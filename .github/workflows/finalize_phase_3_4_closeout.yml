name: Finalize Phase 3.4 closeout

on:
  push:
    branches: [test]
    paths:
      - .github/workflows/finalize_phase_3_4_closeout.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Remove stale Phase 3.4 wording
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/DEVELOPMENT_PLAN.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "The 3.4 implementation now keeps the visible leaf behind an exported `Mesh` presentation seam. `OrdinaryDoor.tscn` selects a project-authored external OBJ model by default, and the Door Lab regression swaps that presentation to a second compatible OBJ while retaining the same ordinary-door instance, interaction target, collider/vision obstruction, semantic state, events, and save-state behavior. The model remains presentation/configuration rather than semantic identity. An openable window is simply a door/opening variant using this same archetype/integration path; no separate window subsystem is planned. 3.4 remains `[~]` until the resulting implementation head passes its required automated barrier and the focused Windows manual acceptance is reported.": "The 3.4 implementation keeps the visible leaf behind an exported `Mesh` presentation seam. `OrdinaryDoor.tscn` selects a project-authored external OBJ model by default, and the Door Lab regression swaps that presentation to a second compatible OBJ while retaining the same ordinary-door instance, interaction target, collider/vision obstruction, semantic state, events, and save-state behavior. The model remains presentation/configuration rather than semantic identity. An openable window is simply a door/opening variant using this same archetype/integration path; no separate window subsystem is planned. Phase 3.4 is accepted after the required automated barrier and focused Windows manual validation both passed.",
              "The door does not implement propagation, hearing, a nav framework, or guard logic. `capture_semantic_state()` / `apply_semantic_state()` preserve phase plus progress and rebuild the derived hinge pose without replaying sound or state-change consequences.": "The door does not implement propagation, hearing, a nav framework, or guard logic. `capture_semantic_state()` / `apply_semantic_state()` preserve phase, progress, and the latched blocked-motion state, then rebuild the derived hinge pose without replaying sound or state-change consequences.",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one roadmap match, found {count}: {old[:80]}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

      - name: Commit bounded cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize_phase_3_4_closeout.yml
          changed_paths="$(git status --short --untracked-files=all | sed 's/^...//' | sort)"
          expected_paths="$(printf '%s\n' '.github/workflows/finalize_phase_3_4_closeout.yml' 'docs/DEVELOPMENT_PLAN.md' | sort)"
          test "$changed_paths" = "$expected_paths" || {
            git status --short --untracked-files=all
            exit 1
          }
          git diff --check
          remote_sha="$(git ls-remote origin refs/heads/test | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPMENT_PLAN.md .github/workflows/finalize_phase_3_4_closeout.yml
          git diff --cached --check
          git commit -m "Finalize Phase 3.4 roadmap closeout"
          git push origin HEAD:test
