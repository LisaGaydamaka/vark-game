name: Repair 3.1 carrier v2

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair 3.1 carrier matching'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test
          fetch-depth: 0
      - name: Correct carrier target by context
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/implement_3_1.yml')
          lines = path.read_text().splitlines()
          changed = 0
          for index, line in enumerate(lines[:-1]):
              if (
                  line.strip() == '"docs/TESTING.md",'
                  and 'gameplay-intent one-tick edge lifetime' in lines[index + 1]
              ):
                  lines[index] = line.replace('docs/TESTING.md', 'docs/DEVELOPMENT_PLAN.md')
                  changed += 1
          if changed != 1:
              raise SystemExit(f'expected one contextual documentation target, changed {changed}')
          path.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          git rm .github/workflows/repair_3_1_carrier.yml
          git rm .github/workflows/repair_3_1_carrier_v2.yml
          git add .github/workflows/implement_3_1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare 3.1 interaction implementation"
          git push origin HEAD:test
