name: Test

on:
  push:
    branches:
      - test
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-suite:
    name: Regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Diagnose visibility suite
        run: timeout 180s godot --headless --path . --script res://tests/visibility/run_visibility_tests.gd

      - name: Run regression suites
        run: godot --headless --path . --script res://tests/run_all_tests.gd
